<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Adivina el Número PRO · Chris Arcade</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at 50% 15%, #2b1854 0%, #110926 55%, #060311 100%);
        color: #f8fafc;
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }
      .boveda-card {
        width: min(480px, 100%);
        background: linear-gradient(155deg, rgba(39, 24, 78, 0.94), rgba(15, 10, 36, 0.96));
        border: 2px solid rgba(236, 72, 153, 0.45);
        border-radius: 32px;
        padding: 26px 22px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      h2 {
        margin: 0 0 6px;
        font-size: 2rem;
        color: #f472b6;
        text-shadow: 0 0 18px rgba(244, 114, 182, 0.45);
      }
      .sub {
        margin: 0 0 16px;
        font-size: 0.92rem;
        color: #cbd5e1;
      }
      .hud-adivina {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      .hud-item {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        padding: 8px;
      }
      .hud-item small {
        display: block;
        font-size: 0.7rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .hud-item strong {
        font-size: 1.35rem;
        color: #fde047;
      }
      /* Radar de rango 1..100 */
      .radar-wrap {
        margin: 14px 0 18px;
        text-align: left;
      }
      .radar-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        color: #a5b4fc;
        font-weight: 900;
        margin-bottom: 5px;
      }
      .radar-bar {
        position: relative;
        height: 16px;
        background: rgba(2, 6, 23, 0.9);
        border-radius: 999px;
        border: 1px solid rgba(168, 85, 247, 0.4);
        overflow: hidden;
      }
      .radar-zona {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0%;
        width: 100%;
        background: linear-gradient(90deg, #ec4899, #8b5cf6, #38bdf8);
        border-radius: 999px;
        transition: left 0.28s ease, width 0.28s ease;
      }
      .controles-fila {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 12px;
      }
      #guess {
        width: 150px;
        padding: 13px;
        font-size: 1.4rem;
        font-weight: 900;
        text-align: center;
        border-radius: 16px;
        border: 2px solid #f472b6;
        background: #090518;
        color: #ffffff;
        outline: none;
      }
      .btn-probar {
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white;
        border: none;
        padding: 13px 26px;
        border-radius: 16px;
        font-size: 1.1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(236, 72, 153, 0.4);
        transition: 0.18s;
      }
      .btn-probar:hover {
        transform: translateY(-2px);
      }
      .atajos-rango {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-bottom: 12px;
      }
      .btn-chip {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.8rem;
        font-weight: 800;
        cursor: pointer;
      }
      .btn-chip:hover {
        background: rgba(236, 72, 153, 0.25);
        border-color: #f472b6;
      }
      #feedback {
        min-height: 1.8em;
        font-size: 1.35rem;
        font-weight: 900;
        margin: 10px 0;
        color: #38bdf8;
      }
      .historial {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        min-height: 34px;
        margin: 12px 0 18px;
      }
      .intento-tag {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 900;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.3);
      }
      .acciones-pie {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-sec {
        background: rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 800;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="boveda-card">
      <h2>🔮 Oráculo Secreto (1-100)</h2>
      <p class="sub">Usa el radar térmico y descifra el código en menos intentos</p>

      <div class="hud-adivina">
        <div class="hud-item">
          <small>INTENTOS</small>
          <strong id="intentos">0</strong>
        </div>
        <div class="hud-item">
          <small>RANGO POSIBLE</small>
          <strong id="rangoTexto">1 - 100</strong>
        </div>
        <div class="hud-item">
          <small>RACHA</small>
          <strong id="racha">0 🔥</strong>
        </div>
      </div>

      <div class="radar-wrap">
        <div class="radar-labels">
          <span id="lblMin">Mín: 1</span>
          <span id="lblTermometro">🌡️ Esperando señal...</span>
          <span id="lblMax">Máx: 100</span>
        </div>
        <div class="radar-bar">
          <div id="radarZona" class="radar-zona"></div>
        </div>
      </div>

      <div class="controles-fila">
        <input
          type="number"
          id="guess"
          min="1"
          max="100"
          placeholder="50"
          onkeydown="if(event.key==='Enter') verificar()"
        />
        <button class="btn-probar" id="btnProbar" onclick="verificar()">
          Probar 🎯
        </button>
      </div>

      <div class="atajos-rango">
        <button type="button" class="btn-chip" onclick="usarMitad()">
          ⚡ Probar Mitad Exacta
        </button>
        <button type="button" class="btn-chip" onclick="ajustarInput(-5)">
          -5
        </button>
        <button type="button" class="btn-chip" onclick="ajustarInput(5)">
          +5
        </button>
      </div>

      <p id="feedback">¡Escribe un número entre 1 y 100!</p>
      <div class="historial" id="historial"></div>

      <div class="acciones-pie">
        <button type="button" class="btn-sec" onclick="reiniciarPartida()">
          🔄 Nuevo Código
        </button>
        <a href="/secreto" class="btn-sec">🏠 Volver al Menú</a>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script>
      let secret = Math.floor(Math.random() * 100) + 1;
      let minPosible = 1;
      let maxPosible = 100;
      let intentos = 0;
      let racha = 0;
      let terminado = false;
      let audioCtx = null;

      function sonarTono(freq, dur = 0.1, tipo = "sine") {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = tipo;
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.06, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g).connect(audioCtx.destination);
          o.start();
          o.stop(audioCtx.currentTime + dur);
        } catch (_) {}
      }

      function actualizarRadar() {
        document.getElementById("rangoTexto").innerText = `${minPosible} - ${maxPosible}`;
        document.getElementById("lblMin").innerText = `Mín: ${minPosible}`;
        document.getElementById("lblMax").innerText = `Máx: ${maxPosible}`;
        const izq = ((minPosible - 1) / 99) * 100;
        const ancho = Math.max(3, ((maxPosible - minPosible) / 99) * 100);
        const barra = document.getElementById("radarZona");
        barra.style.left = `${izq}%`;
        barra.style.width = `${ancho}%`;
      }

      function usarMitad() {
        if (terminado) return;
        const mitad = Math.round((minPosible + maxPosible) / 2);
        document.getElementById("guess").value = mitad;
        verificar();
      }

      function ajustarInput(delta) {
        if (terminado) return;
        const inp = document.getElementById("guess");
        const base = parseInt(inp.value, 10) || Math.round((minPosible + maxPosible) / 2);
        inp.value = Math.max(minPosible, Math.min(maxPosible, base + delta));
      }

      function verificar() {
        if (terminado) {
          reiniciarPartida();
          return;
        }
        const inp = document.getElementById("guess");
        const val = parseInt(inp.value, 10);
        const fb = document.getElementById("feedback");
        if (isNaN(val) || val < 1 || val > 100) {
          fb.style.color = "#f87171";
          fb.innerText = "⚠️ Ingresa un número válido del 1 al 100";
          return;
        }

        intentos++;
        document.getElementById("intentos").innerText = intentos;
        const diff = Math.abs(val - secret);
        const term = document.getElementById("lblTermometro");

        const tag = document.createElement("span");
        tag.className = "intento-tag";

        if (val === secret) {
          terminado = true;
          racha++;
          document.getElementById("racha").innerText = `${racha} 🔥`;
          minPosible = maxPosible = secret;
          actualizarRadar();
          term.innerText = "🎯 ¡CÓDIGO DESCIFRADO!";
          fb.style.color = "#4ade80";
          fb.innerText = `¡Ganaste en ${intentos} intento${intentos > 1 ? "s" : ""}! 🎉`;
          tag.style.borderColor = "#4ade80";
          tag.style.color = "#4ade80";
          tag.innerText = `🎯 ${val}`;
          document.getElementById("historial").appendChild(tag);
          sonarTono(523.25, 0.12, "triangle");
          setTimeout(() => sonarTono(659.25, 0.14, "triangle"), 110);
          setTimeout(() => sonarTono(783.99, 0.22, "triangle"), 230);
          return;
        }

        if (val > secret) {
          maxPosible = Math.min(maxPosible, val - 1);
          fb.style.color = "#38bdf8";
          fb.innerText = `Más bajo ⬇️ (El secreto es menor que ${val})`;
          tag.innerText = `${val} ⬇️`;
          sonarTono(310, 0.09, "sine");
        } else {
          minPosible = Math.max(minPosible, val + 1);
          fb.style.color = "#f472b6";
          fb.innerText = `Más alto ⬆️ (El secreto es mayor que ${val})`;
          tag.innerText = `${val} ⬆️`;
          sonarTono(420, 0.09, "sine");
        }

        if (diff <= 3) term.innerText = "🔥 ¡HIRVIENDO! (Muy cerca)";
        else if (diff <= 10) term.innerText = "🌶️ ¡Caliente!";
        else if (diff <= 22) term.innerText = "🌡️ Tibio";
        else term.innerText = "❄️ Frío";

        document.getElementById("historial").appendChild(tag);
        actualizarRadar();
        inp.select();
      }

      function reiniciarPartida() {
        secret = Math.floor(Math.random() * 100) + 1;
        minPosible = 1;
        maxPosible = 100;
        intentos = 0;
        terminado = false;
        document.getElementById("intentos").innerText = "0";
        document.getElementById("lblTermometro").innerText = "🌡️ Esperando señal...";
        document.getElementById("feedback").style.color = "#38bdf8";
        document.getElementById("feedback").innerText = "¡Nuevo código generado! Prueba suerte";
        document.getElementById("historial").innerHTML = "";
        document.getElementById("guess").value = "";
        actualizarRadar();
      }

      function alGanarJuego(misPuntos) {
        enviarPuntaje("/guardar_tu_juego", { puntos: misPuntos });
      }
    </script>
  </body>
</html>

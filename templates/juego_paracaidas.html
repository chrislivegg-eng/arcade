<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7ec8ff" />
    <title>Paracaidista · Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='juegos3d.css') }}"
    />
    <style>
      #altura {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 46vh;
        border-radius: 10px;
        background: linear-gradient(
          #4fb3ff 0 70%,
          #26de81 70% 88%,
          #ff3b3b 88%
        );
        border: 3px solid #fff;
        z-index: 5;
      }
      #altura i {
        position: absolute;
        left: -10px;
        width: 30px;
        height: 6px;
        border-radius: 3px;
        background: #222;
      }
      #abrir {
        position: fixed;
        left: 50%;
        bottom: calc(70px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 6;
        border: none;
        border-radius: 40px;
        padding: 16px 32px;
        font-family: inherit;
        font-weight: 900;
        font-size: 1.2rem;
        background: linear-gradient(135deg, #ff7a00, #ff3b3b);
        color: #fff;
        box-shadow: 0 10px 26px rgba(255, 59, 59, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="altura" class="oculto"><i id="marca-altura"></i></div>
    <button id="abrir" class="oculto">🪂 ¡ABRIR PARACAÍDAS!</button>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/graficos3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, azar, limitar, lin, sonar } = Arcade;
      const ALTURA = 1200; // metros (escala del juego: 1 unidad = 1 m)
      const ABRIR_MIN = 200,
        ABRIR_MAX = 600;
      const V_CAIDA = 55,
        V_PARACAIDAS = 24;

      // =========================================================
      //  ESCENA
      // =========================================================
      const M = Arcade.mundo({
        fondo: 0x7ec8ff,
        fov: 65,
        niebla: [150, 900],
        exposicion: 1.05,
        colorAmbiente: 0xcfefff,
        lejos: 2000,
      });
      const { escena, camara } = M;
      const acabado3D = Graficos3D.configurar(M, "cielo");
      const mat = (c, x = {}) =>
        Arcade.materialPBR({ color: lin(c), roughness: 0.8, ...x });
      escena.add(new THREE.HemisphereLight(0xeaf6ff, 0x5a7a3a, 0.9));
      const sol = new THREE.DirectionalLight(0xfff0d8, 1.1);
      sol.position.set(100, 400, 100);
      escena.add(sol);
      // suelo con campos
      const texCampo = M.textura(512, 512, (g, w, h) => {
        const colores = [
          "#7cb342",
          "#9ccc65",
          "#c0a060",
          "#689f38",
          "#aed581",
          "#d4b06a",
        ];
        for (let x = 0; x < w; x += 64)
          for (let y = 0; y < h; y += 64)
            ((g.fillStyle =
              colores[Math.floor(Math.random() * colores.length)]),
              g.fillRect(x, y, 64, 64));
        g.strokeStyle = "rgba(60,40,20,.3)";
        for (let i = 0; i <= w; i += 64)
          (g.strokeRect(i, 0, 0, h), g.strokeRect(0, i, w, 0));
      });
      texCampo.wrapS = texCampo.wrapT = THREE.RepeatWrapping;
      texCampo.repeat.set(12, 12);
      const suelo = new THREE.Mesh(
        new THREE.PlaneGeometry(3000, 3000),
        Arcade.materialPBR({ map: texCampo }),
      );
      suelo.rotation.x = -Math.PI / 2;
      escena.add(suelo);
      acabado3D.superficie(suelo, "cesped", { repetir: 30 });
      // diana de aterrizaje
      const texDiana = M.textura(256, 256, (g, w, h) => {
        ["#ffffff", "#e0323c", "#ffffff", "#e0323c", "#ffd84f"].forEach(
          (c, i) => {
            g.beginPath();
            g.arc(w / 2, h / 2, (w / 2) * (1 - i / 5), 0, Math.PI * 2);
            g.fillStyle = c;
            g.fill();
          },
        );
      });
      const diana = new THREE.Mesh(
        new THREE.CircleGeometry(25, 48),
        new THREE.MeshBasicMaterial({ map: texDiana }),
      );
      diana.rotation.x = -Math.PI / 2;
      diana.position.y = 0.3;
      escena.add(diana);
      // nubes
      const nubes = [];
      for (let i = 0; i < 40; i++) {
        const n = new THREE.Mesh(
          new THREE.SphereGeometry(azar(15, 35), 10, 8),
          Arcade.materialPBR({
            color: 0xffffff,
            transparent: true,
            opacity: 0.75,
            roughness: 1,
          }),
        );
        n.scale.y = 0.4;
        n.position.set(azar(-400, 400), azar(250, 1100), azar(-400, 400));
        escena.add(n);
        nubes.push(n);
      }
      // paracaidista
      const persona = new THREE.Group();
      const traje = mat(0xff4f8b);
      persona.add(
        Object.assign(
          new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 1.1), traje),
          {},
        ),
      );
      const cabeza = new THREE.Mesh(
        new THREE.SphereGeometry(0.17, 12, 10),
        mat(0x222244),
      );
      cabeza.position.z = -0.7;
      persona.add(cabeza);
      [-1, 1].forEach((l) => {
        const brazo = new THREE.Mesh(
          new THREE.BoxGeometry(0.7, 0.1, 0.12),
          traje,
        );
        brazo.position.set(l * 0.55, 0, -0.3);
        brazo.rotation.y = l * 0.4;
        persona.add(brazo);
        const pierna = new THREE.Mesh(
          new THREE.BoxGeometry(0.15, 0.12, 0.7),
          mat(0x333344),
        );
        pierna.position.set(l * 0.2, 0, 0.85);
        pierna.rotation.y = -l * 0.2;
        persona.add(pierna);
      });
      escena.add(persona);
      const vela = new THREE.Mesh(
        new THREE.SphereGeometry(3, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2.6),
        Arcade.materialPBR({
          color: lin(0xffd84f),
          side: THREE.DoubleSide,
          roughness: 0.6,
        }),
      );
      vela.visible = false;
      escena.add(vela);
      // aros
      const geoAro = new THREE.TorusGeometry(9, 0.8, 10, 40);
      let aros = [];

      // =========================================================
      //  ESTADO
      // =========================================================
      const J = { modo: null, activa: false };
      const ciclo = Arcade.ciclo(J, { animar: (...args) => M.animar(...args) });
      const P = {
        x: 0,
        y: ALTURA,
        z: 0,
        vx: 0,
        vz: 0,
        abierto: false,
        puntos: 0,
        aros: 0,
        vivo: false,
        ox: 0,
        oz: 0,
      };

      function generar(semilla) {
        aros.forEach((a) => escena.remove(a.malla));
        aros = [];
        const r = Arcade.rng(semilla);
        let x = 0,
          z = 0;
        for (let y = ALTURA - 90; y > ABRIR_MAX + 40; y -= 55) {
          x = limitar(x + (r() - 0.5) * 50, -120, 120);
          z = limitar(z + (r() - 0.5) * 50, -120, 120);
          const dorado = r() < 0.15;
          const m = new THREE.Mesh(
            geoAro,
            mat(dorado ? 0xffd700 : 0xff4f8b, {
              emissive: lin(dorado ? 0xffa500 : 0xff4f8b),
              emissiveIntensity: 0.6,
            }),
          );
          m.rotation.x = Math.PI / 2;
          m.position.set(x, y, z);
          escena.add(m);
          aros.push({ malla: m, x, y, z, dorado, pasado: false });
        }
        // la diana queda cerca del último aro
        diana.position.x = limitar(x + (r() - 0.5) * 80, -150, 150);
        diana.position.z = limitar(z + (r() - 0.5) * 80, -150, 150);
      }

      // controles: arrastrar mueve al paracaidista (como un joystick)
      let toque = null;
      M.lienzo.addEventListener(
        "pointerdown",
        (e) => (toque = { x: e.clientX, y: e.clientY }),
      );
      M.lienzo.addEventListener("pointermove", (e) => {
        if (!toque) return;
        P.ox = limitar((e.clientX - toque.x) / 90, -1, 1);
        P.oz = limitar((e.clientY - toque.y) / 90, -1, 1);
      });
      const soltar = () => ((toque = null), (P.ox = P.oz = 0));
      M.lienzo.addEventListener("pointerup", soltar);
      M.lienzo.addEventListener("pointercancel", soltar);
      const teclas = {};
      document.addEventListener("keydown", (e) => {
        teclas[e.key] = true;
        if (e.key === " ") abrir();
      });
      document.addEventListener("keyup", (e) => (teclas[e.key] = false));
      $("abrir").onclick = abrir;

      function abrir() {
        if (!P.vivo || P.abierto) return;
        P.abierto = true;
        P.alturaApertura = Math.round(P.y);
        vela.visible = true;
        vela.scale.set(0.1, 0.1, 0.1);
        $("abrir").classList.add("oculto");
        sonar("swoosh", 1.2);
        if (P.y > ABRIR_MAX) {
          ui.avisar("😬 Lo abriste muy alto: menos puntos", "#ffd84f");
          P.puntos -= 50;
        } else ui.avisar("🪂 ¡Bien abierto!", "#26de81");
        marcador();
      }

      M.alCuadro((dt, ahora) => {
        nubes.forEach((n, i) => (n.position.x += Math.sin(i) * dt * 2));
        if (!J.modo) {
          camara.position.set(
            Math.sin(ahora / 5000) * 60,
            700,
            Math.cos(ahora / 5000) * 60,
          );
          camara.lookAt(0, 400, 0);
          return;
        }
        if (P.vivo) {
          const ox =
            P.ox +
            (teclas.ArrowRight || teclas.d ? 1 : 0) -
            (teclas.ArrowLeft || teclas.a ? 1 : 0);
          const oz =
            P.oz +
            (teclas.ArrowDown || teclas.s ? 1 : 0) -
            (teclas.ArrowUp || teclas.w ? 1 : 0);
          const vel = P.abierto ? 14 : 34;
          P.vx += (ox * vel - P.vx) * Math.min(1, dt * 3);
          P.vz += (oz * vel - P.vz) * Math.min(1, dt * 3);
          P.x += P.vx * dt;
          P.z += P.vz * dt;
          const caida = P.abierto ? V_PARACAIDAS : V_CAIDA;
          P.y -= caida * dt;
          // aros
          aros.forEach((a) => {
            if (a.pasado || P.y > a.y) return;
            a.pasado = true;
            if (Math.hypot(P.x - a.x, P.z - a.z) < 9) {
              const p = a.dorado ? 50 : 20;
              P.puntos += p;
              P.aros++;
              a.malla.material.color.set(lin(0x26de81));
              sonar("perfecto", 1 + P.aros * 0.03);
              ui.avisar(
                a.dorado ? "✨ ¡Aro dorado! +50" : "+20",
                a.dorado ? "#ffd700" : "#26de81",
              );
            } else
              Object.assign(a.malla.material, {
                transparent: true,
                opacity: 0.3,
              });
            marcador();
          });
          if (!P.abierto && P.y < ABRIR_MAX + 80)
            $("abrir").classList.remove("oculto");
          if (P.y <= 0) aterrizar();
          $("marca-altura").style.top = (1 - P.y / ALTURA) * 100 + "%";
        }
        persona.position.set(P.x, Math.max(0.5, P.y), P.z);
        persona.rotation.set(
          P.abierto ? 0 : -Math.PI / 2 + 0.3,
          0,
          -P.vx * 0.01,
        );
        if (P.abierto) persona.rotation.x = 0;
        vela.position.set(P.x, Math.max(0.5, P.y) + 4, P.z);
        vela.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 4));
        // cámara: arriba y atrás, mirando hacia abajo
        const foco = new THREE.Vector3(P.x, Math.max(0, P.y), P.z);
        const quiero = foco
          .clone()
          .add(
            P.abierto
              ? new THREE.Vector3(0, 9, 16)
              : new THREE.Vector3(0, 14, 6),
          );
        camara.position.lerp(quiero, Math.min(1, dt * 4));
        camara.lookAt(
          foco.x,
          foco.y - (P.abierto ? 6 : 30),
          foco.z - (P.abierto ? 2 : 4),
        );
      });

      async function aterrizar() {
        const sesionTarea = J.sesion || 0;
        P.vivo = false;
        $("abrir").classList.add("oculto");
        const d = Math.hypot(P.x - diana.position.x, P.z - diana.position.z);
        if (!P.abierto || P.alturaApertura < ABRIR_MIN) {
          sonar("choque");
          ui.avisar(
            !P.abierto
              ? "💥 ¡No abriste el paracaídas!"
              : "💥 ¡Lo abriste muy tarde!",
            "#ff3b3b",
          );
          P.puntos = Math.max(0, Math.round(P.puntos / 2));
        } else {
          const bono = Math.max(0, Math.round(200 - d * 4));
          P.puntos += bono;
          sonar(bono > 150 ? "ganar" : "perfecto");
          ui.avisar(
            bono > 150
              ? `🎯 ¡Al centro! +${bono}`
              : bono
                ? `Aterrizaje +${bono}`
                : "Caíste lejos de la diana",
            bono ? "#26de81" : "#ffd84f",
          );
        }
        marcador();
        await esperar(1800);
        if (sesionTarea !== (J.sesion || 0)) return;
        terminarSalto();
      }

      // =========================================================
      //  PARTIDA
      // =========================================================
      const ui = Arcade.ui({
        juego: "paracaidas",
        titulo: "Paracaidista",
        emoji: "🪂",
        subtitulo: "Pasa por los aros y aterriza en la diana",
        modos: ["solo", "online", "local"],
        textosModo: {
          online: "🌐 Reto online (mismos aros)",
          local: "👥 2 jugadores (por turnos)",
        },
        records: true,
        unidadRecord: "pts",
        reglas: [
          "Arrastra el dedo para moverte mientras caes (como un control).",
          "Pasa por los aros rosas (+20) y los dorados (+50).",
          `Abre el paracaídas entre ${ABRIR_MAX} y ${ABRIR_MIN} metros (zona verde). Si lo abres tarde… 💥`,
          "Aterriza lo más cerca del centro de la diana para ganar hasta 200 puntos extra.",
        ],
        alEmpezar: empezar,
        alSalir: () => {
          ciclo.cancelar();
          P.vivo = false;
          J.modo = null;
          $("altura").classList.add("oculto");
          $("abrir").classList.add("oculto");
        },
      });
      ui.alEvento = (tipo, d) => {
        if (!d || d.partida !== J.partida) return;
        if (tipo === "fin") {
          J.rival = d.puntos;
          J.rivalTermino = true;
          J.alTerminarRival && J.alTerminarRival();
          marcador();
        }
      };
      function marcador() {
        const det = P.vivo
          ? `${Math.max(0, Math.round(P.y))} m · ${P.aros} aros`
          : `${P.aros} aros`;
        if (J.modo === "solo")
          return ui.marcador([
            {
              nombre: J.nombres[0],
              valor: P.puntos,
              detalle: det,
              activo: true,
            },
            null,
          ]);
        if (J.modo === "online") {
          const yo = ui.yo;
          const v =
            yo === 0 ? [P.puntos, J.rival ?? "—"] : [J.rival ?? "—", P.puntos];
          return ui.marcador(
            [0, 1].map((i) => ({
              nombre: J.nombres[i] + (i === yo ? " (tú)" : ""),
              valor: v[i],
              detalle:
                i === yo ? det : J.rivalTermino ? "aterrizó" : "cayendo…",
              activo: i === yo,
            })),
          );
        }
        ui.marcador(
          [0, 1].map((i) => ({
            nombre: J.nombres[i],
            valor: i === J.turno ? P.puntos : (J.resultados[i] ?? "—"),
            detalle: i === J.turno ? det : "",
            activo: i === J.turno,
          })),
        );
      }
      function empezar(modo, info) {
        ciclo.cancelar();
        Object.assign(J, {
          modo,
          nombres: info.nombres,
          partida: info.partida,
          semilla: info.semilla,
          resultados: [null, null],
          turno: 0,
          rival: null,
          rivalTermino: false,
          alTerminarRival: null,
        });
        nuevoSalto();
      }
      function nuevoSalto() {
        generar(J.semilla);
        Object.assign(P, {
          x: 0,
          y: ALTURA,
          z: 0,
          vx: 0,
          vz: 0,
          abierto: false,
          puntos: 0,
          aros: 0,
          vivo: true,
          ox: 0,
          oz: 0,
          alturaApertura: null,
        });
        vela.visible = false;
        camara.position.set(0, ALTURA + 20, 10);
        $("altura").classList.remove("oculto");
        if (J.modo === "local")
          ui.avisar(
            `Salta ${J.nombres[J.turno]}`,
            J.turno ? "#4fb3ff" : "#ff4f8b",
          );
        ui.ayuda("👆 Arrastra para moverte");
        ciclo.despues(() => ui.ayuda(""), 3500);
        sonar("swoosh", 1.4);
        marcador();
      }
      async function terminarSalto() {
        const sesionTarea = J.sesion || 0;
        if (!J.modo) return;
        const pts = P.puntos;
        if (J.modo === "solo") {
          sonar("ganar");
          return ui.terminar({
            emoji: "🪂",
            texto: `¡${pts} puntos!`,
            nota: `${P.aros} aros · abriste a ${P.alturaApertura ?? "—"} m`,
            record: pts,
          });
        }
        if (J.modo === "local") {
          J.resultados[J.turno] = pts;
          if (J.turno === 0) {
            J.turno = 1;
            return nuevoSalto();
          }
          const [a, b] = J.resultados;
          return ui.terminar({
            emoji: a === b ? "🤝" : "🏆",
            texto: a === b ? "¡Empate!" : `¡Ganó ${J.nombres[a > b ? 0 : 1]}!`,
            nota: `${J.nombres[0]} ${a} - ${b} ${J.nombres[1]}`,
          });
        }
        ui.enviar("fin", { partida: J.partida, puntos: pts });
        if (!J.rivalTermino) {
          ui.avisar("Esperando a tu rival…", "#4fb3ff");
          await Promise.race([
            new Promise((r) => (J.alTerminarRival = r)),
            esperar(90000),
          ]);
          if (sesionTarea !== (J.sesion || 0)) return;
        }
        const yo = ui.yo;
        const rival = J.rival ?? 0;
        const gane = pts > rival,
          empate = pts === rival;
        sonar(gane ? "ganar" : "perder");
        ui.terminar({
          emoji: empate ? "🤝" : gane ? "🏆" : "😿",
          texto: empate
            ? "¡Empate!"
            : gane
              ? "¡Mejor salto!"
              : `Ganó ${J.nombres[1 - yo]}`,
          nota: `Tú: ${pts} · ${J.nombres[1 - yo]}: ${rival}`,
          record: pts,
        });
      }
      generar(1);
    </script>
  </body>
</html>

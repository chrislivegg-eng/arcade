<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071325" />
    <title>{% if juego == 'agar' %}Agar.io{% elif juego == 'slither' %}Slither.io{% else %}Black Hole.io{% endif %} · Chris Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
    <style>
      body{margin:0;overflow:hidden;background:#071325;font-family:Nunito,Arial,sans-serif;touch-action:none}
      #lienzo{position:fixed;inset:0;width:100%;height:100%;display:block;background:#071325}
      #io-marca{position:fixed;top:14px;left:16px;color:#fff;font-weight:900;letter-spacing:.14em;font-size:.72rem;opacity:.74;pointer-events:none;z-index:3}
      #io-marca b{color:#78f7ff}.io-leyenda{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#dffcff;background:#071325bb;border:1px solid #70ebff55;border-radius:20px;padding:7px 13px;font-size:.72rem;font-weight:900;pointer-events:none;z-index:2;white-space:nowrap}
      @media(max-width:600px){.io-leyenda{bottom:12px;font-size:.64rem;max-width:88vw;white-space:normal;text-align:center}}
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas><div id="io-marca">CHRIS <b>ARCADE</b> / IO ARENA</div><div class="io-leyenda">Arrastra para moverte · absorbe lo pequeño · evita lo grande</div>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const TIPO = {{ juego|tojson }};
      const CONFIG = {
        agar: { titulo:"Agar.io", emoji:"🫧", color:"#65d7ff", meta:230, subtitulo:"Absorbe células, crece y domina la arena", unidad:"masa" },
        slither: { titulo:"Slither.io", emoji:"🐍", color:"#b7ff55", meta:175, subtitulo:"Una serpiente neón: come orbes y no choques", unidad:"orbes" },
        black_hole: { titulo:"Black Hole.io", emoji:"🕳️", color:"#c995ff", meta:330, subtitulo:"Devora la ciudad antes que el agujero rival", unidad:"masa" },
      }[TIPO];
      const { $, limitar, azar } = Arcade;
      const canvas=$("lienzo"), ctx=canvas.getContext("2d");
      const W=2300, PALETA=["#62d9ff","#ff6b9d","#b7ff55","#ffcf57","#b38cff","#ff8f62"];
      let dpr=1, raf=0, ultimo=0;
      const P={ activa:false, partida:0, modo:"solo", t:0, comida:[], bots:[], player:null, objetivo:{x:0,y:0}, victoria:false };
      function redimensionar(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
      addEventListener("resize",redimensionar);redimensionar();
      function entidad(i, jugador=false){const color=jugador?CONFIG.color:PALETA[i%PALETA.length];return {x:azar(-W/2,W/2),y:azar(-W/2,W/2),tx:0,ty:0,r:jugador?(TIPO==="black_hole"?28:23):azar(15,31),masa:jugador?32:azar(22,62),color,angulo:azar(0,Math.PI*2),viva:true,trail:[]}}
      function llenar(){P.comida=[];const n=TIPO==="black_hole"?180:300;for(let i=0;i<n;i++)P.comida.push({x:azar(-W/2,W/2),y:azar(-W/2,W/2),r:azar(3,8),color:PALETA[i%PALETA.length],valor:TIPO==="black_hole"?azar(2,7):1});}
      function iniciar(modo, info){cancelAnimationFrame(raf);P.activa=true;P.partida=info.partida;P.modo=modo;P.t=0;P.victoria=false;P.player=entidad(0,true);P.player.x=P.player.y=0;P.objetivo={x:0,y:0};P.bots=modo==="solo"?[]:Array.from({length:TIPO==="slither"?8:6},(_,i)=>entidad(i+1));llenar();marcador();ultimo=performance.now();raf=requestAnimationFrame(ciclo);}
      function marcador(){const yo=P.player||{masa:0};const rival=P.bots.reduce((m,b)=>Math.max(m,b.masa),0);ui.marcador([{nombre:"Tú",valor:Math.floor(yo.masa),detalle:CONFIG.unidad,color:CONFIG.color},{nombre:P.modo==="solo"?"Meta": "Bot Pro",valor:P.modo==="solo"?CONFIG.meta:Math.floor(rival),detalle:P.modo==="solo"?CONFIG.unidad:"masa",color:"#ff6b9d"}]);}
      const ui=Arcade.ui({juego:TIPO,titulo:CONFIG.titulo,emoji:CONFIG.emoji,subtitulo:CONFIG.subtitulo,modos:["solo","bot"],textosModo:{solo:"🏆 Récord individual",bot:"🤖 Arena contra bots"},dificultad:true,records:true,unidadRecord:CONFIG.unidad,reglas:["Arrastra en la dirección a la que quieres avanzar.",TIPO==="slither"?"Come orbes para alargar tu serpiente. Si chocas con otro cuerpo, pierdes.":"Absorbe objetivos pequeños para crecer. Los grandes pueden absorberte.","En modo bot gana quien llegue primero a la masa objetivo."],alEmpezar:iniciar,alSalir:()=>{P.activa=false;cancelAnimationFrame(raf)}});
      function coordenada(e){const r=canvas.getBoundingClientRect(), p=e.touches?e.touches[0]:e;return {x:(p.clientX-r.left)-r.width/2,y:(p.clientY-r.top)-r.height/2}}
      function apuntar(e){if(!P.activa)return;const q=coordenada(e);P.objetivo={x:q.x,y:q.y};}
      canvas.addEventListener("pointerdown",apuntar);canvas.addEventListener("pointermove",apuntar);canvas.addEventListener("touchstart",apuntar,{passive:true});canvas.addEventListener("touchmove",apuntar,{passive:true});
      addEventListener("keydown",e=>{if(!P.activa)return;const paso=150;if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")P.objetivo.y-=paso;if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")P.objetivo.y+=paso;if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")P.objetivo.x-=paso;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")P.objetivo.x+=paso;});
      function mover(a,tx,ty,dt){const dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy)||1;const vel=TIPO==="slither"?155:230*Math.max(.42,1-a.r/180);a.x+=dx/dist*vel*dt;a.y+=dy/dist*vel*dt;a.x=limitar(a.x,-W/2,W/2);a.y=limitar(a.y,-W/2,W/2);a.angulo=Math.atan2(dy,dx);if(TIPO==="slither"){a.trail.unshift({x:a.x,y:a.y});a.trail.length=Math.min(44,Math.floor(a.masa/4)+12);}}
      function comer(a,dt){for(let i=P.comida.length-1;i>=0;i--){const c=P.comida[i],dist=Math.hypot(a.x-c.x,a.y-c.y);if(dist<a.r+c.r+5){a.masa+=c.valor;a.r+=c.valor*(TIPO==="black_hole"?.09:.025);P.comida.splice(i,1);P.comida.push({x:azar(-W/2,W/2),y:azar(-W/2,W/2),r:azar(3,8),color:PALETA[(i+P.t|0)%PALETA.length],valor:TIPO==="black_hole"?azar(2,7):1});}}}
      function choque(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<a.r+b.r*.62){const grande=a.masa>b.masa*1.13?a:b, chico=grande===a?b:a;if(grande===P.player&&chico.viva){grande.masa+=chico.masa*.35;grande.r+=chico.r*.18;chico.viva=false;}else if(chico===P.player&&grande.viva){fin(false);}}}
      function ia(b,dt,i){let objetivo=P.comida[(i*31+Math.floor(P.t*3))%P.comida.length];if(P.player&&P.player.viva){const d=Math.hypot(P.player.x-b.x,P.player.y-b.y);if(d<300)objetivo=b.masa>P.player.masa*1.2?P.player:{x:b.x-(P.player.x-b.x),y:b.y-(P.player.y-b.y)};}mover(b,objetivo.x,objetivo.y,dt);comer(b,dt);}
      function fin(gano){if(!P.activa)return;P.activa=false;cancelAnimationFrame(raf);const score=Math.floor(P.player.masa);ui.terminar({emoji:gano?"🏆":"💥",texto:gano?"¡Dominaste la arena!":"Te absorbieron…",nota:gano?`${score} ${CONFIG.unidad} conseguidos`:`Llegaste a ${score} ${CONFIG.unidad}`,record:score,gano});}
      function actualizar(dt){P.t+=dt;mover(P.player,P.player.x+P.objetivo.x,P.player.y+P.objetivo.y,dt);P.objetivo.x*=.86;P.objetivo.y*=.86;comer(P.player,dt);P.bots=P.bots.filter(b=>b.viva);P.bots.forEach((b,i)=>ia(b,dt,i));for(let i=0;i<P.bots.length;i++)choque(P.player,P.bots[i]);for(let i=0;i<P.bots.length;i++)for(let j=i+1;j<P.bots.length;j++)choque(P.bots[i],P.bots[j]);if(P.player.masa>=CONFIG.meta)fin(true);if(P.modo==="bot"&&P.bots.some(b=>b.masa>=CONFIG.meta))fin(false);marcador();}
      function circulo(x,y,r,color,brillo=0){const g=ctx.createRadialGradient(x-r*.3,y-r*.35,1,x,y,r);g.addColorStop(0,"#fff9");g.addColorStop(.25,color);g.addColorStop(1,brillo?"#020510":"#0006");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
      function dibujar(){const w=innerWidth,h=innerHeight,p=P.player||{x:0,y:0};ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,"#081d35");bg.addColorStop(1,"#120a2b");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const escala=limitar(1.18-p.r/260,.58,1.05),ox=w/2-p.x*escala,oy=h/2-p.y*escala;ctx.save();ctx.translate(ox,oy);ctx.scale(escala,escala);ctx.strokeStyle="#75eaff12";ctx.lineWidth=2;for(let x=-W/2;x<W/2;x+=100){ctx.beginPath();ctx.moveTo(x,-W/2);ctx.lineTo(x,W/2);ctx.stroke()}for(let y=-W/2;y<W/2;y+=100){ctx.beginPath();ctx.moveTo(-W/2,y);ctx.lineTo(W/2,y);ctx.stroke()}P.comida.forEach(c=>{ctx.shadowColor=c.color;ctx.shadowBlur=12;circulo(c.x,c.y,c.r,c.color);ctx.shadowBlur=0});const todos=[...P.bots,P.player].filter(Boolean);todos.forEach(a=>{if(TIPO==="slither"&&a.trail.length){ctx.strokeStyle=a.color;ctx.lineWidth=Math.max(10,a.r*1.15);ctx.lineCap="round";ctx.beginPath();a.trail.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke()}ctx.shadowColor=a.color;ctx.shadowBlur=22;circulo(a.x,a.y,a.r,a.color,TIPO==="black_hole");ctx.shadowBlur=0;if(a===P.player){ctx.fillStyle="#fff";ctx.font="900 13px Nunito";ctx.textAlign="center";ctx.fillText("TÚ",a.x,a.y-a.r-12)}});ctx.restore();if(P.activa){ctx.fillStyle="#ffffffcc";ctx.font="900 14px Nunito";ctx.textAlign="right";ctx.fillText(`META ${CONFIG.meta}`,w-18,30);}}
      function ciclo(t){if(!P.activa)return;const dt=Math.min(.035,(t-ultimo)/1000||0);ultimo=t;actualizar(dt);dibujar();raf=requestAnimationFrame(ciclo);}
    </script>
  </body>
</html>

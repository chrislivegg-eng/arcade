<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071325" />
    <title>{% if juego == 'agar' %}Agar.io{% elif juego == 'slither' %}Slither.io{% else %}Black Hole.io{% endif %} · Chris Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
    <style>
      body{margin:0;overflow:hidden;background:#071325;font-family:Nunito,Arial,sans-serif;touch-action:none}
      #lienzo{position:fixed;inset:0;width:100%;height:100%;display:block;background:#071325}
      #io-marca{position:fixed;top:14px;left:16px;color:#fff;font-weight:900;letter-spacing:.14em;font-size:.72rem;opacity:.74;pointer-events:none;z-index:3}
      #io-marca b{color:#78f7ff}.io-leyenda{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#dffcff;background:#071325bb;border:1px solid #70ebff55;border-radius:20px;padding:7px 13px;font-size:.72rem;font-weight:900;pointer-events:none;z-index:2;white-space:nowrap}
      @media(max-width:600px){.io-leyenda{bottom:12px;font-size:.64rem;max-width:88vw;white-space:normal;text-align:center}}
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas><div id="io-marca">CHRIS <b>ARCADE</b> / IO ARENA</div><div class="io-leyenda" id="io-leyenda">Arrastra para moverte · absorbe lo pequeño · evita lo grande</div>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const TIPO = {{ juego|tojson }};
      const CONFIG = {
        agar: { titulo:"Agar.io", emoji:"🫧", color:"#65d7ff", meta:230, subtitulo:"Divide, expulsa masa y domina la arena", unidad:"masa" },
        slither: { titulo:"Slither.io", emoji:"🐍", color:"#b7ff55", meta:175, subtitulo:"Acelera, rodea y convierte rivales en orbes", unidad:"orbes" },
        black_hole: { titulo:"Black Hole.io", emoji:"🕳️", color:"#c995ff", meta:330, subtitulo:"Devora una ciudad viva antes que el vórtice rival", unidad:"masa" },
      }[TIPO];
      const { $, limitar, azar } = Arcade;
      const canvas=$("lienzo"), ctx=canvas.getContext("2d");
      const W=2300, PALETA=["#62d9ff","#ff6b9d","#b7ff55","#ffcf57","#b38cff","#ff8f62"];
      let dpr=1, raf=0, ultimo=0;
      const P={ activa:false, partida:0, modo:"solo", t:0, comida:[], bots:[], player:null, objetivo:{x:0,y:0}, victoria:false, boost:false, ultimaDivision:-9, tiempo:0, limite:150, mensaje:"" };
      function redimensionar(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
      addEventListener("resize",redimensionar);redimensionar();
      function entidad(i, jugador=false){const color=jugador?CONFIG.color:PALETA[i%PALETA.length];const masa=jugador?32:azar(25,68);return {x:azar(-W/2,W/2),y:azar(-W/2,W/2),tx:0,ty:0,r:jugador?(TIPO==="black_hole"?28:23):azar(15,31),masa,color,angulo:azar(0,Math.PI*2),viva:true,trail:[],nombre:jugador?"TÚ":["Nova","Pixel","Cometa","Luna","Cosmo","Menta","Rayo","Kiwi","Nébula"][i%9],patron:i%5,recarga:0,invulnerable:0,objetivo:null};}
      function objetoCiudad(i){const valor=azar(2,9), r=valor*2.1+5;return {x:azar(-W/2,W/2),y:azar(-W/2,W/2),r,color:["#6ed1ff","#ffe07d","#ff8b9f","#a9ffaf"][i%4],valor,edificio:true,w:r*1.15,h:r*(1.1+azar(0,1.5)),tipo:["CASA","AUTO","TORRE","PARQUE"][i%4]};}
      function nuevaComida(i){return TIPO==="black_hole"?objetoCiudad(i):{x:azar(-W/2,W/2),y:azar(-W/2,W/2),r:azar(3,8),color:PALETA[i%PALETA.length],valor:1};}
      function llenar(){P.comida=[];const n=TIPO==="black_hole"?210:360;for(let i=0;i<n;i++)P.comida.push(nuevaComida(i));}
      function textoControles(){return TIPO==="agar"?"Arrastra o usa WASD · ESPACIO divide · W expulsa masa":TIPO==="slither"?"Arrastra para girar · mantén pulsado para acelerar · no choques":"Arrastra para moverte · devora edificios más pequeños · gana antes del rival"}
      function iniciar(modo, info){cancelAnimationFrame(raf);P.activa=true;P.partida=info.partida;P.modo=modo;P.t=0;P.tiempo=0;P.boost=false;P.ultimaDivision=-9;P.victoria=false;P.mensaje="";P.player=entidad(0,true);P.player.x=P.player.y=0;P.objetivo={x:0,y:0};P.bots=modo==="solo"?[]:Array.from({length:TIPO==="slither"?9:7},(_,i)=>entidad(i+1));llenar();$("io-leyenda").textContent=textoControles();marcador();ultimo=performance.now();raf=requestAnimationFrame(ciclo);}
      function marcador(){const yo=P.player||{masa:0};const rival=P.bots.reduce((m,b)=>Math.max(m,b.masa),0);ui.marcador([{nombre:"Tú",valor:Math.floor(yo.masa),detalle:CONFIG.unidad,color:CONFIG.color},{nombre:P.modo==="solo"?"Meta": "Bot Pro",valor:P.modo==="solo"?CONFIG.meta:Math.floor(rival),detalle:P.modo==="solo"?CONFIG.unidad:"masa",color:"#ff6b9d"}]);}
      const ui=Arcade.ui({juego:TIPO,titulo:CONFIG.titulo,emoji:CONFIG.emoji,subtitulo:CONFIG.subtitulo,modos:["solo","bot"],textosModo:{solo:"🏆 Récord individual",bot:"🤖 Arena contra bots"},dificultad:true,records:true,unidadRecord:CONFIG.unidad,reglas:["Arrastra en la dirección a la que quieres avanzar.",TIPO==="slither"?"Come orbes para alargar tu serpiente. Si chocas con otro cuerpo, pierdes.":"Absorbe objetivos pequeños para crecer. Los grandes pueden absorberte.","En modo bot gana quien llegue primero a la masa objetivo."],alEmpezar:iniciar,alSalir:()=>{P.activa=false;cancelAnimationFrame(raf)}});
      function coordenada(e){const r=canvas.getBoundingClientRect(), p=e.touches?e.touches[0]:e;return {x:(p.clientX-r.left)-r.width/2,y:(p.clientY-r.top)-r.height/2}}
      function apuntar(e){if(!P.activa)return;const q=coordenada(e);P.objetivo={x:q.x,y:q.y};}
      canvas.addEventListener("pointerdown",e=>{apuntar(e);if(TIPO==="slither")P.boost=true});canvas.addEventListener("pointermove",apuntar);canvas.addEventListener("pointerup",()=>P.boost=false);canvas.addEventListener("pointerleave",()=>P.boost=false);canvas.addEventListener("touchstart",e=>{apuntar(e);if(TIPO==="slither")P.boost=true},{passive:true});canvas.addEventListener("touchmove",apuntar,{passive:true});canvas.addEventListener("touchend",()=>P.boost=false,{passive:true});
      function dividir(){if(TIPO!=="agar"||!P.activa||P.player.masa<52||P.t-P.ultimaDivision<2.2)return;P.ultimaDivision=P.t;P.player.masa*=.56;P.player.r=Math.sqrt(P.player.masa)*3.8;P.player.invulnerable=.55;P.player.impulso={x:Math.cos(P.player.angulo)*560,y:Math.sin(P.player.angulo)*560,t:.34};P.mensaje="¡DIVISIÓN!";}
      function expulsar(){if(TIPO!=="agar"||!P.activa||P.player.masa<40)return;P.player.masa-=4;P.player.r=Math.sqrt(P.player.masa)*3.8;P.comida.push({x:P.player.x+Math.cos(P.player.angulo)*(P.player.r+18),y:P.player.y+Math.sin(P.player.angulo)*(P.player.r+18),r:7,color:CONFIG.color,valor:4,impulso:5});P.mensaje="Masa expulsada";}
      addEventListener("keydown",e=>{if(!P.activa)return;const paso=180,k=e.key.toLowerCase();if(e.code==="Space"){e.preventDefault();TIPO==="agar"?dividir():TIPO==="slither"&&(P.boost=true);return}if(k==="w"&&TIPO==="agar"){expulsar();return}if(e.key==="ArrowUp"||k==="w")P.objetivo.y-=paso;if(e.key==="ArrowDown"||k==="s")P.objetivo.y+=paso;if(e.key==="ArrowLeft"||k==="a")P.objetivo.x-=paso;if(e.key==="ArrowRight"||k==="d")P.objetivo.x+=paso;});
      addEventListener("keyup",e=>{if(e.code==="Space"&&TIPO==="slither")P.boost=false});
      function mover(a,tx,ty,dt,extra=0){const dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy)||1;let vel=TIPO==="slither"?145:235*Math.max(.43,1-a.r/190);if(TIPO==="slither"&&extra)vel*=1.68;if(a.impulso){a.x+=a.impulso.x*dt;a.y+=a.impulso.y*dt;a.impulso.t-=dt;if(a.impulso.t<=0)a.impulso=null;}a.x+=dx/dist*vel*dt;a.y+=dy/dist*vel*dt;a.x=limitar(a.x,-W/2,W/2);a.y=limitar(a.y,-W/2,W/2);a.angulo=Math.atan2(dy,dx);if(TIPO==="slither"){a.trail.unshift({x:a.x,y:a.y});a.trail.length=Math.min(72,Math.floor(a.masa/2.45)+14);}}
      function puedeComer(a,c){if(TIPO!=="black_hole")return true;return a.r>c.r*.93;}
      function comer(a,dt){for(let i=P.comida.length-1;i>=0;i--){const c=P.comida[i],dist=Math.hypot(a.x-c.x,a.y-c.y);if(dist<a.r+c.r+5&&puedeComer(a,c)){a.masa+=c.valor;a.r+=c.valor*(TIPO==="black_hole"?.12:.026);P.comida.splice(i,1);P.comida.push(nuevaComida((i+P.t*10)|0));}}}
      function soltarOrbes(a){for(let i=0;i<Math.min(55,Math.floor(a.masa));i++)P.comida.push({x:a.x+azar(-45,45),y:a.y+azar(-45,45),r:azar(3,7),color:a.color,valor:1.2});}
      function choque(a,b){if(!a.viva||!b.viva)return;const d=Math.hypot(a.x-b.x,a.y-b.y);if(TIPO==="slither"){const cuerpoB=b.trail.slice(4);const cuerpoA=a.trail.slice(4);const golpeA=cuerpoB.some(q=>Math.hypot(a.x-q.x,a.y-q.y)<a.r*.72);const golpeB=cuerpoA.some(q=>Math.hypot(b.x-q.x,b.y-q.y)<b.r*.72);if(golpeA){a.viva=false;soltarOrbes(a);if(a===P.player)fin(false)}if(golpeB){b.viva=false;soltarOrbes(b);if(b===P.player)fin(false)}return}if(d<a.r+b.r*.62){const grande=a.masa>b.masa*1.13?a:b, chico=grande===a?b:a;if(chico.invulnerable>0)return;if(grande===P.player&&chico.viva){grande.masa+=chico.masa*.35;grande.r+=chico.r*.18;chico.viva=false;}else if(chico===P.player&&grande.viva){fin(false);}}}
      function ia(b,dt,i){let objetivo=P.comida[(i*31+Math.floor(P.t*3))%P.comida.length]||{x:0,y:0};if(P.player&&P.player.viva){const d=Math.hypot(P.player.x-b.x,P.player.y-b.y);if(d<360)objetivo=b.masa>P.player.masa*1.18?P.player:{x:b.x-(P.player.x-b.x)*1.8,y:b.y-(P.player.y-b.y)*1.8};}const rapido=TIPO==="slither"&&i%3===0&&Math.sin(P.t+i)>0.72;mover(b,objetivo.x,objetivo.y,dt,rapido);comer(b,dt);}
      function fin(gano){if(!P.activa)return;P.activa=false;cancelAnimationFrame(raf);const score=Math.floor(P.player.masa);ui.terminar({emoji:gano?"🏆":"💥",texto:gano?"¡Dominaste la arena!":"Te absorbieron…",nota:gano?`${score} ${CONFIG.unidad} conseguidos`:`Llegaste a ${score} ${CONFIG.unidad}`,record:score,gano});}
      function actualizar(dt){P.t+=dt;P.tiempo+=dt;P.player.invulnerable=Math.max(0,P.player.invulnerable-dt);const turbo=TIPO==="slither"&&P.boost&&P.player.masa>22;mover(P.player,P.player.x+P.objetivo.x,P.player.y+P.objetivo.y,dt,turbo);if(turbo&&Math.random()<dt*7){P.player.masa-=.13;P.player.r=Math.max(12,P.player.r-.012);P.comida.push({x:P.player.x+azar(-11,11),y:P.player.y+azar(-11,11),r:4,color:P.player.color,valor:.65});}P.objetivo.x*=.89;P.objetivo.y*=.89;comer(P.player,dt);P.bots=P.bots.filter(b=>b.viva);P.bots.forEach((b,i)=>ia(b,dt,i));for(let i=0;i<P.bots.length;i++)choque(P.player,P.bots[i]);for(let i=0;i<P.bots.length;i++)for(let j=i+1;j<P.bots.length;j++)choque(P.bots[i],P.bots[j]);if(P.player.masa>=CONFIG.meta)fin(true);if(P.modo==="bot"&&P.bots.some(b=>b.masa>=CONFIG.meta))fin(false);if(TIPO==="black_hole"&&P.tiempo>=P.limite)fin(P.player.masa>=P.bots.reduce((m,b)=>Math.max(m,b.masa),0));if(P.mensaje&&Math.random()<dt*.9)P.mensaje="";marcador();}
      function hexAColor(color, amount){const n=parseInt(color.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amount)),g=Math.max(0,Math.min(255,((n>>8)&255)+amount)),b=Math.max(0,Math.min(255,(n&255)+amount));return `rgb(${r},${g},${b})`;}
      function circulo(x,y,r,color,brillo=0){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);g.addColorStop(0,"#fff9");g.addColorStop(.16,hexAColor(color,55));g.addColorStop(.62,color);g.addColorStop(1,brillo?"#020510":"#0008");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
      function celula(a){const pasos=34,ondulacion=Math.min(2.5,a.r*.055);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angulo*.06);ctx.shadowColor=a.color;ctx.shadowBlur=18;ctx.fillStyle="#fff";ctx.beginPath();for(let i=0;i<=pasos;i++){const ang=i/pasos*Math.PI*2,rr=a.r+Math.sin(ang*7+a.patron*2)*ondulacion;const x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.fill();ctx.shadowBlur=0;const g=ctx.createRadialGradient(-a.r*.35,-a.r*.38,2,0,0,a.r);g.addColorStop(0,"#ffffffcc");g.addColorStop(.18,hexAColor(a.color,55));g.addColorStop(.69,a.color);g.addColorStop(1,hexAColor(a.color,-48));ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<=pasos;i++){const ang=i/pasos*Math.PI*2,rr=a.r-2+Math.sin(ang*7+a.patron*2)*ondulacion;const x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.fill();ctx.globalAlpha=.22;ctx.fillStyle="#fff";for(let i=0;i<5;i++){const ang=i*1.49+a.patron,rr=a.r*(.2+(i%3)*.17);ctx.beginPath();ctx.arc(Math.cos(ang)*rr,Math.sin(ang)*rr,a.r*(.06+(i%2)*.035),0,7);ctx.fill()}ctx.restore();}
      function edificio(c){ctx.save();ctx.translate(c.x,c.y);const w=c.w,h=c.h,top=Math.min(13,h*.32),left=hexAColor(c.color,-35),right=hexAColor(c.color,-68);ctx.fillStyle="#05091499";ctx.fillRect(-w/2+5,-h/2+7,w,h);ctx.fillStyle=right;ctx.beginPath();ctx.moveTo(w/2,-h/2+top);ctx.lineTo(w/2+top*.55,-h/2);ctx.lineTo(w/2+top*.55,h/2-top);ctx.lineTo(w/2,h/2);ctx.fill();ctx.fillStyle=left;ctx.fillRect(-w/2,-h/2+top,w,h-top);ctx.fillStyle=hexAColor(c.color,55);ctx.beginPath();ctx.moveTo(-w/2,-h/2+top);ctx.lineTo(-w/2+top*.55,-h/2);ctx.lineTo(w/2+top*.55,-h/2);ctx.lineTo(w/2,-h/2+top);ctx.fill();ctx.fillStyle="#fff8";for(let y=-h/2+top+6;y<h/2-2;y+=8)for(let x=-w/2+5;x<w/2-3;x+=8){ctx.globalAlpha=.42+((x+y)%3)*.13;ctx.fillRect(x,y,3,3)}ctx.globalAlpha=1;ctx.restore();}
      function ciudad(){ctx.fillStyle="#17243a";ctx.fillRect(-W/2,-W/2,W,W);ctx.fillStyle="#243957";for(let x=-W/2;x<W/2;x+=260)ctx.fillRect(x,-W/2,46,W);for(let y=-W/2;y<W/2;y+=260)ctx.fillRect(-W/2,y,W,46);ctx.strokeStyle="#d8c56b55";ctx.lineWidth=2;ctx.setLineDash([13,13]);for(let x=-W/2+23;x<W/2;x+=260){ctx.beginPath();ctx.moveTo(x,-W/2);ctx.lineTo(x,W/2);ctx.stroke()}for(let y=-W/2+23;y<W/2;y+=260){ctx.beginPath();ctx.moveTo(-W/2,y);ctx.lineTo(W/2,y);ctx.stroke()}ctx.setLineDash([]);}
      function fondoPuntos(p){ctx.fillStyle=TIPO==="agar"?"#f2fbff":"#182c5e";const paso=TIPO==="agar"?35:44;for(let x=-W/2;x<W/2;x+=paso)for(let y=-W/2;y<W/2;y+=paso){const dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<1200000){ctx.globalAlpha=TIPO==="agar"?.3:.34;ctx.beginPath();ctx.arc(x,y,TIPO==="agar"?1.3:2,0,7);ctx.fill()}}ctx.globalAlpha=1;}
      function orbe(c){ctx.save();ctx.shadowColor=c.color;ctx.shadowBlur=12;circulo(c.x,c.y,c.r,c.color);ctx.restore();}
      function ojos(a){if(TIPO!=="slither")return;const ex=Math.cos(a.angulo)*a.r*.38,ey=Math.sin(a.angulo)*a.r*.38;ctx.save();ctx.translate(a.x+ex,a.y+ey);ctx.rotate(a.angulo);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(a.r*.23,-a.r*.24,a.r*.22,0,7);ctx.arc(a.r*.23,a.r*.24,a.r*.22,0,7);ctx.fill();ctx.fillStyle="#10172b";ctx.beginPath();ctx.arc(a.r*.3,-a.r*.24,a.r*.09,0,7);ctx.arc(a.r*.3,a.r*.24,a.r*.09,0,7);ctx.fill();ctx.restore();}
      function serpiente(a){const cuerpo=[{x:a.x,y:a.y},...a.trail.filter(Boolean)];ctx.save();for(let i=cuerpo.length-1;i>=0;i--){const q=cuerpo[i],f=1-i/(cuerpo.length+7),rr=Math.max(5,a.r*(.45+.53*f));ctx.fillStyle="#0007";ctx.beginPath();ctx.arc(q.x+3,q.y+4,rr+2,0,7);ctx.fill();const grad=ctx.createRadialGradient(q.x-rr*.3,q.y-rr*.35,1,q.x,q.y,rr);grad.addColorStop(0,"#fff9");grad.addColorStop(.2,i%5===0?"#fff":hexAColor(a.color,38));grad.addColorStop(1,hexAColor(a.color,-42));ctx.fillStyle=grad;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,7);ctx.fill();if(i%6===0){ctx.strokeStyle="#fff7";ctx.lineWidth=Math.max(1,rr*.12);ctx.beginPath();ctx.arc(q.x,q.y,rr*.6,0,7);ctx.stroke()}}ctx.restore();ojos(a);}
      function agujero(a){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(P.t*.8);for(let i=0;i<3;i++){ctx.strokeStyle=i===0?a.color:i===1?"#f5d7ff":"#6542d9";ctx.globalAlpha=.8-i*.22;ctx.lineWidth=Math.max(2,a.r*.11-i*1.5);ctx.setLineDash([a.r*.22,a.r*.13]);ctx.beginPath();ctx.arc(0,0,a.r*(1.13+i*.12),0,7);ctx.stroke()}ctx.setLineDash([]);ctx.globalAlpha=1;const g=ctx.createRadialGradient(-a.r*.2,-a.r*.25,1,0,0,a.r);g.addColorStop(0,"#111322");g.addColorStop(.6,"#03040a");g.addColorStop(1,"#000");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,a.r,0,7);ctx.fill();ctx.restore();}
      function minimapa(p,w,h){const size=82,x=w-size-16,y=h-size-55;ctx.save();ctx.fillStyle="#071225bb";ctx.strokeStyle="#ffffff44";ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,size,size,12);ctx.fill();ctx.stroke();const dot=(a,color,r=3)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x+size/2+a.x/W*size,y+size/2+a.y/W*size,r,0,7);ctx.fill()};P.bots.filter(b=>b.viva).forEach(b=>dot(b,b.color,2));dot(p,CONFIG.color,4);ctx.restore();}
      function dibujar(){const w=innerWidth,h=innerHeight,p=P.player||{x:0,y:0};ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,w,h);if(TIPO==="agar"){bg.addColorStop(0,"#e0f7ff");bg.addColorStop(1,"#8fd9e9");}else if(TIPO==="slither"){bg.addColorStop(0,"#5d57cf");bg.addColorStop(1,"#283181");}else{bg.addColorStop(0,"#394a69");bg.addColorStop(1,"#101a2c");}ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const escala=limitar(1.18-p.r/260,.58,1.05),ox=w/2-p.x*escala,oy=h/2-p.y*escala;ctx.save();ctx.translate(ox,oy);ctx.scale(escala,escala);if(TIPO==="black_hole")ciudad();else fondoPuntos(p);P.comida.forEach(c=>{if(c.edificio){edificio(c);return}orbe(c)});const todos=[...P.bots,P.player].filter(a=>a&&a.viva);todos.forEach(a=>{if(TIPO==="slither")serpiente(a);else if(TIPO==="black_hole")agujero(a);else celula(a);if(a===P.player){ctx.fillStyle=TIPO==="agar"?"#13375b":"#fff";ctx.font="900 13px Nunito";ctx.textAlign="center";ctx.fillText("TÚ",a.x,a.y-a.r-14)}});ctx.restore();if(P.activa){ctx.fillStyle="#ffffffdd";ctx.font="900 14px Nunito";ctx.textAlign="right";const extra=TIPO==="black_hole"?` · ${Math.max(0,Math.ceil(P.limite-P.tiempo))}s`:"";ctx.fillText(`META ${CONFIG.meta}${extra}`,w-18,30);minimapa(p,w,h);if(P.mensaje){ctx.textAlign="center";ctx.fillStyle=CONFIG.color;ctx.font="900 16px Nunito";ctx.fillText(P.mensaje,w/2,42);}}}
      function ciclo(t){if(!P.activa)return;const dt=Math.min(.035,(t-ultimo)/1000||0);ultimo=t;actualizar(dt);dibujar();raf=requestAnimationFrame(ciclo);}
    </script>

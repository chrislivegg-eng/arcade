<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120c14" />
    <title>Buscaminas Duelo · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
    <style>
      body {
        background: radial-gradient(ellipse at top, #1d3b2a, #0b140f 70%);
      }
      #zona {
        position: fixed;
        top: calc(84px + env(safe-area-inset-top));
        bottom: calc(10px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 8px;
      }
      #tablero {
        --cel: min(calc(94vw / var(--cols)), calc((100vh - 190px) / var(--filas)), 46px);
        display: grid;
        grid-template-columns: repeat(var(--cols), var(--cel));
        gap: 2px;
        padding: 6px;
        background: #2f5e40;
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        touch-action: manipulation;
      }
      .c {
        width: var(--cel);
        height: var(--cel);
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: calc(var(--cel) * 0.55);
        background: linear-gradient(145deg, #8fdc6a, #5fb847);
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2);
        cursor: pointer;
        -webkit-touch-callout: none;
      }
      .c.abierta {
        background: #ecdcb8;
        box-shadow: none;
        cursor: default;
        animation: abrir 0.18s ease-out;
      }
      .c.mina {
        background: #ff4f4f;
      }
      .c.bandera {
        background: linear-gradient(145deg, #a9e98a, #6cc452);
      }
      @keyframes abrir {
        from {
          transform: scale(0.7);
        }
      }
      .n1 {
        color: #2e6bd8;
      }
      .n2 {
        color: #2c9a45;
      }
      .n3 {
        color: #d83a3a;
      }
      .n4 {
        color: #6a2bb0;
      }
      .n5 {
        color: #b05a00;
      }
      .n6 {
        color: #0f8f8f;
      }
      .n7,
      .n8 {
        color: #333;
      }
      #botones {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #btn-modo {
        border: none;
        border-radius: 30px;
        padding: 12px 22px;
        font-family: inherit;
        font-weight: 900;
        font-size: 1.05rem;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        cursor: pointer;
      }
      #btn-modo.activo {
        background: #ff6b4f;
      }
      #minas {
        font-weight: 900;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div id="zona" class="oculto">
      <div id="tablero"></div>
      <div id="botones">
        <button id="btn-modo">⛏️ Excavar</button>
        <span id="minas">💣 0</span>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, sonar } = Arcade;
      const NIVELES = {
        facil: { cols: 8, filas: 10, minas: 10, bot: 55 },
        normal: { cols: 9, filas: 12, minas: 20, bot: 110 },
        pro: { cols: 10, filas: 14, minas: 32, bot: 200 },
      };
      const NOMBRE_NIVEL = { facil: "Chico", normal: "Mediano", pro: "Grande" };
      const J = { activa: false };

      const ui = Arcade.ui({
        juego: "buscaminas",
        titulo: "Buscaminas",
        emoji: "💣",
        subtitulo: "Duelo: ¿quién limpia el campo primero?",
        modos: ["solo", "bot", "online"],
        textosModo: { bot: "🤖 Duelo contra el bot", online: "🌐 Duelo online" },
        dificultad: { etiqueta: "💣 Tamaño del campo", nombres: { facil: "Chico", normal: "Mediano", pro: "Grande" }, siempre: true },
        records: true,
        unidadRecord: "s",
        reglas: [
          "Toca una casilla para excavar. El número dice cuántas minas hay alrededor.",
          "Mantén presionado (o usa 🚩) para poner bandera donde crees que hay mina.",
          "Toca un número con sus banderas completas para abrir lo de alrededor.",
          "En duelo los dos tienen el MISMO campo: gana quien lo limpie primero… ¡y si pisas una mina pierdes!",
          "Online siempre es tamaño Mediano.",
        ],
        alEmpezar: empezar,
        alSalir: parar,
      });
      ui.alEvento = (tipo, d) => {
        if (!d || d.partida !== J.partida) return;
        if (tipo === "progreso") {
          J.rival.pct = d.pct;
          marcador();
        } else if (tipo === "fin" && !J.miFin) {
          if (d.resultado === "gano") finDuelo(false, `${rivalNombre()} limpió su campo primero`);
          else finDuelo(true, `¡${rivalNombre()} pisó una mina! 💥`);
        }
      };

      // =================== PARTIDA ===================
      function parar() {
        J.activa = false;
        clearInterval(J.reloj);
        clearTimeout(J.timerBot);
        $("zona").classList.add("oculto");
      }
      const rivalNombre = () => J.nombres[1 - (J.modo === "online" ? ui.yo : 0)];
      const vecinos = (i) => {
        const { cols, filas } = J.nivel;
        const r = (i / cols) | 0,
          c = i % cols,
          l = [];
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            const rr = r + dr,
              cc = c + dc;
            if ((dr || dc) && rr >= 0 && cc >= 0 && rr < filas && cc < cols) l.push(rr * cols + cc);
          }
        return l;
      };

      function empezar(modo, info) {
        parar();
        const nivelId = modo === "online" ? "normal" : info.dificultad;
        const nivel = NIVELES[nivelId];
        J.nivel = nivel;
        const total = nivel.cols * nivel.filas;
        // el centro siempre es seguro (y es igual para los dos jugadores)
        const centro = ((nivel.filas / 2) | 0) * nivel.cols + ((nivel.cols / 2) | 0);
        const seguras = new Set([centro, ...vecinos(centro)]);
        const rand = Arcade.rng(info.semilla);
        const minas = new Set();
        while (minas.size < nivel.minas) {
          const i = Math.floor(rand() * total);
          if (!seguras.has(i)) minas.add(i);
        }
        Object.assign(J, {
          modo,
          partida: info.partida,
          nombres: info.nombres,
          nivelId,
          total,
          minas,
          abiertas: new Set(),
          banderas: new Set(),
          numeros: [...Array(total).keys()].map((i) => vecinos(i).filter((v) => minas.has(v)).length),
          modoBandera: false,
          inicio: Date.now(),
          miFin: null,
          rival: { pct: 0 },
          activa: true,
        });
        $("tablero").style.setProperty("--cols", nivel.cols);
        $("tablero").style.setProperty("--filas", nivel.filas);
        $("tablero").innerHTML = '<div class="c"></div>'.repeat(total);
        $("btn-modo").classList.remove("activo");
        $("btn-modo").textContent = "⛏️ Excavar";
        $("zona").classList.remove("oculto");
        abrir(centro);
        marcador();
        J.reloj = setInterval(marcador, 1000);
        if (modo === "bot") empezarBot();
        ui.ayuda("Mantén presionado para 🚩");
        setTimeout(() => ui.ayuda(""), 4000);
      }

      const seguras = () => J.total - J.minas.size;
      const pct = () => Math.round((J.abiertas.size / seguras()) * 100);
      const reloj = (ms) => {
        const s = Math.floor(ms / 1000);
        return `${(s / 60) | 0}:${String(s % 60).padStart(2, "0")}`;
      };

      function marcador() {
        $("minas").textContent = `💣 ${J.minas.size - J.banderas.size}`;
        const t = reloj(J.miFin ? J.miFin.ms : Date.now() - J.inicio);
        if (J.modo === "solo") return ui.marcador([{ nombre: J.nombres[0], valor: `⏱️ ${t}`, detalle: `${pct()}% limpio`, activo: true }, null]);
        const yo = J.modo === "online" ? ui.yo : 0;
        const mio = { nombre: J.nombres[yo] + " (tú)", valor: `${pct()}%`, detalle: `⏱️ ${t}`, activo: true };
        const suyo = { nombre: J.nombres[1 - yo], valor: `${J.rival.pct}%`, detalle: "Excavando…" };
        ui.marcador(yo === 0 ? [mio, suyo] : [suyo, mio]);
      }

      // abre una casilla (y en cadena las que no tienen minas alrededor)
      function abrir(i) {
        const cola = [i];
        while (cola.length) {
          const k = cola.pop();
          if (J.abiertas.has(k) || J.banderas.has(k)) continue;
          J.abiertas.add(k);
          const el = $("tablero").children[k];
          el.className = "c abierta";
          const n = J.numeros[k];
          el.textContent = n || "";
          if (n) el.classList.add("n" + n);
          if (!n) vecinos(k).forEach((v) => cola.push(v));
        }
      }

      function excavar(i) {
        if (!J.activa || J.miFin) return;
        if (J.abiertas.has(i)) {
          // número con sus banderas completas → abre alrededor
          const v = vecinos(i);
          if (J.numeros[i] && v.filter((x) => J.banderas.has(x)).length === J.numeros[i]) {
            const cerradas = v.filter((x) => !J.abiertas.has(x) && !J.banderas.has(x));
            if (!cerradas.length) return;
            for (const x of cerradas) if (J.minas.has(x)) return explotar(x);
            cerradas.forEach(abrir);
            despuesDeAbrir();
          }
          return;
        }
        if (J.banderas.has(i)) return;
        if (J.minas.has(i)) return explotar(i);
        abrir(i);
        despuesDeAbrir();
      }

      let ultimoEnvio = 0;
      function despuesDeAbrir() {
        sonar("click");
        marcador();
        if (J.modo === "online" && Date.now() - ultimoEnvio > 700) {
          ultimoEnvio = Date.now();
          ui.enviar("progreso", { partida: J.partida, pct: pct() });
        }
        if (J.abiertas.size >= seguras()) ganaste();
      }

      function bandera(i) {
        if (!J.activa || J.miFin || J.abiertas.has(i)) return;
        const el = $("tablero").children[i];
        if (J.banderas.has(i)) {
          J.banderas.delete(i);
          el.textContent = "";
          el.classList.remove("bandera");
        } else {
          J.banderas.add(i);
          el.textContent = "🚩";
          el.classList.add("bandera");
        }
        sonar("click");
        if (navigator.vibrate) navigator.vibrate(30);
        marcador();
      }

      function mostrarMinas(pisada) {
        J.minas.forEach((m) => {
          const el = $("tablero").children[m];
          if (J.banderas.has(m)) return;
          el.className = "c abierta" + (m === pisada ? " mina" : "");
          el.textContent = "💣";
        });
      }

      async function explotar(i) {
        J.miFin = { ms: Date.now() - J.inicio };
        clearInterval(J.reloj);
        mostrarMinas(i);
        sonar("choque");
        if (navigator.vibrate) navigator.vibrate([80, 40, 160]);
        ui.avisar("💥 ¡BOOM!", "#ff3b3b");
        if (J.modo === "online") ui.enviar("fin", { partida: J.partida, resultado: "boom" });
        await esperar(1600);
        if (!J.activa) return;
        if (J.modo === "solo") {
          parar();
          return ui.terminar({ emoji: "💥", texto: "¡Pisaste una mina!", nota: `Limpiaste el ${pct()}%`, gano: false });
        }
        J.miFin = null;
        finDuelo(false, "Pisaste una mina 💥");
      }

      function ganaste() {
        const ms = Date.now() - J.inicio;
        J.miFin = { ms };
        mostrarMinas(-1);
        if (J.modo === "solo") {
          parar();
          sonar("ganar");
          return ui.terminar({ emoji: "🏆", texto: `¡Campo limpio en ${reloj(ms)}!`, nota: `Tamaño ${NOMBRE_NIVEL[J.nivelId]}`, record: Math.round(ms / 1000), gano: true });
        }
        if (J.modo === "online") ui.enviar("fin", { partida: J.partida, resultado: "gano" });
        J.miFin = null;
        finDuelo(true, `Limpiaste tu campo en ${reloj(ms)}`);
      }

      function finDuelo(gane, nota) {
        if (!J.activa) return;
        parar();
        sonar(gane ? "ganar" : "perder");
        ui.terminar({ emoji: gane ? "🏆" : "😿", texto: gane ? "¡Ganaste el duelo!" : `Ganó ${rivalNombre()}`, nota, gano: gane });
      }

      // =================== CONTROLES ===================
      $("btn-modo").onclick = () => {
        J.modoBandera = !J.modoBandera;
        $("btn-modo").classList.toggle("activo", J.modoBandera);
        $("btn-modo").textContent = J.modoBandera ? "🚩 Banderas" : "⛏️ Excavar";
      };
      let presion = null;
      $("tablero").addEventListener("contextmenu", (e) => e.preventDefault());
      $("tablero").addEventListener("pointerdown", (e) => {
        const el = e.target.closest(".c");
        if (!el) return;
        const i = [...$("tablero").children].indexOf(el);
        if (e.button === 2) return bandera(i);
        presion = { i, largo: false, x: e.clientX, y: e.clientY };
        presion.timer = setTimeout(() => {
          if (!presion) return;
          presion.largo = true;
          bandera(i);
        }, 420);
      });
      $("tablero").addEventListener("pointermove", (e) => {
        if (presion && Math.hypot(e.clientX - presion.x, e.clientY - presion.y) > 12) {
          clearTimeout(presion.timer);
          presion = null;
        }
      });
      $("tablero").addEventListener("pointerup", () => {
        if (!presion) return;
        clearTimeout(presion.timer);
        const { i, largo } = presion;
        presion = null;
        if (largo) return;
        if (J.modoBandera && !J.abiertas.has(i)) bandera(i);
        else excavar(i);
      });
      $("tablero").addEventListener("pointercancel", () => {
        if (presion) clearTimeout(presion.timer);
        presion = null;
      });

      // =================== BOT ===================
      // el bot "excava" a su ritmo; a veces se equivoca y pisa una mina
      function empezarBot() {
        const partida = J.partida;
        const total = J.nivel.bot * Arcade.azar(0.8, 1.25);
        const explota = Math.random() < 0.18 ? Arcade.azar(0.2, 0.9) : 2;
        const inicio = Date.now();
        const turno = () => {
          if (partida !== J.partida || !J.activa || J.miFin) return;
          const avance = Math.min(1, (Date.now() - inicio) / 1000 / total);
          J.rival.pct = Math.round(avance * 100);
          marcador();
          if (avance >= explota) return finDuelo(true, `¡${rivalNombre()} pisó una mina! 💥`);
          if (avance >= 1) return finDuelo(false, `${rivalNombre()} limpió su campo primero`);
          J.timerBot = setTimeout(turno, 900);
        };
        J.timerBot = setTimeout(turno, 900);
      }
    </script>
  </body>
</html>

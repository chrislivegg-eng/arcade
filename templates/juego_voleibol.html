<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7ed0ff" />
    <title>Voleibol de Playa · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
    <style>
      #anillo {
        position: fixed;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 4;
      }
      #anillo .fijo,
      #anillo .encoge {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      #anillo .fijo {
        inset: 42px;
        border: 4px solid #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      }
      #anillo .encoge {
        border: 5px solid var(--color, #ffd84f);
        box-shadow: 0 0 14px var(--color, #ffd84f);
      }
      #accion {
        position: fixed;
        left: 50%;
        bottom: calc(80px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        font-weight: 900;
        font-size: 1.3rem;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        z-index: 5;
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="anillo" class="oculto"><div class="fijo"></div><div class="encoge"></div></div>
    <div id="accion"></div>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, azar, limitar, lin, sonar } = Arcade;
      // Cancha: 8 m de ancho (x de -4 a 4), 16 m de largo (z de -8 a 8). La red en z = 0.
      // Tu equipo siempre juega del lado z > 0 (cerca de la cámara).
      const ANCHO = 4,
        LARGO = 8,
        RED = 2.3,
        G = 11;
      const PUNTOS_GANAR = 11;

      // =========================================================
      //  ESCENA: playa
      // =========================================================
      const M = Arcade.mundo({ fondo: 0x7ed0ff, fov: 52, niebla: [40, 110], exposicion: 1.05, colorAmbiente: 0xcfefff, lejos: 200 });
      const { escena, camara } = M;
      const mat = (c, x = {}) => new THREE.MeshStandardMaterial({ color: lin(c), roughness: 0.8, ...x });
      escena.add(new THREE.HemisphereLight(0xffffff, 0xe8c98a, 0.8));
      const sol = new THREE.DirectionalLight(0xfff0d8, 1.3);
      sol.position.set(-8, 20, 10);
      sol.castShadow = true;
      sol.shadow.mapSize.set(2048, 2048);
      Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
      escena.add(sol);
      const caja = (w, h, d, m, x = 0, y = 0, z = 0) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        b.position.set(x, y, z);
        b.castShadow = b.receiveShadow = true;
        return b;
      };
      const texArena = M.textura(256, 256, (g, w, h) => {
        g.fillStyle = "#f2d9a0";
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 5000; i++) {
          g.fillStyle = `hsl(40, ${azar(40, 60)}%, ${azar(65, 85)}%)`;
          g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
        }
      });
      texArena.wrapS = texArena.wrapT = THREE.RepeatWrapping;
      texArena.repeat.set(16, 16);
      const arena = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: texArena, roughness: 1 }));
      arena.rotation.x = -Math.PI / 2;
      arena.receiveShadow = true;
      escena.add(arena);
      const mar = new THREE.Mesh(new THREE.PlaneGeometry(300, 120), mat(0x1fa3d6, { roughness: 0.2, metalness: 0.3 }));
      mar.rotation.x = -Math.PI / 2;
      mar.position.set(0, 0.02, -95);
      escena.add(mar);
      // líneas de la cancha
      const matLinea = mat(0x1f6fe0);
      escena.add(caja(ANCHO * 2 + 0.1, 0.02, 0.08, matLinea, 0, 0.01, LARGO), caja(ANCHO * 2 + 0.1, 0.02, 0.08, matLinea, 0, 0.01, -LARGO));
      escena.add(caja(0.08, 0.02, LARGO * 2, matLinea, ANCHO, 0.01, 0), caja(0.08, 0.02, LARGO * 2, matLinea, -ANCHO, 0.01, 0));
      // red
      [-1, 1].forEach((l) => escena.add(caja(0.1, RED + 0.2, 0.1, mat(0xdddddd, { metalness: 0.6 }), l * (ANCHO + 0.6), (RED + 0.2) / 2, 0)));
      const texRed = M.textura(256, 64, (g, w, h) => {
        g.clearRect(0, 0, w, h);
        g.strokeStyle = "#222";
        g.lineWidth = 2;
        for (let x = 0; x <= w; x += 8) g.beginPath(), g.moveTo(x, 0), g.lineTo(x, h), g.stroke();
        for (let y = 0; y <= h; y += 8) g.beginPath(), g.moveTo(0, y), g.lineTo(w, y), g.stroke();
      });
      const red = new THREE.Mesh(new THREE.PlaneGeometry(ANCHO * 2 + 1.2, 1), new THREE.MeshStandardMaterial({ map: texRed, transparent: true, side: THREE.DoubleSide }));
      red.position.set(0, RED - 0.5, 0);
      escena.add(red);
      escena.add(caja(ANCHO * 2 + 1.2, 0.08, 0.04, mat(0xffffff), 0, RED, 0));
      // palmeras
      for (let i = 0; i < 10; i++) {
        const lado = i % 2 ? 1 : -1;
        const p = new THREE.Group();
        const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 6, 8), mat(0x8b5a2b));
        tronco.position.y = 3;
        tronco.rotation.z = lado * 0.12;
        p.add(tronco);
        for (let k = 0; k < 6; k++) {
          const hoja = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.06, 0.5), mat(0x2e9e4a));
          hoja.position.set(Math.cos((k / 6) * Math.PI * 2) * 1.1 - lado * 0.4, 6, Math.sin((k / 6) * Math.PI * 2) * 1.1);
          hoja.rotation.y = -(k / 6) * Math.PI * 2;
          hoja.rotation.z = -0.35;
          p.add(hoja);
        }
        p.position.set(lado * azar(9, 14), 0, azar(-14, 12));
        escena.add(p);
      }

      // jugadores
      function crearJugador(colorPlayera) {
        const g = new THREE.Group();
        const piel = mat(0xd9a066);
        g.add(caja(0.5, 0.6, 0.3, mat(colorPlayera), 0, 1.15, 0));
        g.add(caja(0.52, 0.3, 0.32, mat(0x222244), 0, 0.72, 0));
        g.add(caja(0.34, 0.36, 0.32, piel, 0, 1.68, 0));
        g.add(caja(0.36, 0.1, 0.34, mat(0x3a2a1a), 0, 1.86, 0));
        const brazos = [-1, 1].map((l) => {
          const b = new THREE.Group();
          b.position.set(l * 0.33, 1.4, 0);
          b.add(caja(0.14, 0.6, 0.14, piel, 0, -0.28, 0));
          g.add(b);
          return b;
        });
        const piernas = [-1, 1].map((l) => {
          const p = new THREE.Group();
          p.position.set(l * 0.13, 0.6, 0);
          p.add(caja(0.17, 0.6, 0.17, piel, 0, -0.3, 0));
          g.add(p);
          return p;
        });
        g.userData = { brazos, piernas, meta: new THREE.Vector3(), pose: 0 };
        escena.add(g);
        return g;
      }
      // 0: tú, 1: tu compañero, 2 y 3: rivales
      const jugadores = [crearJugador(0xff4f8b), crearJugador(0xff9fc0), crearJugador(0x3a86ff), crearJugador(0x8fc3ff)];
      const BASE = [
        [-1.8, 4.5],
        [1.8, 4.5],
        [1.8, -4.5],
        [-1.8, -4.5],
      ];

      const pelota = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 24, 18),
        new THREE.MeshStandardMaterial({
          map: M.textura(256, 128, (g, w, h) => {
            ["#ffd84f", "#ffffff", "#3a86ff", "#ffffff", "#ffd84f", "#ffffff"].forEach((c, i) => ((g.fillStyle = c), g.fillRect((i * w) / 6, 0, w / 6, h)));
          }),
          roughness: 0.5,
        }),
      );
      pelota.castShadow = true;
      escena.add(pelota);
      const sombra = new THREE.Mesh(new THREE.CircleGeometry(0.3, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
      sombra.rotation.x = -Math.PI / 2;
      sombra.position.y = 0.02;
      escena.add(sombra);
      const marca = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.5, 24), new THREE.MeshBasicMaterial({ color: 0xffd84f }));
      marca.rotation.x = -Math.PI / 2;
      marca.position.y = 0.03;
      marca.visible = false;
      escena.add(marca);

      // =========================================================
      //  VUELO DE LA PELOTA (parábola de un punto a otro)
      // =========================================================
      const V = { activo: false };
      function lanzarPelota(desde, hasta, duracion) {
        const g = new THREE.Vector3(0, -G, 0);
        const v0 = hasta.clone().sub(desde).sub(g.clone().multiplyScalar(0.5 * duracion * duracion)).divideScalar(duracion);
        Object.assign(V, { activo: true, desde: desde.clone(), v0, t: 0, duracion, hasta: hasta.clone() });
        marca.position.set(hasta.x, 0.03, hasta.z);
      }
      const posPelota = (t) => V.desde.clone().addScaledVector(V.v0, t).add(new THREE.Vector3(0, -0.5 * G * t * t, 0));

      // =========================================================
      //  PARTIDA
      // =========================================================
      const J = { modo: null, activa: false, puntos: [0, 0] };
      const ui = Arcade.ui({
        juego: "voleibol",
        titulo: "Voleibol de Playa",
        emoji: "🏐",
        subtitulo: "2 contra 2 en la arena",
        modos: ["bot", "online"],
        textosModo: { bot: "🤖 2 vs 2 contra bots", online: "🌐 Online (cada quien con su compañero)" },
        dificultad: true,
        intervaloOnline: 300,
        reglas: [
          "Tu equipo (rosa) tiene a ti y a tu compañero. Se mueven solos a donde va a caer la pelota.",
          "🎯 Cuando la pelota llega a ti aparece un aro: <b>toca</b> justo cuando el aro se cierre para recibirla.",
          "Tu compañero te la levanta y tú rematas: <b>desliza</b> hacia donde quieres mandarla (izquierda, derecha, al fondo o cortita) cuando el aro se cierre.",
          "Mientras mejor el tiempo, más fuerte el remate. ¡Si fallas, se va a la red o afuera!",
          `Gana el primero en llegar a ${PUNTOS_GANAR} (con 2 de ventaja).`,
        ],
        alEmpezar: empezar,
        alSalir: () => {
          J.activa = false;
          J.modo = null;
          V.activo = false;
          ocultarAnillo();
          $("accion").textContent = "";
        },
      });
      ui.alEvento = (tipo, d) => {
        if (!d || d.partida !== J.partida) return;
        if (tipo === "ataque" && d.n === J.n) {
          J.n++;
          // viene del otro lado: se voltean las coordenadas
          const desde = new THREE.Vector3(-d.desde[0], d.desde[1], -d.desde[2]);
          const hasta = new THREE.Vector3(-d.hasta[0], 0, -d.hasta[1]);
          recibirAtaque(desde, hasta, d.duracion, d.fuerza, d.saque);
        } else if (tipo === "punto" && d.n === J.n) {
          J.n++;
          // "para" es relativo a quien lo manda: "yo" = punto para el rival de este celular
          anotar(d.para === "yo" ? 1 : 0, d.motivo);
        } else if (tipo === "recibio") {
          rallyRival(new THREE.Vector3(-d.x, 0, -d.z));
        }
      };

      function marcador() {
        const yo = J.modo === "online" ? ui.yo : 0;
        const mio = { nombre: J.nombres[yo] + " (tú)", valor: J.puntos[0], detalle: J.saca === 0 ? "🏐 saca" : "equipo rosa", activo: J.saca === 0, color: "#ff4f8b" };
        const suyo = { nombre: J.nombres[1 - yo], valor: J.puntos[1], detalle: J.saca === 1 ? "🏐 saca" : "equipo azul", activo: J.saca === 1, color: "#3a86ff" };
        ui.marcador(yo === 0 ? [mio, suyo] : [suyo, mio]);
      }

      function empezar(modo, info) {
        Object.assign(J, { modo, nombres: info.nombres, partida: info.partida, dificultad: info.dificultad, puntos: [0, 0], n: 0, activa: true, fase: null });
        // online: el que crea la sala saca primero
        J.saca = modo === "online" ? (ui.yo === 0 ? 0 : 1) : 0;
        marcador();
        nuevoPunto();
      }

      function posicionesBase() {
        jugadores.forEach((j, i) => {
          j.userData.meta.set(BASE[i][0], 0, BASE[i][1]);
        });
      }

      async function nuevoPunto() {
        if (!J.activa) return;
        V.activo = false;
        marca.visible = false;
        posicionesBase();
        ocultarAnillo();
        const partida = J.partida;
        await esperar(900);
        if (partida !== J.partida || !J.activa) return;
        if (J.saca === 0) {
          // saco yo desde el fondo
          jugadores[0].userData.meta.set(-1, 0, LARGO + 0.8);
          J.fase = "saque";
          pelota.position.set(-1, 1.2, LARGO + 0.5);
          $("accion").textContent = "🏐 Desliza hacia arriba para sacar";
          await esperar(500);
          esperarGesto("saque");
        } else if (J.modo === "bot") {
          jugadores[2].userData.meta.set(1, 0, -LARGO - 0.8);
          pelota.position.set(1, 1.2, -LARGO - 0.5);
          $("accion").textContent = "";
          await esperar(1200);
          if (partida !== J.partida || !J.activa) return;
          sonar("golpe", 0.6);
          const hasta = new THREE.Vector3(azar(-3.2, 3.2), 0, azar(2.5, 7));
          recibirAtaque(new THREE.Vector3(1, 2.4, -LARGO - 0.5), hasta, 1.9, 0.3, true);
        } else {
          $("accion").textContent = `Saca ${J.nombres[1 - ui.yo]}…`;
        }
      }

      // ---------- la pelota viene hacia mi lado ----------
      function recibirAtaque(desde, hasta, duracion, fuerza, saque) {
        $("accion").textContent = "";
        lanzarPelota(desde, hasta, duracion);
        marca.visible = true;
        J.fase = "recibir";
        // ¿quién de mi equipo la toma? el más cercano
        const d0 = jugadores[0].position.distanceTo(hasta),
          d1 = jugadores[1].position.distanceTo(hasta);
        const quien = d0 <= d1 ? 0 : 1;
        J.receptor = quien;
        jugadores[quien].userData.meta.set(hasta.x, 0, hasta.z + 0.3);
        jugadores[1 - quien].userData.meta.set(limitar(-hasta.x * 0.6, -3, 3), 0, 2.2);
        // momento del contacto: cuando la pelota baja a 1 m de altura
        const tContacto = tiempoAltura(1.0);
        J.contacto = { t: tContacto, fuerza, quien, fuera: Math.abs(hasta.x) > ANCHO + 0.1 || hasta.z > LARGO + 0.1 };
        if (J.contacto.fuera) {
          // si va para afuera, nadie la toca
          J.contacto.dejar = true;
          if (quien === 0) $("accion").textContent = "👀 ¡Va para afuera!";
          return;
        }
        if (quien === 0) esperarTiempo("recibir", tContacto);
        else {
          // el compañero recibe solo (casi siempre)
          const falla = Math.random() < 0.05 + fuerza * 0.15;
          J.contacto.auto = falla ? "falla" : "bien";
        }
      }
      function tiempoAltura(h) {
        // resuelve y(t) = h en la bajada
        const a = -0.5 * G,
          b = V.v0.y,
          c = V.desde.y - h;
        const disc = b * b - 4 * a * c;
        return disc < 0 ? V.duracion : (-b - Math.sqrt(disc)) / (2 * a);
      }

      // =========================================================
      //  TIEMPO Y GESTOS (aro que se cierra)
      // =========================================================
      const A = { esperando: null };
      function esperarTiempo(tipo, tObjetivo) {
        A.esperando = { tipo, tObjetivo, hecho: false };
        $("anillo").classList.remove("oculto");
        $("accion").textContent = tipo === "recibir" ? "👆 ¡Toca cuando se cierre el aro!" : "👉 ¡Desliza para rematar!";
      }
      function esperarGesto(tipo) {
        A.esperando = { tipo, hecho: false, libre: true };
      }
      function ocultarAnillo() {
        $("anillo").classList.add("oculto");
        A.esperando = null;
      }
      function calidad() {
        // 1 = perfecto, 0 = justo en la orilla, < 0 = fuera de tiempo
        const dif = Math.abs(V.t - A.esperando.tObjetivo);
        return 1 - dif / 0.22;
      }

      let toque = null;
      M.lienzo.addEventListener("pointerdown", (e) => {
        toque = { x: e.clientX, y: e.clientY, t: performance.now(), usado: false };
        if (A.esperando && A.esperando.tipo === "recibir" && !A.esperando.hecho) {
          A.esperando.hecho = true;
          recibir(calidad());
        }
      });
      M.lienzo.addEventListener("pointermove", (e) => {
        if (!toque || toque.usado || !A.esperando || A.esperando.hecho) return;
        const dx = e.clientX - toque.x,
          dy = e.clientY - toque.y;
        if (Math.hypot(dx, dy) < 34) return;
        toque.usado = true;
        if (A.esperando.tipo === "remate" || A.esperando.tipo === "saque") {
          A.esperando.hecho = true;
          const q = A.esperando.tipo === "saque" ? 0.75 : calidad();
          golpearHacia(A.esperando.tipo, dx, dy, q);
        }
      });
      M.lienzo.addEventListener("pointerup", () => (toque = null));
      document.addEventListener("keydown", (e) => {
        if (!A.esperando || A.esperando.hecho) return;
        if (A.esperando.tipo === "recibir" && (e.key === " " || e.key === "ArrowDown")) {
          A.esperando.hecho = true;
          recibir(calidad());
        }
        const dir = { ArrowLeft: [-1, -0.6], ArrowRight: [1, -0.6], ArrowUp: [0, -1], ArrowDown: [0, 0.3] }[e.key];
        if (dir && (A.esperando.tipo === "remate" || A.esperando.tipo === "saque")) {
          A.esperando.hecho = true;
          golpearHacia(A.esperando.tipo, dir[0] * 100, dir[1] * 100, A.esperando.tipo === "saque" ? 0.75 : calidad());
        }
      });

      // ---------- mi equipo: recibir → levantar → rematar ----------
      async function recibir(q) {
        ocultarAnillo();
        const quien = J.contacto.quien;
        if (q < 0) {
          $("accion").textContent = q < -0.5 ? "😬 ¡Muy tarde/temprano!" : "😬 ¡Casi!";
          J.contacto.falla = true;
          return;
        }
        $("accion").textContent = q > 0.75 ? "✨ ¡Perfecta!" : q > 0.35 ? "👍 Bien" : "😅 Apenas";
        J.contacto.hecho = true;
        await jugadaDeMiEquipo(quien, q);
      }

      async function jugadaDeMiEquipo(receptor, q) {
        const partida = J.partida;
        // espera el contacto
        while (V.t < J.contacto.t && partida === J.partida) await esperar(16);
        if (partida !== J.partida || !J.activa) return;
        J.fase = "armando";
        marca.visible = false;
        if (J.modo === "online") ui.enviar("recibio", { partida: J.partida, x: pelota.position.x, z: pelota.position.z });
        animarGolpe(receptor);
        sonar("golpe", 0.5);
        // recepción hacia el que va a levantar (el otro jugador), cerca de la red
        const levantador = 1 - receptor;
        const zonaLev = new THREE.Vector3(limitar(jugadores[receptor].position.x * 0.3, -2, 2), 0, 1.6);
        jugadores[levantador].userData.meta.copy(zonaLev);
        // una recepción mala sale chueca
        const desvio = (1 - q) * 1.6;
        const destino = zonaLev.clone().add(new THREE.Vector3(azar(-desvio, desvio), 2.3, azar(-desvio * 0.4, desvio * 0.6)));
        lanzarPelota(pelota.position.clone(), destino, 1.15 + (1 - q) * 0.2);
        await esperar(1150);
        if (partida !== J.partida || !J.activa) return;
        // levantada: siempre para mí (yo remato)
        animarGolpe(levantador);
        sonar("rebote", 0.5);
        const xRemate = limitar(-zonaLev.x * 0.6 + (Math.random() - 0.5), -2.8, 2.8);
        jugadores[0].userData.meta.set(xRemate, 0, 1.4);
        const punto = new THREE.Vector3(xRemate, 2.8, 0.9);
        lanzarPelota(pelota.position.clone(), punto, 1.05);
        esperarTiempo("remate", 1.05);
        A.esperando.limite = 1.05 + 0.25;
        J.fase = "remate";
      }

      function golpearHacia(tipo, dx, dy, q) {
        ocultarAnillo();
        // dirección del gesto → a dónde va en la cancha rival (z negativa)
        const lado = limitar(dx / 120, -1, 1);
        const largo = dy < -20 ? limitar(-dy / 160, 0.3, 1) : 0.15; // hacia arriba = al fondo; hacia abajo = cortita
        let hasta = new THREE.Vector3(lado * 3.4, 0, -1.5 - largo * 6);
        let desde = pelota.position.clone();
        let duracion, fuerza;
        if (tipo === "saque") {
          desde = new THREE.Vector3(pelota.position.x, 2.4, LARGO + 0.5);
          duracion = 1.9;
          fuerza = 0.3;
          animarGolpe(0);
        } else {
          if (q < 0) {
            // fuera de tiempo: red o afuera
            const red = Math.random() < 0.55;
            hasta = red ? new THREE.Vector3(desde.x, 0, 0.6) : new THREE.Vector3(lado * 5.5, 0, -LARGO - 2);
            lanzarPelota(desde, red ? new THREE.Vector3(desde.x, 1.2, 0.15) : hasta, red ? 0.35 : 1.0);
            animarGolpe(0);
            sonar("golpe", 0.6);
            $("accion").textContent = red ? "😖 ¡A la red!" : "😖 ¡Afuera!";
            J.fase = "error";
            return errorMio(red ? "red" : "fuera");
          }
          animarGolpe(0);
          duracion = 1.25 - q * 0.6; // mejor tiempo = más rápido
          fuerza = 0.25 + q * 0.75;
          // con mal tiempo también puede salir desviado
          hasta.x += azar(-1, 1) * (1 - q) * 1.5;
          $("accion").textContent = q > 0.75 ? "💥 ¡REMATAZO!" : q > 0.35 ? "🏐 ¡Remate!" : "🏐 Remate flojito";
        }
        sonar("golpe", 0.6 + fuerza * 0.6);
        lanzarPelota(desde, hasta, duracion);
        J.fase = "ataque";
        const fuera = Math.abs(hasta.x) > ANCHO || hasta.z < -LARGO;
        if (J.modo === "online") ui.enviar("ataque", { partida: J.partida, n: J.n++, desde: [desde.x, desde.y, desde.z], hasta: [hasta.x, hasta.z], duracion, fuerza, saque: tipo === "saque" });
        else defensaBot(hasta, duracion, fuerza, fuera);
      }

      async function errorMio(motivo) {
        const partida = J.partida;
        await esperar(900);
        if (partida !== J.partida) return;
        if (J.modo === "online") ui.enviar("punto", { partida: J.partida, n: J.n++, para: "tu", motivo });
        anotar(1, motivo);
      }

      // ---------- rivales bot ----------
      async function defensaBot(hasta, duracion, fuerza, fuera) {
        const partida = J.partida;
        const quien = jugadores[2].position.distanceTo(hasta) < jugadores[3].position.distanceTo(hasta) ? 2 : 3;
        if (!fuera) jugadores[quien].userData.meta.set(hasta.x, 0, hasta.z - 0.3);
        const nivel = { facil: 0.6, normal: 0.78, pro: 0.9 }[J.dificultad];
        const recibe = !fuera && Math.random() < nivel - fuerza * 0.32;
        const tContacto = tiempoAltura(1.0);
        await esperar((recibe ? tContacto : duracion) * 1000);
        if (partida !== J.partida || !J.activa) return;
        if (!recibe) return; // la pelota cae sola y el cuadro la anota
        V.activo = false;
        animarGolpe(quien);
        sonar("golpe", 0.5);
        const otro = quien === 2 ? 3 : 2;
        const zonaLev = new THREE.Vector3(azar(-1.5, 1.5), 0, -1.6);
        jugadores[otro].userData.meta.copy(zonaLev);
        lanzarPelota(pelota.position.clone(), zonaLev.clone().setY(2.3), 1.15);
        await esperar(1150);
        if (partida !== J.partida || !J.activa) return;
        animarGolpe(otro);
        jugadores[quien].userData.meta.set(azar(-2.5, 2.5), 0, -1.4);
        lanzarPelota(pelota.position.clone(), new THREE.Vector3(jugadores[quien].userData.meta.x, 2.8, -0.9), 1.0);
        await esperar(1000);
        if (partida !== J.partida || !J.activa) return;
        // remate del bot
        const err = { facil: 0.2, normal: 0.12, pro: 0.06 }[J.dificultad];
        const desde = pelota.position.clone();
        if (Math.random() < err) {
          lanzarPelota(desde, new THREE.Vector3(desde.x, 1.2, -0.15), 0.35);
          animarGolpe(quien);
          sonar("golpe", 0.6);
          await esperar(900);
          if (partida === J.partida) anotar(0, "red");
          return;
        }
        const q = { facil: azar(0.1, 0.5), normal: azar(0.25, 0.75), pro: azar(0.5, 1) }[J.dificultad];
        animarGolpe(quien);
        sonar("golpe", 0.8);
        recibirAtaque(desde, new THREE.Vector3(azar(-3.6, 3.6), 0, azar(1.2, 7.5)), 1.25 - q * 0.6, 0.25 + q * 0.75, false);
      }

      // online: mientras el rival arma su jugada, se ve en mi pantalla
      async function rallyRival(donde) {
        const partida = J.partida;
        J.fase = "rival";
        V.activo = false;
        marca.visible = false;
        const quien = jugadores[2].position.distanceTo(donde) < jugadores[3].position.distanceTo(donde) ? 2 : 3;
        const otro = quien === 2 ? 3 : 2;
        animarGolpe(quien);
        sonar("golpe", 0.5);
        const zonaLev = new THREE.Vector3(limitar(-donde.x * 0.3, -2, 2), 0, -1.6);
        jugadores[otro].userData.meta.copy(zonaLev);
        lanzarPelota(pelota.position.clone(), zonaLev.clone().setY(2.3), 1.15);
        await esperar(1150);
        if (partida !== J.partida || J.fase !== "rival") return;
        animarGolpe(otro);
        jugadores[quien].userData.meta.set(-zonaLev.x, 0, -1.4);
        lanzarPelota(pelota.position.clone(), new THREE.Vector3(-zonaLev.x, 2.8, -0.9), 1.05);
      }

      // ---------- puntos ----------
      function anotar(lado, motivo) {
        if (!J.activa || J.fase === "punto") return;
        J.fase = "punto";
        V.activo = false;
        ocultarAnillo();
        J.puntos[lado]++;
        J.saca = lado;
        const yo = J.modo === "online" ? ui.yo : 0;
        sonar(lado === 0 ? "perfecto" : "abucheo", 1.2);
        ui.avisar(lado === 0 ? "🎉 ¡Punto para tu equipo!" : `Punto para ${J.nombres[1 - yo]}`, lado === 0 ? "#ff4f8b" : "#3a86ff");
        marcador();
        const [a, b] = J.puntos;
        if ((a >= PUNTOS_GANAR || b >= PUNTOS_GANAR) && Math.abs(a - b) >= 2) return fin();
        nuevoPunto();
      }

      function fin() {
        J.activa = false;
        const yo = J.modo === "online" ? ui.yo : 0;
        const gane = J.puntos[0] > J.puntos[1];
        sonar(gane ? "ganar" : "perder");
        ui.terminar({ emoji: gane ? "🏆" : "😿", texto: gane ? "¡Ganó tu equipo!" : `Ganó ${J.nombres[1 - yo]}`, nota: `${J.puntos[0]} - ${J.puntos[1]}`, gano: gane });
      }

      function animarGolpe(i) {
        jugadores[i].userData.pose = 1;
      }

      // =========================================================
      //  CUADRO A CUADRO
      // =========================================================
      M.alCuadro((dt, ahora) => {
        // jugadores caminan a su lugar
        jugadores.forEach((j, i) => {
          const u = j.userData;
          const antes = j.position.clone();
          j.position.lerp(u.meta, Math.min(1, dt * 3.2));
          const vel = j.position.distanceTo(antes) / Math.max(dt, 0.001);
          const paso = Math.sin(ahora / 90) * Math.min(1, vel / 3);
          u.piernas[0].rotation.x = paso * 0.7;
          u.piernas[1].rotation.x = -paso * 0.7;
          u.pose = Math.max(0, u.pose - dt * 2.5);
          u.brazos.forEach((b) => (b.rotation.x = -u.pose * 2.6));
          j.lookAt(pelota.position.x, 0, pelota.position.z);
          if (i >= 2) j.position.y = 0;
        });
        if (!J.modo) {
          camara.position.set(Math.sin(ahora / 4000) * 6, 7, 15);
          camara.lookAt(0, 1, 0);
          return;
        }
        // cámara detrás de mi lado
        camara.position.lerp(new THREE.Vector3(pelota.position.x * 0.2, 7.2, LARGO + 9.5), Math.min(1, dt * 2));
        camara.lookAt(0, 1.2, -1);
        if (V.activo) {
          V.t += dt;
          const t = Math.min(V.t, V.duracion);
          pelota.position.copy(posPelota(t));
          pelota.rotation.x += dt * 8;
          // el aro
          if (A.esperando && A.esperando.tObjetivo != null && !A.esperando.hecho) {
            const falta = A.esperando.tObjetivo - V.t;
            const s = 1 + limitar(falta / 0.9, -0.3, 1) * 1.6;
            const p = M.aPantalla(pelota.position);
            const anillo = $("anillo");
            anillo.style.left = p.x + "px";
            anillo.style.top = p.y + "px";
            const e = anillo.querySelector(".encoge");
            e.style.transform = `scale(${Math.max(0.35, s * 0.4)})`;
            e.style.setProperty("--color", Math.abs(falta) < 0.08 ? "#26de81" : "#ffd84f");
            // se acabó el tiempo
            if (V.t > A.esperando.tObjetivo + 0.22) {
              const tipo = A.esperando.tipo;
              A.esperando.hecho = true;
              ocultarAnillo();
              if (tipo === "recibir") {
                $("accion").textContent = "😬 ¡No la alcanzaste!";
                J.contacto.falla = true;
              } else if (tipo === "remate") {
                // no remató: se le cae
                $("accion").textContent = "😬 ¡Se te pasó el remate!";
                V.duracion = V.t + 0.6;
                lanzarPelota(pelota.position.clone(), new THREE.Vector3(pelota.position.x, 0, pelota.position.z + 0.8), 0.6);
                errorMio("tarde");
              }
            }
          }
          // compañero recibe solo
          if (J.fase === "recibir" && J.contacto && J.contacto.auto === "bien" && V.t >= J.contacto.t) {
            J.contacto.auto = "hecho";
            jugadaDeMiEquipo(1, azar(0.5, 0.9));
          }
          // la pelota tocó la arena
          if (V.t >= V.duracion) {
            V.activo = false;
            sonar("rebote", 0.6);
            const p = pelota.position;
            const dentro = Math.abs(p.x) <= ANCHO + 0.1 && Math.abs(p.z) <= LARGO + 0.1;
            if (J.fase === "recibir") {
              // cayó en mi lado (o afuera)
              const paraRival = dentro;
              if (J.modo === "online") ui.enviar("punto", { partida: J.partida, n: J.n++, para: paraRival ? "tu" : "yo" });
              anotar(paraRival ? 1 : 0, paraRival ? "cayó" : "fuera");
            } else if (J.fase === "ataque" && J.modo === "bot") {
              anotar(dentro ? 0 : 1, dentro ? "cayó" : "fuera");
            }
          }
        }
        sombra.position.set(pelota.position.x, 0.02, pelota.position.z);
        sombra.scale.setScalar(1 + pelota.position.y * 0.15);
      });

      posicionesBase();
      jugadores.forEach((j) => j.position.copy(j.userData.meta));
      pelota.position.set(0, 3, 0);
    </script>
  </body>

<!doctype html>
<html lang="es">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <meta charset="UTF-8" />
    <title>Torre de Pasteles 3D 🍰</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at 50% 15%, #3a153b 0%, #15071a 65%, #07020a 100%);
        margin: 0;
        padding: 14px;
        text-align: center;
        color: #f8fafc;
        user-select: none;
      }

      #game-container {
        display: inline-block;
        background: linear-gradient(155deg, rgba(46, 20, 56, 0.94), rgba(18, 8, 26, 0.96));
        padding: 18px;
        border-radius: 30px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        border: 2px solid rgba(244, 114, 182, 0.45);
        position: relative;
        max-width: 100%;
      }

      canvas {
        background: linear-gradient(180deg, #1e1b4b 0%, #311042 60%, #4a154b 100%);
        border: 3px solid #f472b6;
        border-radius: 18px;
        cursor: pointer;
        max-width: 100%;
        height: auto;
        touch-action: none;
      }

      .hud {
        display: flex;
        justify-content: space-around;
        font-size: 1.25em;
        font-weight: 900;
        margin-bottom: 10px;
        color: #fde047;
        background: rgba(15, 23, 42, 0.78);
        padding: 8px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .btn-juego {
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white;
        border: none;
        padding: 11px 26px;
        font-size: 1.05em;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 900;
        margin: 6px;
        box-shadow: 0 6px 18px rgba(236, 72, 153, 0.4);
        text-decoration: none;
        display: inline-block;
      }

      #overlay {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.96);
        color: #fff;
        padding: 30px 24px;
        border-radius: 26px;
        width: 85%;
        border: 2px solid #f472b6;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div id="game-container">
      <h1 style="margin: 0 0 8px; color: #f472b6; font-size: 1.85rem">
        🍰 Torre de Pasteles 3D 🎂
      </h1>
      <div class="hud">
        <div>Pisos: <span id="score">0</span></div>
        <div>Racha Perfecta: <span id="racha-torre">×0</span> ✨</div>
      </div>
      <canvas id="gameCanvas" width="400" height="500"></canvas>
      <br />
      <button class="btn-juego" onclick="iniciarJuego()">
        ▶️ Jugar / Soltar (Espacio o Toque)
      </button>
      <a
        href="/secreto"
        class="btn-juego"
        style="background: rgba(255,255,255,0.12); border: 1px solid #f472b6"
        >🏠 Menú</a
      >

      <div id="overlay">
        <h2 style="color: #f472b6; font-size: 2em; margin: 0">
          ¡Se cayó el pastel! 💥
        </h2>
        <p style="font-size: 1.3em; color: #cbd5e1">
          Apilaste <b id="final-score" style="color:#fde047"></b> pisos.
        </p>
        <button class="btn-juego" onclick="guardar()">💾 Guardar Récord</button>
        <button
          class="btn-juego"
          onclick="iniciarJuego()"
          style="background: #475569"
        >
          🔄 Reintentar
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let cajas = [];
      let recortes = [];
      let textos = [];
      let cajaActual = null;
      let score = 0;
      let rachaPerfecta = 0;
      let gameActivo = false;
      let frameId;

      let velocidad = 3.8;
      let direccion = 1;
      const alturaCaja = 38;

      const coloresPastel = [
        { masa: "#f472b6", crema: "#fdf2f8" },
        { masa: "#a78bfa", crema: "#f5f3ff" },
        { masa: "#38bdf8", crema: "#f0f9ff" },
        { masa: "#34d399", crema: "#ecfdf5" },
        { masa: "#fbbf24", crema: "#fffbeb" },
        { masa: "#fb7185", crema: "#fff1f2" },
      ];

      function colorAleatorio() {
        return coloresPastel[cajas.length % coloresPastel.length];
      }

      function iniciarJuego() {
        if (gameActivo) {
          soltarCaja();
          return;
        }
        if (frameId) cancelAnimationFrame(frameId);

        cajas = [
          {
            x: 90,
            y: 452,
            w: 220,
            h: alturaCaja,
            tema: { masa: "#ec4899", crema: "#fce7f3" },
          },
        ];
        recortes = [];
        textos = [];
        score = 0;
        rachaPerfecta = 0;
        velocidad = 3.8;
        direccion = 1;
        document.getElementById("score").innerText = score;
        document.getElementById("racha-torre").innerText = "×0";
        document.getElementById("overlay").style.display = "none";

        crearNuevaCaja(220);
        gameActivo = true;
        frameId = requestAnimationFrame(gameLoop);
      }

      function crearNuevaCaja(ancho) {
        cajaActual = {
          x: 0,
          y: 95,
          w: ancho,
          h: alturaCaja,
          tema: colorAleatorio(),
        };
      }

      function soltarCaja() {
        if (!gameActivo || !cajaActual) return;
        const cajaAnterior = cajas[cajas.length - 1];

        const diff = Math.abs(cajaActual.x - cajaAnterior.x);
        const esPerfecto = diff <= 6;

        let nuevoX = Math.max(cajaActual.x, cajaAnterior.x);
        let overlap =
          Math.min(cajaActual.x + cajaActual.w, cajaAnterior.x + cajaAnterior.w) -
          nuevoX;

        if (esPerfecto) {
          nuevoX = cajaAnterior.x;
          overlap = cajaAnterior.w;
          rachaPerfecta++;
          if (rachaPerfecta >= 3 && overlap < 220) {
            overlap = Math.min(220, overlap + 14);
            nuevoX = Math.max(10, nuevoX - 7);
          }
          score += 2;
          textos.push({
            txt: `✨ ¡PERFECTO! ×${rachaPerfecta}`,
            x: nuevoX + overlap / 2,
            y: cajaActual.y,
            vida: 1,
            color: "#fde047",
          });
        } else if (overlap > 0) {
          rachaPerfecta = 0;
          score += 1;
          // Crear pedazo de pastel cortado que cae con gravedad
          const sobraW = cajaActual.w - overlap;
          const sobraX =
            cajaActual.x < cajaAnterior.x
              ? cajaActual.x
              : cajaAnterior.x + cajaAnterior.w;
          recortes.push({
            x: sobraX,
            y: cajaActual.y,
            w: sobraW,
            h: alturaCaja,
            vx: cajaActual.x < cajaAnterior.x ? -2.2 : 2.2,
            vy: 1,
            tema: cajaActual.tema,
          });
        }

        document.getElementById("racha-torre").innerText = `×${rachaPerfecta}`;

        if (overlap > 6) {
          document.getElementById("score").innerText = score;
          cajaActual.x = nuevoX;
          cajaActual.w = overlap;
          cajas.push({ ...cajaActual });
          cajas.forEach((caja) => (caja.y += alturaCaja));
          velocidad = Math.min(9.5, velocidad + 0.28);
          crearNuevaCaja(overlap);
        } else {
          terminarJuego();
        }
      }

      function dibujarPastel3D(c) {
        // Sombra 3D inferior
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.fillRect(c.x + 3, c.y + 4, c.w, c.h);

        // Bizcocho con volumen 3D
        const g = ctx.createLinearGradient(c.x, c.y, c.x + c.w, c.y);
        g.addColorStop(0, c.tema.masa);
        g.addColorStop(0.5, "#ffffff44");
        g.addColorStop(1, c.tema.masa);
        ctx.fillStyle = c.tema.masa;
        ctx.beginPath();
        ctx.roundRect(c.x, c.y, c.w, c.h, 8);
        ctx.fill();

        // Capa de glaseado superior con ondas
        ctx.fillStyle = c.tema.crema;
        ctx.beginPath();
        ctx.roundRect(c.x, c.y, c.w, 12, [8, 8, 4, 4]);
        ctx.fill();

        // Gotas de glaseado y chispitas
        for (let px = c.x + 10; px < c.x + c.w - 8; px += 18) {
          ctx.fillStyle = c.tema.crema;
          ctx.beginPath();
          ctx.arc(px, c.y + 12, 4.5, 0, Math.PI);
          ctx.fill();

          ctx.fillStyle = px % 36 === 0 ? "#fde047" : "#38bdf8";
          ctx.fillRect(px - 2, c.y + 4, 4, 3);
        }

        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(c.x + 1, c.y + 1, c.w - 2, c.h - 2);
      }

      function gameLoop() {
        if (!gameActivo) return;

        cajaActual.x += velocidad * direccion;
        if (cajaActual.x + cajaActual.w > canvas.width) {
          cajaActual.x = canvas.width - cajaActual.w;
          direccion = -1;
        } else if (cajaActual.x < 0) {
          cajaActual.x = 0;
          direccion = 1;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Base de plato de repostería
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.roundRect(65, 488, 270, 10, 5);
        ctx.fill();

        cajas.forEach(dibujarPastel3D);
        dibujarPastel3D(cajaActual);

        for (let i = recortes.length - 1; i >= 0; i--) {
          const r = recortes[i];
          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.45;
          dibujarPastel3D(r);
          if (r.y > canvas.height + 50) recortes.splice(i, 1);
        }

        for (let i = textos.length - 1; i >= 0; i--) {
          const t = textos[i];
          t.y -= 1.2;
          t.vida -= 0.025;
          if (t.vida <= 0) {
            textos.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = t.vida;
          ctx.fillStyle = t.color;
          ctx.font = "900 18px Nunito, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(t.txt, t.x, t.y);
          ctx.restore();
        }

        frameId = requestAnimationFrame(gameLoop);
      }

      function terminarJuego() {
        gameActivo = false;
        cancelAnimationFrame(frameId);
        document.getElementById("final-score").innerText = score;
        document.getElementById("overlay").style.display = "block";
      }

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          if (!gameActivo) iniciarJuego();
          else soltarCaja();
          e.preventDefault();
        }
      });
      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (!gameActivo) iniciarJuego();
        else soltarCaja();
      });

      function guardar() {
        let nombre =
          localStorage.getItem("nombreUsuario") ||
          prompt("Ingresa tu nombre maestro repostero:");
        if (nombre) {
          localStorage.setItem("nombreUsuario", nombre);
          fetch("/guardar_torre", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: nombre, puntos: score }),
          }).then(() => (window.location.href = "/secreto"));
        }
      }

      function alGanarJuego(misPuntos) {
        enviarPuntaje("/guardar_tu_juego", { puntos: misPuntos });
      }
    </script>
  </body>
</html>

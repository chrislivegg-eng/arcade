<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Conecta 4 3D Kawaii 🔴🟡</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at top, #fff0f7 0%, #ffd6eb 60%, #ffb8de 100%);
        text-align: center;
        margin: 0;
        padding: 16px 10px 28px;
        min-height: 100vh;
      }
      .kawaii-box {
        background: rgba(255, 255, 255, 0.96);
        padding: 24px 18px;
        border-radius: 32px;
        border: 3px solid #ffb3d9;
        display: inline-block;
        box-shadow:
          0 18px 44px rgba(216, 27, 96, 0.22),
          0 8px 0 #ff99cc;
        max-width: 500px;
        width: 100%;
      }
      h1 {
        color: #d81b60;
        font-size: 2rem;
        margin: 6px 0 14px;
        cursor: pointer;
        user-select: none;
        text-shadow: 0 2px 0 #fff;
      }
      .menu-modos {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .btn-modo {
        font-size: 1.15rem;
        font-family: "Nunito", sans-serif;
        padding: 14px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        color: white;
        font-weight: 900;
        width: 100%;
      }
      .btn-bot {
        background: linear-gradient(180deg, #ff85c0, #d81b60);
        box-shadow: 0 5px 0 #9c1448;
      }
      .btn-online {
        background: linear-gradient(180deg, #6366f1, #4338ca);
        box-shadow: 0 5px 0 #312e81;
      }
      .codigo-sala {
        font-size: 1.4rem;
        font-weight: 900;
        color: #d81b60;
        background: #ffe6f2;
        padding: 6px 18px;
        border-radius: 15px;
        display: inline-block;
        border: 2px dashed #ff99cc;
        margin: 8px 0;
      }
      .tablero-marco {
        background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        padding: 12px;
        border-radius: 22px;
        display: inline-block;
        border: 3px solid #7dd3fc;
        box-shadow:
          0 10px 0 #0369a1,
          0 16px 32px rgba(2, 132, 199, 0.35),
          inset 0 2px 4px rgba(255, 255, 255, 0.5);
      }
      .tablero {
        display: grid;
        grid-template-columns: repeat(7, min(44px, 11vw));
        gap: 6px;
      }
      .celda {
        width: min(44px, 11vw);
        height: min(44px, 11vw);
        background: radial-gradient(circle at 50% 35%, #f1f5f9, #cbd5e1);
        border-radius: 50%;
        font-size: 1.45rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: inset 0 4px 6px rgba(15, 23, 42, 0.35);
        user-select: none;
        transition: transform 0.12s;
      }
      .celda:hover {
        transform: scale(1.06);
      }
      .ganador-brillo {
        animation: latido 0.5s infinite alternate;
        box-shadow: 0 0 16px #fde047, inset 0 2px 4px #fff;
        border: 3px solid #ffffff;
      }
      @keyframes latido {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.1);
        }
      }
      .caja-chat {
        background: #fff0f5;
        width: 100%;
        max-width: 360px;
        margin: 12px auto;
        border-radius: 15px;
        padding: 10px;
        display: none;
        border: 2px solid #ffb3d9;
      }
      .mensajes {
        height: 80px;
        overflow-y: auto;
        font-size: 0.85rem;
        text-align: left;
        margin-bottom: 6px;
      }
      .btn-accion {
        background: linear-gradient(180deg, #ff66b3, #d81b60);
        color: white;
        border: none;
        padding: 11px;
        border-radius: 22px;
        width: 100%;
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        font-size: 1rem;
        margin-top: 8px;
        cursor: pointer;
        box-shadow: 0 4px 0 #9c1448;
      }
    </style>
  </head>
  <body>
    <div class="kawaii-box">
      <h1 id="titulo" onclick="activarModoSecreto()">🔴 Conecta 4 3D 🟡</h1>

      <div id="pantalla-menu">
        <div class="menu-modos">
          <button class="btn-modo btn-bot" onclick="iniciarModo('bot')">
            🤖 Jugar contra Bot
          </button>
          <button class="btn-modo btn-online" onclick="abrirLobby()">
            🌐 Jugar en Línea
          </button>
          <a
            href="/secreto"
            class="btn-accion"
            style="background: #94a3b8; box-shadow: 0 4px 0 #64748b; text-decoration: none; display: inline-block"
            >🏠 Volver al Menú</a
          >
        </div>
      </div>

      <div id="pantalla-lobby" style="display: none">
        <input
          type="text"
          id="input-codigo"
          placeholder="CÓDIGO (4 letras)"
          maxlength="4"
          style="
            padding: 12px;
            text-transform: uppercase;
            border-radius: 14px;
            border: 2px solid #ff99cc;
            text-align: center;
            font-weight: 900;
            width: 80%;
            margin-bottom: 8px;
          "
        />
        <button class="btn-accion" onclick="crearSala()">✨ Crear Sala</button>
        <button
          class="btn-accion"
          onclick="unirseSala()"
          style="background: #8b5cf6; box-shadow: 0 4px 0 #5b21b6"
        >
          🚀 Entrar a Sala
        </button>
        <button
          class="btn-accion"
          onclick="volverMenu()"
          style="background: #94a3b8; box-shadow: 0 4px 0 #64748b"
        >
          ⬅️ Salir al Menú
        </button>
      </div>

      <div id="pantalla-juego" style="display: none">
        <div id="info-sala" style="display: none">
          <div class="codigo-sala" id="texto-codigo-sala">----</div>
        </div>
        <div
          id="mensaje"
          style="font-weight: 900; color: #d81b60; margin: 10px; font-size: 1.15rem"
        >
          Preparando...
        </div>
        <div class="tablero-marco">
          <div class="tablero" id="tablero"></div>
        </div>

        <div class="caja-chat" id="caja-chat">
          <div class="mensajes" id="mensajes-chat"></div>
          <input
            type="text"
            id="input-msj"
            style="width: 72%; padding: 6px; border-radius: 8px; border: 1px solid #ff99cc"
            placeholder="Chat..."
          />
          <button
            onclick="enviarChat()"
            style="padding: 6px 12px; border-radius: 8px; background: #d81b60; color: #fff; border: none; font-weight: bold"
          >
            Env
          </button>
        </div>

        <button class="btn-accion" onclick="reiniciarTablero()">
          🔄 Reiniciar Partida
        </button>
        <button
          class="btn-accion"
          onclick="volverMenu()"
          style="background: #94a3b8; box-shadow: 0 4px 0 #64748b"
        >
          ⬅️ Salir al Menú
        </button>
      </div>
    </div>

    <script>
      let modoActual = "",
        miJugador = "🔴",
        turnoActual = "🔴",
        salaActual = "",
        juegoTerminado = false;
      let recordGuardado = false,
        contadorClicks = 0,
        botModoFacil = false,
        intervaloPoll = null;
      let tableroLocal = Array(42).fill("");

      function activarModoSecreto() {
        if (++contadorClicks >= 3) {
          botModoFacil = !botModoFacil;
          alert(
            botModoFacil
              ? "🤫 ¡Modo Bebé Activado!"
              : "🤖 ¡Modo Normal Restaurado!",
          );
          contadorClicks = 0;
        }
      }

      function abrirLobby() {
        document.getElementById("pantalla-menu").style.display = "none";
        document.getElementById("pantalla-lobby").style.display = "block";
      }

      function iniciarModo(modo) {
        modoActual = modo;
        document.getElementById("pantalla-menu").style.display = "none";
        document.getElementById("pantalla-lobby").style.display = "none";
        document.getElementById("pantalla-juego").style.display = "block";

        if (modo === "online") {
          document.getElementById("info-sala").style.display = "block";
          document.getElementById("caja-chat").style.display = "block";
          if (intervaloPoll) clearInterval(intervaloPoll);
          intervaloPoll = setInterval(sincronizarOnline, 1000);
        } else {
          document.getElementById("info-sala").style.display = "none";
          document.getElementById("caja-chat").style.display = "none";
          miJugador = "🔴";
          iniciarJuegoLocal();
        }
      }

      function volverMenu() {
        if (intervaloPoll) clearInterval(intervaloPoll);
        document.getElementById("pantalla-juego").style.display = "none";
        document.getElementById("pantalla-lobby").style.display = "none";
        document.getElementById("pantalla-menu").style.display = "block";
        juegoTerminado = false;
        document.getElementById("tablero").innerHTML = "";
      }

      function reiniciarTablero() {
        juegoTerminado = false;
        recordGuardado = false;
        if (modoActual === "bot") {
          iniciarJuegoLocal();
          document.getElementById("mensaje").innerText = "¡Tu turno! 🔴";
        } else if (modoActual === "online" && salaActual) {
          fetch("/api/reiniciar_c4", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sala: salaActual }),
          })
            .then(() => sincronizarOnline())
            .catch(() => {});
        }
      }

      function crearSala() {
        fetch("/api/crear_sala_c4", { method: "POST" })
          .then((res) => res.json())
          .then((data) => {
            salaActual = data.sala;
            miJugador = "🔴";
            iniciarModo("online");
          })
          .catch(() => alert("Error al conectar con el servidor"));
      }

      function unirseSala() {
        let cod = document
          .getElementById("input-codigo")
          .value.trim()
          .toUpperCase();
        if (!cod) return alert("Ingresa un código");
        fetch("/api/estado_c4?sala=" + cod)
          .then((res) => {
            if (res.ok) {
              salaActual = cod;
              miJugador = "🟡";
              iniciarModo("online");
            } else {
              alert("Sala no encontrada");
            }
          })
          .catch(() => alert("Error al conectar con el servidor"));
      }

      function dibujarTablero(t) {
        const cont = document.getElementById("tablero");
        cont.innerHTML = "";
        t.forEach((v, i) => {
          let div = document.createElement("div");
          div.className = "celda";
          div.id = "celda-" + i;
          div.innerText = v;
          div.onclick = () => {
            if (!juegoTerminado) {
              modoActual === "online"
                ? hacerMovimientoOnline(i % 7)
                : hacerMovimientoLocal(i % 7);
            }
          };
          cont.appendChild(div);
        });
      }

      function sincronizarOnline() {
        fetch("/api/estado_c4?sala=" + salaActual)
          .then((res) => res.json())
          .then((data) => {
            turnoActual = data.turno;
            document.getElementById("texto-codigo-sala").innerText = salaActual;
            document.getElementById("mensajes-chat").innerHTML =
              data.chat.join("<br>");
            if (!juegoTerminado) {
              dibujarTablero(data.tablero);
              checarGanador(data.tablero);
            }
            if (!juegoTerminado) {
              document.getElementById("mensaje").innerText =
                turnoActual === miJugador ? "¡Tu turno!" : "Esperando rival...";
            }
          })
          .catch(() => {});
      }

      function hacerMovimientoOnline(col) {
        if (turnoActual !== miJugador) return;
        fetch("/api/jugar_c4", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sala: salaActual,
            columna: col,
            jugador: miJugador,
          }),
        }).then(sincronizarOnline);
      }

      function iniciarJuegoLocal() {
        tableroLocal = Array(42).fill("");
        turnoActual = "🔴";
        dibujarTablero(tableroLocal);
        document.getElementById("mensaje").innerText = "¡Tu turno! 🔴";
      }

      function aplicarGravedad(t, col, jug) {
        for (let f = 5; f >= 0; f--) {
          if (t[f * 7 + col] === "") {
            t[f * 7 + col] = jug;
            return true;
          }
        }
        return false;
      }

      function hacerMovimientoLocal(col) {
        if (turnoActual !== "🔴" || !aplicarGravedad(tableroLocal, col, "🔴"))
          return;
        dibujarTablero(tableroLocal);
        if (checarGanador(tableroLocal)) return;

        turnoActual = "🟡";
        document.getElementById("mensaje").innerText = "Pensando... 🤔";
        setTimeout(() => {
          if (!juegoTerminado) {
            aplicarGravedad(tableroLocal, determinarBot(tableroLocal), "🟡");
            dibujarTablero(tableroLocal);
            if (!checarGanador(tableroLocal)) {
              turnoActual = "🔴";
              document.getElementById("mensaje").innerText = "¡Tu turno! 🔴";
            }
          }
        }, 420);
      }

      function determinarBot(t) {
        let cols = [...Array(7).keys()].filter((c) => t[c] === "");
        if (cols.length === 0) return 0;
        if (!botModoFacil) {
          for (let c of cols) {
            let t2 = [...t];
            aplicarGravedad(t2, c, "🟡");
            let r = checarGanadorSilencioso(t2);
            if (r && r.p === "🟡") return c;
          }
          for (let c of cols) {
            let t2 = [...t];
            aplicarGravedad(t2, c, "🔴");
            let r = checarGanadorSilencioso(t2);
            if (r && r.p === "🔴") return c;
          }
        }
        return cols[Math.floor(Math.random() * cols.length)];
      }

      function checarGanador(t) {
        let res = checarGanadorSilencioso(t);
        if (res && !juegoTerminado) {
          juegoTerminado = true;
          res.celdas.forEach((i) => {
            let el = document.getElementById("celda-" + i);
            if (el) el.classList.add("ganador-brillo");
          });
          let m = document.getElementById("mensaje");
          if (res.p === "empate") {
            m.innerText = "¡Empate! 🤝";
          } else {
            m.innerText = "¡Ganó " + res.p + "! 🎉";
            if (
              !recordGuardado &&
              ((modoActual === "bot" && res.p === "🔴") ||
                (modoActual === "online" && res.p === miJugador))
            ) {
              recordGuardado = true;
              setTimeout(() => guardarVictoriaC4(modoActual), 900);
            }
          }
          return true;
        }
        return false;
      }

      function checarGanadorSilencioso(t) {
        for (let f = 0; f < 6; f++) {
          for (let c = 0; c < 7; c++) {
            let i = f * 7 + c;
            if (t[i] === "") continue;
            let p = t[i];
            if (c <= 3 && t[i + 1] === p && t[i + 2] === p && t[i + 3] === p)
              return { p, celdas: [i, i + 1, i + 2, i + 3] };
            if (f <= 2 && t[i + 7] === p && t[i + 14] === p && t[i + 21] === p)
              return { p, celdas: [i, i + 7, i + 14, i + 21] };
            if (
              f <= 2 &&
              c <= 3 &&
              t[i + 8] === p &&
              t[i + 16] === p &&
              t[i + 24] === p
            )
              return { p, celdas: [i, i + 8, i + 16, i + 24] };
            if (
              f <= 2 &&
              c >= 3 &&
              t[i + 6] === p &&
              t[i + 12] === p &&
              t[i + 18] === p
            )
              return { p, celdas: [i, i + 6, i + 12, i + 18] };
          }
        }
        return !t.includes("") ? { p: "empate", celdas: [] } : null;
      }

      function guardarVictoriaC4(modo) {
        let ruta =
          modo === "online"
            ? "/guardar_victoria_c4_online"
            : "/guardar_victoria_c4";
        let nombre = "";
        try {
          nombre = localStorage.getItem("nombreUsuario") || "";
        } catch (e) {}
        if (!nombre) nombre = prompt("¡Victoria! Ingresa tu nombre:") || "";
        if (nombre) {
          fetch(ruta, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: nombre, puntos: 1 }),
          }).catch(() => {});
        }
      }

      function enviarChat() {
        let msg = document.getElementById("input-msj");
        if (!msg.value.trim()) return;
        fetch("/api/enviar_chat_c4", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sala: salaActual,
            jugador: miJugador,
            mensaje: msg.value,
          }),
        })
          .then(() => {
            msg.value = "";
            sincronizarOnline();
          })
          .catch(() => {});
      }
    </script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
  </body>
</html>

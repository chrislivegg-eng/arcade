<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>💖 Memorama 3D Kawaii</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at top, #fff0f7 0%, #ffd6eb 60%, #ffb8de 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 36px;
        padding: 26px 22px;
        max-width: 580px;
        width: 100%;
        box-shadow:
          0 20px 50px rgba(216, 27, 96, 0.22),
          0 8px 0 #ff99cc;
        border: 3px solid #ffb3d9;
        text-align: center;
      }

      h1 {
        font-size: 2.1rem;
        color: #d81b60;
        text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(216, 27, 96, 0.2);
        margin-bottom: 4px;
      }

      .subtitle {
        color: #ad1457;
        font-size: 0.95rem;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .lobby-box {
        background: #fff5f9;
        padding: 22px;
        border-radius: 25px;
        border: 3px dashed #ff99cc;
        margin: 12px 0;
      }

      .lobby-box h3 {
        color: #d81b60;
        margin-bottom: 12px;
      }

      .lobby-box hr {
        border: 1px solid #ffd6eb;
        margin: 18px 0;
      }

      .btn {
        padding: 13px 24px;
        border: none;
        border-radius: 50px;
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        color: white;
        width: 100%;
        margin-bottom: 10px;
      }

      .btn-primary {
        background: linear-gradient(180deg, #ff6b9d, #d81b60);
        box-shadow: 0 5px 0 #9c1448, 0 8px 18px rgba(216, 27, 96, 0.3);
      }

      .btn-purple {
        background: linear-gradient(180deg, #8b5cf6, #6d28d9);
        box-shadow: 0 5px 0 #4c1d95, 0 8px 18px rgba(109, 40, 217, 0.3);
      }

      .btn-green {
        background: linear-gradient(180deg, #10b981, #059669);
        box-shadow: 0 5px 0 #065f46, 0 8px 18px rgba(16, 185, 129, 0.3);
      }

      .btn:active {
        transform: translateY(3px);
      }

      .input-sala {
        padding: 12px 18px;
        border-radius: 15px;
        border: 2px solid #ff99cc;
        font-size: 1.05rem;
        text-align: center;
        width: 85%;
        margin-bottom: 12px;
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        outline: none;
      }

      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff5f9;
        padding: 10px 16px;
        border-radius: 18px;
        border: 2px solid #ff99cc;
        margin-bottom: 12px;
      }

      .game-header .room-info {
        font-weight: 900;
        color: #d81b60;
        font-size: 0.95rem;
      }

      .game-header .player-info {
        background: #d81b60;
        color: white;
        padding: 4px 14px;
        border-radius: 30px;
        font-weight: 900;
        font-size: 0.88rem;
      }

      .turn-indicator {
        font-size: 1.1rem;
        font-weight: 900;
        color: #4a2a3a;
        padding: 10px;
        background: white;
        border-radius: 15px;
        border: 2px solid #ffccdd;
        margin-bottom: 12px;
      }

      .marcador {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 12px auto;
        max-width: 340px;
      }

      .stat-card {
        background: white;
        border-radius: 18px;
        padding: 10px;
        border: 2px solid #ffccdd;
        box-shadow: 0 4px 0 #ffd6eb;
      }

      .stat-card .stat-number {
        font-size: 1.65rem;
        font-weight: 900;
        color: #d81b60;
      }

      .stat-card .stat-label {
        font-size: 0.72rem;
        color: #9d4edd;
        font-weight: 900;
        text-transform: uppercase;
      }

      .memorama-tablero {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        max-width: 390px;
        margin: 16px auto;
      }

      .carta {
        aspect-ratio: 1;
        background: linear-gradient(145deg, #ff85c0, #d81b60);
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.35rem;
        color: transparent;
        transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        box-shadow:
          0 6px 0 #9c1448,
          0 10px 20px rgba(216, 27, 96, 0.22),
          inset 0 2px 3px rgba(255, 255, 255, 0.5);
        user-select: none;
        border: 3px solid rgba(255, 255, 255, 0.65);
        min-height: 68px;
        position: relative;
      }

      .carta::after {
        content: "🎀";
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.85);
        position: absolute;
      }

      .carta.volteada {
        background: linear-gradient(180deg, #ffffff 0%, #fff0f7 100%);
        color: #4a2a3a;
        border: 3px solid #ff66b3;
        box-shadow:
          0 5px 0 #ff99cc,
          0 8px 18px rgba(255, 51, 133, 0.22);
        transform: translateY(-2px);
      }

      .carta.volteada::after,
      .carta.encontrada::after {
        content: "";
      }

      .carta.encontrada {
        background: linear-gradient(180deg, #fef9c3 0%, #fde047 100%);
        color: #4a2a3a;
        cursor: default;
        border: 3px solid #f59e0b;
        transform: scale(0.96);
        box-shadow: 0 4px 0 #d97706;
      }

      .carta:hover:not(.volteada):not(.encontrada) {
        transform: translateY(-3px);
      }

      .back-link {
        display: inline-block;
        margin-top: 10px;
        color: #d81b60;
        font-weight: 900;
        text-decoration: none;
        padding: 8px 20px;
        border-radius: 30px;
        border: 2px solid #d81b60;
        font-size: 0.9rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>💖 Memorama Kawaii 3D</h1>
      <p class="subtitle">🎮 Entrena tu memoria en solitario o reta a un amigo online</p>

      <!-- LOBBY -->
      <div id="pantalla-lobby" class="lobby-box">
        <h3>🌟 Modo Solitario (Clásico)</h3>
        <button class="btn btn-green" onclick="iniciarModoSolo()">
          🎀 Jugar Solo (Récord de Intentos)
        </button>

        <hr />

        <h3>🌐 Jugar Online con un Amigo</h3>
        <button class="btn btn-primary" onclick="crearSala()">
          ✨ Crear Nueva Sala Online
        </button>

        <input
          type="text"
          id="codigo-sala"
          class="input-sala"
          placeholder="📝 CÓDIGO (Ej. X7Y2)"
          maxlength="6"
        />
        <button class="btn btn-purple" onclick="unirseSala()">
          🚀 Unirse a Sala
        </button>

        <br />
        <a href="/secreto" class="back-link">🏠 Volver al Menú</a>
      </div>

      <!-- JUEGO -->
      <div id="pantalla-juego" style="display: none">
        <div class="game-header">
          <span class="room-info">🏠 Modo: <span id="display-sala">SOLO</span></span>
          <span class="player-info">Jugador <span id="display-jugador">1</span></span>
        </div>

        <div class="turn-indicator" id="turnIndicator">
          <span id="display-turno">🎀 ¡Encuentra todas las parejas!</span>
        </div>

        <div class="marcador">
          <div class="stat-card player1">
            <div class="stat-number" id="pts-1">0</div>
            <div class="stat-label" id="lbl-1">🎀 Pares</div>
          </div>
          <div class="stat-card player2">
            <div class="stat-number" id="pts-2">0</div>
            <div class="stat-label" id="lbl-2">🎯 Intentos</div>
          </div>
        </div>

        <div class="memorama-tablero" id="tablero"></div>

        <div
          style="
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
          "
        >
          <button
            class="btn btn-green"
            onclick="reiniciarJuego()"
            style="width: auto; padding: 10px 20px; font-size: 0.9rem"
          >
            🔄 Nueva Partida
          </button>
          <button
            class="btn btn-primary"
            onclick="salirJuego()"
            style="
              width: auto;
              padding: 10px 20px;
              font-size: 0.9rem;
              background: #94a3b8;
              box-shadow: 0 4px 0 #64748b;
            "
          >
            🚪 Salir
          </button>
        </div>
      </div>
    </div>

    <script>
      const EMOJIS_BASE = ["🎀", "🐱", "🍓", "🌸", "🍭", "🦄", "💎", "👑"];
      let modoJuego = "solo"; // 'solo' | 'online'
      let miSala = "";
      let miJugador = 1;
      let intervalo = null;
      let juegoActivo = false;
      let procesando = false;

      // Estado para modo solo
      let cartasSolo = [];
      let visiblesSolo = [];
      let resueltasSolo = [];
      let seleccionSolo = [];
      let paresSolo = 0;
      let intentosSolo = 0;

      // ============================================================
      //  MODO SOLO (1 JUGADOR)
      // ============================================================
      function iniciarModoSolo() {
        modoJuego = "solo";
        if (intervalo) clearInterval(intervalo);
        document.getElementById("pantalla-lobby").style.display = "none";
        document.getElementById("pantalla-juego").style.display = "block";
        document.getElementById("display-sala").textContent = "SOLITARIO";
        document.getElementById("display-jugador").textContent = "1";
        document.getElementById("lbl-1").textContent = "🎀 Pares (de 8)";
        document.getElementById("lbl-2").textContent = "🎯 Intentos";
        document.getElementById("display-turno").textContent =
          "🎀 ¡Encuentra los 8 pares en el menor número de intentos!";

        cartasSolo = [...EMOJIS_BASE, ...EMOJIS_BASE];
        for (let i = cartasSolo.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cartasSolo[i], cartasSolo[j]] = [cartasSolo[j], cartasSolo[i]];
        }
        visiblesSolo = Array(16).fill(false);
        resueltasSolo = Array(16).fill(false);
        seleccionSolo = [];
        paresSolo = 0;
        intentosSolo = 0;
        juegoActivo = true;
        procesando = false;
        actualizarMarcadorSolo();
        renderizarTableroSolo();
      }

      function actualizarMarcadorSolo() {
        document.getElementById("pts-1").textContent = paresSolo;
        document.getElementById("pts-2").textContent = intentosSolo;
      }

      function renderizarTableroSolo() {
        const tablero = document.getElementById("tablero");
        tablero.innerHTML = "";
        for (let i = 0; i < 16; i++) {
          const div = document.createElement("div");
          div.className = "carta";
          if (visiblesSolo[i] || resueltasSolo[i]) {
            div.classList.add("volteada");
            div.textContent = cartasSolo[i];
            if (resueltasSolo[i]) div.classList.add("encontrada");
          }
          if (!visiblesSolo[i] && !resueltasSolo[i] && !procesando && juegoActivo) {
            div.onclick = () => voltearCartaSolo(i);
          }
          tablero.appendChild(div);
        }
      }

      function voltearCartaSolo(idx) {
        if (!juegoActivo || procesando || visiblesSolo[idx] || resueltasSolo[idx]) return;
        visiblesSolo[idx] = true;
        seleccionSolo.push(idx);
        renderizarTableroSolo();

        if (seleccionSolo.length === 2) {
          procesando = true;
          intentosSolo++;
          actualizarMarcadorSolo();
          const [i1, i2] = seleccionSolo;
          if (cartasSolo[i1] === cartasSolo[i2]) {
            resueltasSolo[i1] = true;
            resueltasSolo[i2] = true;
            paresSolo++;
            seleccionSolo = [];
            procesando = false;
            actualizarMarcadorSolo();
            renderizarTableroSolo();
            if (paresSolo === 8) {
              juegoActivo = false;
              document.getElementById("display-turno").textContent =
                `🎉 ¡Completado en ${intentosSolo} intentos!`;
              guardarRecordSolo(intentosSolo);
            }
          } else {
            setTimeout(() => {
              visiblesSolo[i1] = false;
              visiblesSolo[i2] = false;
              seleccionSolo = [];
              procesando = false;
              renderizarTableroSolo();
            }, 650);
          }
        }
      }

      function guardarRecordSolo(intentos) {
        let nombre = "";
        try {
          nombre = localStorage.getItem("nombreUsuario") || "";
        } catch (e) {}
        if (!nombre) nombre = "Jugador";
        fetch("/guardar_memorama", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre: nombre, intentos: intentos }),
        }).catch(() => {});
      }

      // ============================================================
      //  FUNCIONES DE SALA ONLINE
      // ============================================================
      function crearSala() {
        modoJuego = "online";
        fetch("/api/crear_sala_memorama", { method: "POST" })
          .then((r) => r.json())
          .then((data) => {
            miSala = data.sala;
            miJugador = 1;
            arrancarJuego();
          })
          .catch(() => {
            miSala = Math.random().toString(36).substring(2, 6).toUpperCase();
            miJugador = 1;
            arrancarJuego();
          });
      }

      function unirseSala() {
        const cod = document.getElementById("codigo-sala").value.trim().toUpperCase();
        if (cod.length < 4) {
          alert("⚠️ Ingresa un código válido de 4 caracteres");
          return;
        }
        modoJuego = "online";
        miSala = cod;
        miJugador = 2;
        arrancarJuego();
      }

      function arrancarJuego() {
        document.getElementById("pantalla-lobby").style.display = "none";
        document.getElementById("pantalla-juego").style.display = "block";
        document.getElementById("display-sala").textContent = miSala;
        document.getElementById("display-jugador").textContent = miJugador;
        document.getElementById("lbl-1").textContent = "🎀 Jugador 1";
        document.getElementById("lbl-2").textContent = "🌟 Jugador 2";
        juegoActivo = true;
        procesando = false;

        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(obtenerEstado, 800);
        obtenerEstado();
      }

      // ============================================================
      //  OBTENER ESTADO ONLINE
      // ============================================================
      function obtenerEstado() {
        if (!juegoActivo || modoJuego !== "online") return;

        fetch(`/api/estado_memorama/${miSala}`)
          .then((r) => r.json())
          .then((estado) => {
            const esMiTurno = estado.turno === miJugador;
            const turnoText = esMiTurno
              ? "🎀 ¡ES TU TURNO!"
              : "⏳ Esperando al rival...";
            document.getElementById("display-turno").textContent = turnoText;

            document.getElementById("pts-1").textContent = estado.puntos_1;
            document.getElementById("pts-2").textContent = estado.puntos_2;

            renderizarTablero(estado);

            if (
              estado.cartas_seleccionadas &&
              estado.cartas_seleccionadas.length === 2 &&
              !procesando
            ) {
              procesando = true;
              setTimeout(() => {
                fetch("/api/verificar_memorama", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ sala: miSala }),
                })
                  .then((r) => r.json())
                  .then((nuevoEstado) => {
                    procesando = false;
                    renderizarTablero(nuevoEstado);
                  })
                  .catch(() => {
                    procesando = false;
                  });
              }, 700);
            }

            const totalPares = 8;
            if (estado.puntos_1 + estado.puntos_2 === totalPares) {
              clearInterval(intervalo);
              juegoActivo = false;
              const ganador =
                estado.puntos_1 > estado.puntos_2
                  ? 1
                  : estado.puntos_2 > estado.puntos_1
                    ? 2
                    : 0;
              const mensaje =
                ganador === 0
                  ? "🤝 ¡Empate!"
                  : ganador === miJugador
                    ? "🎉 ¡GANASTE LA PARTIDA!"
                    : "😅 Ganó tu rival";
              document.getElementById("display-turno").textContent = mensaje;
              if (ganador === miJugador) {
                guardarVictoria(ganador);
              }
            }
          })
          .catch(() => {});
      }

      function renderizarTablero(estado) {
        const tablero = document.getElementById("tablero");
        tablero.innerHTML = "";

        for (let i = 0; i < 16; i++) {
          const div = document.createElement("div");
          div.className = "carta";

          if (estado.visibles[i] || estado.resueltas[i]) {
            div.classList.add("volteada");
            div.textContent = estado.cartas[i];
            if (estado.resueltas[i]) {
              div.classList.add("encontrada");
            }
          }

          if (
            estado.turno === miJugador &&
            !estado.visibles[i] &&
            !estado.resueltas[i] &&
            !procesando &&
            (!estado.cartas_seleccionadas || estado.cartas_seleccionadas.length < 2)
          ) {
            div.onclick = () => jugarCarta(i);
            div.style.cursor = "pointer";
          } else {
            div.style.cursor = "default";
          }

          tablero.appendChild(div);
        }
      }

      function jugarCarta(idx) {
        if (procesando || !juegoActivo) return;
        procesando = true;

        fetch("/api/jugar_memorama", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sala: miSala,
            jugador: miJugador,
            idx: idx,
          }),
        })
          .then((r) => r.json())
          .then((estado) => {
            renderizarTablero(estado);
            if (estado.cartas_seleccionadas && estado.cartas_seleccionadas.length === 2) {
              setTimeout(() => {
                fetch("/api/verificar_memorama", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ sala: miSala }),
                })
                  .then((r) => r.json())
                  .then((est2) => {
                    procesando = false;
                    renderizarTablero(est2);
                  })
                  .catch(() => {
                    procesando = false;
                  });
              }, 700);
            } else {
              procesando = false;
            }
          })
          .catch(() => {
            procesando = false;
          });
      }

      function reiniciarJuego() {
        if (modoJuego === "solo") {
          iniciarModoSolo();
          return;
        }
        if (!miSala) return;

        fetch("/api/reiniciar_memorama", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sala: miSala }),
        }).then(() => {
          juegoActivo = true;
          procesando = false;
          if (intervalo) clearInterval(intervalo);
          intervalo = setInterval(obtenerEstado, 800);
          obtenerEstado();
        });
      }

      function guardarVictoria(ganador) {
        if (ganador === 0 || ganador !== miJugador) return;
        let nombre = "";
        try {
          nombre = localStorage.getItem("nombreUsuario") || "";
        } catch (e) {}
        if (!nombre) nombre = prompt("✨ Ingresa tu nombre para el récord:") || "";
        if (nombre && nombre.trim()) {
          fetch("/guardar_memorama_online", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: nombre.trim() }),
          }).catch(() => {});
        }
      }

      function salirJuego() {
        if (intervalo) {
          clearInterval(intervalo);
          intervalo = null;
        }
        juegoActivo = false;
        document.getElementById("pantalla-juego").style.display = "none";
        document.getElementById("pantalla-lobby").style.display = "block";
      }
    </script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
  </body>
</html>

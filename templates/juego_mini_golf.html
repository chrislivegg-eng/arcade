            const nombre = res.golpes === 1 ? "⛳ ¡HOYO EN UNO!" : dif <= -2 ? "🦅 ¡Águila!" : dif === -1 ? "🐦 ¡Birdie!" : dif === 0 ? "👍 Par" : dif === 1 ? "Bogey" : `+${dif}`;
            ui.avisar(
              `${nombre}<small>${golpes} golpe${golpes === 1 ? "" : "s"}${res.estrella ? " · ⭐ -1" : ""}${J.modo === "solo" ? "" : " · " + J.nombres[p]}</small>`,
              dif < 0 ? "#26de81" : dif === 0 ? "#4fb3ff" : "#ffb84f",
            );
            if (res.golpes === 1 || dif < 0) sonar("publico");
            if (res.golpes === 1 && soyYo(p) && J.modo !== "local") window.Perfil && Perfil.evento("mini_golf", "hoyo_en_uno");
            await esperar(1800);
          }
        }
        terminar();
      }

      async function jugarHoyo(p, h) {
        const s = hoyoActual.salida;
        ponerBola(s.x, s.z, p);
        reiniciarEstrella();
        if (J.modo !== "solo") ui.avisar(soyYo(p) && J.modo !== "local" ? "¡Tu turno!" : `Turno de ${J.nombres[p]}`, p ? "#4fb3ff" : "#ff4f8b");
        let estrella = false;
        const maximo = maxGolpes(h);
        for (let golpe = 1; golpe <= maximo; golpe++) {
          marcador(p, golpe);
          const clave = `${J.paso}-${h}-${p}-${golpe}`;
          let tiro,
            rival = null;
          if (soyYo(p)) {
            ui.ayuda("👆 Jala hacia atrás y suelta para pegarle");
            tiro = await new Promise((r) => (esperandoGolpe = r));
            ui.ayuda("");
          } else if (J.modo === "bot") {
            await esperar(900);
            tiro = golpeBot();
          } else {
            ui.ayuda(`${J.nombres[p]} está apuntando…`);
            rival = J.recibido[clave] || (await new Promise((r) => (J.esperando = { clave, r })));
            ui.ayuda("");
            tiro = rival.tiro;
          }
          if (!J.activa) return { golpes: 0, estrella: false };
          let fin = await simularGolpe(tiro);
          if (rival) fin = rival.fin;
          else if (J.modo === "online") ui.enviar("golpe", { partida: J.partida, clave, tiro, fin });
          if (fin.estrella && !estrella) {
            estrella = true;
            if (hoyoActual.estrella) hoyoActual.estrella.malla.visible = false;
            estrellaTomada = true;
          }
          if (fin.agua) ui.avisar(fin.lava ? "🔥 ¡A la lava!<small>+1 golpe</small>" : "💦 ¡Al agua!<small>+1 golpe</small>", fin.lava ? "#ff5a10" : "#2e8fe0");
          if (fin.enHoyo) {
            bola.visible = false;
            return { golpes: golpe, estrella };
          }
          // deja la bola exactamente donde quedó en el celular que tiró
          cuerpoBola.type = CANNON.Body.KINEMATIC;
          cuerpoBola.position.set(fin.x, RADIO_BOLA + 0.001, fin.z);
          cuerpoBola.velocity.setZero();
          bola.visible = true;
        }
        ui.avisar("😅 Máximo de golpes", "#888");
        return { golpes: maximo + 1, estrella: false };
      }

      function terminar() {
        J.activa = false;
        vistaMenu = true;
        const a = suma(J.golpes[0]),
          b = suma(J.golpes[1]);
        const par = J.ruta.reduce((s, h) => s + HOYOS[h].par, 0);
        if (J.modo === "solo") {
          sonar("ganar");
          const vsPar = a - par;
          let mejorAntes = null;
          try {
            mejorAntes = +localStorage.getItem("golf_mejor_" + J.rutaId) || null;
            if (!mejorAntes || a < mejorAntes) localStorage.setItem("golf_mejor_" + J.rutaId, a);
          } catch (e) {}
          const ruta = RUTAS.find((r) => r.id === J.rutaId);
          const notaMejor = mejorAntes && a >= mejorAntes ? ` · Tu mejor: ${mejorAntes}` : mejorAntes ? " · ¡Mejoraste tu marca!" : "";
          return ui.terminar({
            emoji: "⛳",
            texto: `${a} golpes`,
            nota: `${ruta.texto} · ` + (vsPar === 0 ? "¡Justo en par!" : vsPar < 0 ? `${vsPar} bajo par 🔥` : `+${vsPar} sobre par`) + notaMejor,
            record: J.rutaId === "pradera" ? a : null,
          });
        }
        const empate = a === b,
          gana0 = a < b;
        const gane = J.modo === "online" ? (ui.yo === 0 ? gana0 : !gana0 && !empate) : gana0;
        sonar(gane || J.modo === "local" ? "ganar" : "perder");
        ui.terminar({
          emoji: empate ? "🤝" : gane || J.modo === "local" ? "🏆" : "😿",
          texto: empate ? "¡Empate!" : J.modo === "local" ? `¡Ganó ${J.nombres[gana0 ? 0 : 1]}!` : gane ? "¡Ganaste!" : `Ganó ${J.nombres[gana0 ? 0 : 1]}`,
          nota: `${J.nombres[0]} ${a} golpes · ${J.nombres[1]} ${b} golpes`,
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Zombis · Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='juegos3d.css') }}"
    />
    <style>
      #estado-jugador {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 5;
        pointer-events: none;
      }
      .barra-vida {
        flex: 1;
        height: 16px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .barra-vida div {
        height: 100%;
        background: linear-gradient(90deg, #ff3b3b, #26de81);
        transition: width 0.2s;
      }
      #balas {
        font-weight: 900;
        font-size: 1.2rem;
        background: rgba(20, 12, 24, 0.72);
        border-radius: 12px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      #mira-zombi {
        position: fixed;
        width: 38px;
        height: 38px;
        margin: -19px 0 0 -19px;
        border: 2px solid rgba(255, 80, 80, 0.9);
        border-radius: 50%;
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #mira-zombi.ver {
        opacity: 1;
        transition: none;
      }
      #danio {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        box-shadow: inset 0 0 120px rgba(255, 0, 0, 0);
        transition: box-shadow 0.3s;
      }
      #danio.pegado {
        box-shadow: inset 0 0 140px rgba(255, 0, 0, 0.7);
        transition: none;
      }
      #estado-jugador {
        flex-wrap: wrap;
        background: #080e19bb;
        padding: 12px;
        border: 1px solid #54736b;
        border-radius: 12px;
      }
      #estado-jugador button {
        pointer-events: auto;
        background: #273f38;
        color: white;
        border: 1px solid #7eac93;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      #premio-z {
        width: 100%;
        color: #b9f6ca;
        min-height: 1em;
      }
      #monedas-z {
        color: #f6d88e;
      }
      #armeria-z {
        color: #e8f6ee;
        background: #0e191f;
        border: 1px solid #73a58b;
        border-radius: 20px;
        padding: 26px;
        width: min(480px, 85vw);
        max-height: 85dvh;
        overflow: auto;
        font-family: Nunito, sans-serif;
      }
      #armeria-z::backdrop {
        background: #000b;
        backdrop-filter: blur(8px);
      }
      #armeria-z h2 {
        letter-spacing: 0.15em;
      }
      #armeria-z button {
        display: block;
        width: 100%;
        padding: 14px;
        margin: 8px 0;
        background: #294a3d;
        color: #fff;
        border: 1px solid #659d7c;
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
      }
      #armeria-z button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #armeria-z a {
        display: block;
        color: #c2d4d9;
        text-align: center;
        margin-top: 20px;
      }
      #mensaje-z {
        min-height: 3em;
        color: #d5cba9;
      }
      #saldo-z {
        color: #e9ce8f;
      }
      @media (max-width: 500px) {
        #estado-jugador {
          gap: 6px;
          padding: 8px;
        }
        #balas {
          font-size: 1rem;
        }
        .barra-vida {
          min-width: 70px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="danio"></div>
    <div id="mira-zombi"></div>
    <div id="estado-jugador" class="oculto">
      <span>❤️</span><span id="monedas-z">🪙 —</span>
      <div class="barra-vida"><div id="vida" style="width: 100%"></div></div>
      <div id="balas">🔫 8/8</div>
      <button id="recarga-z">Recargar R</button><button id="pausa-z">Ⅱ</button
      ><small id="premio-z"></small>
    </div>

    <dialog id="armeria-z">
      <h2>ÚLTIMA GUARDIA</h2>
      <p id="saldo-z">Conectando armería…</p>
      <div id="mejoras-z"></div>
      <p id="mensaje-z" role="status"></p>
      <button id="continuar-z">Comenzar oleada</button
      ><a href="/secreto">Volver al arcade</a>
    </dialog>
    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/graficos3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/zombis.js') }}"></script>
  </body>
</html>

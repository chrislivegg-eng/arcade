<!doctype html>
<html lang="es">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <meta charset="UTF-8" />
    <title>Rally Kawaii Turbo 3D 🏎️</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at 50% 15%, #3b0d2c 0%, #150618 65%, #07020a 100%);
        margin: 0;
        padding: 14px;
        text-align: center;
        color: #f8fafc;
        user-select: none;
      }

      #game-container {
        display: inline-block;
        background: linear-gradient(155deg, rgba(45, 18, 52, 0.94), rgba(18, 8, 26, 0.96));
        padding: 18px;
        border-radius: 30px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        border: 2px solid rgba(244, 63, 94, 0.45);
        position: relative;
        max-width: 100%;
      }

      canvas {
        background: #1e293b;
        border: 3px solid #f43f5e;
        border-radius: 18px;
        max-width: 100%;
        height: auto;
        touch-action: none;
      }

      .hud {
        display: flex;
        justify-content: space-around;
        width: min(360px, 100%);
        margin: 0 auto 10px auto;
        font-size: 1.15em;
        font-weight: 900;
        color: #fde047;
        background: rgba(15, 23, 42, 0.8);
        padding: 8px 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .btn-juego {
        background: linear-gradient(135deg, #f43f5e, #e11d48);
        color: white;
        border: none;
        padding: 11px 26px;
        font-size: 1.05em;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 900;
        margin: 6px;
        box-shadow: 0 6px 18px rgba(244, 63, 94, 0.4);
        text-decoration: none;
        display: inline-block;
        transition: 0.2s;
      }
      .btn-juego:hover {
        transform: translateY(-2px);
      }

      #overlay {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.96);
        color: #fff;
        padding: 30px 24px;
        border-radius: 26px;
        width: 86%;
        border: 2px solid #f43f5e;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div id="game-container">
      <h1 style="margin: 0 0 8px; color: #fb7185; font-size: 1.85rem">
        🏎️ Rally Turbo 3D 🚙
      </h1>

      <div class="hud">
        <div>Distancia: <span id="score">0</span>m</div>
        <div>Nivel: <span id="nivel">1</span></div>
        <div>Escudo: <span id="escudo-rally">OFF</span></div>
      </div>

      <canvas id="gameCanvas" width="360" height="500"></canvas>
      <div class="controles-movil" style="display:flex; justify-content:center; gap:18px; margin-top:8px;">
        <button
          type="button"
          class="btn-juego"
          style="padding:10px 26px; margin:0"
          onpointerdown="cambiarCarril(-1)"
        >
          ⬅️ Izquierda
        </button>
        <button
          type="button"
          class="btn-juego"
          style="padding:10px 26px; margin:0"
          onpointerdown="cambiarCarril(1)"
        >
          Derecha ➡️
        </button>
      </div>
      <div style="margin-top: 8px">
        <button class="btn-juego" onclick="iniciarJuego()">
          ▶️ Iniciar Carrera
        </button>
        <a
          href="/secreto"
          class="btn-juego"
          style="background: rgba(255,255,255,0.12); border: 1px solid #fb7185"
          >🏠 Menú</a
        >
      </div>

      <div id="overlay">
        <h2 style="color: #fb7185; font-size: 2.2em; margin: 0">¡Crash! 💥</h2>
        <p style="font-size: 1.25em; color: #cbd5e1">
          Llegaste al <b>Nivel <span id="final-nivel"></span></b> con
          <b id="final-score" style="color:#fde047"></b> metros.
        </p>
        <button class="btn-juego" onclick="guardar()">💾 Guardar Récord</button>
        <button
          class="btn-juego"
          onclick="iniciarJuego()"
          style="background: #475569"
        >
          🔄 Reintentar
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // Definir teclas para compatibilidad total con cualquier handler móvil
      const teclas = { Izq: false, Der: false };
      const carriles = [52, 160, 268]; // Centros de los 3 carriles de asfalto
      let carrilActual = 1;
      let xVisual = carriles[1];

      let jugadorY = 405;
      let obstaculos = [];
      let score = 0;
      let nivel = 1;
      let escudo = false;
      let turboFrames = 0;
      let gameActivo = false;
      let frameId;
      let velocidad = 5.5;
      let offsetPista = 0;
      let timerObstaculos;

      function cambiarCarril(dir) {
        if (!gameActivo) {
          iniciarJuego();
          return;
        }
        carrilActual = Math.max(0, Math.min(2, carrilActual + dir));
      }

      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        cambiarCarril(x < rect.width / 2 ? -1 : 1);
      });

      function iniciarJuego() {
        if (timerObstaculos) clearTimeout(timerObstaculos);
        if (frameId) cancelAnimationFrame(frameId);
        obstaculos = [];
        score = 0;
        nivel = 1;
        velocidad = 5.5;
        carrilActual = 1;
        xVisual = carriles[1];
        escudo = false;
        turboFrames = 0;
        offsetPista = 0;

        document.getElementById("score").innerText = score;
        document.getElementById("nivel").innerText = nivel;
        document.getElementById("escudo-rally").innerText = "OFF";
        document.getElementById("overlay").style.display = "none";
        gameActivo = true;

        programarObstaculo();
        frameId = requestAnimationFrame(gameLoop);
      }

      function programarObstaculo() {
        if (!gameActivo) return;
        crearObstaculo();
        let tiempoSpawn = Math.max(360, 1080 - nivel * 85);
        timerObstaculos = setTimeout(programarObstaculo, tiempoSpawn);
      }

      function crearObstaculo() {
        const cIdx = Math.floor(Math.random() * 3);
        const rnd = Math.random();
        let tipo = "barrera";
        let emoji = "🚧";
        if (rnd < 0.25) {
          tipo = "bomba";
          emoji = "💣";
        } else if (rnd < 0.45) {
          tipo = "auto";
          emoji = "🚓";
        } else if (rnd < 0.62) {
          tipo = "turbo";
          emoji = "⚡";
        } else if (rnd < 0.7 && !escudo) {
          tipo = "escudo";
          emoji = "🛡️";
        }
        obstaculos.push({
          x: carriles[cIdx],
          y: -50,
          tipo,
          emoji,
        });
      }

      function dibujarAuto3D(cx, cy, colorPpal, esJugador) {
        // Sombra proyectada
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.beginPath();
        ctx.roundRect(cx - 20, cy + 4, 44, 68, 12);
        ctx.fill();

        // Ruedas
        ctx.fillStyle = "#0f172a";
        for (const [wx, wy] of [
          [-23, 10],
          [17, 10],
          [-23, 46],
          [17, 46],
        ]) {
          ctx.fillRect(cx + wx, cy + wy, 6, 15);
        }

        // Chasis 3D con gradiente metálico
        const g = ctx.createLinearGradient(cx - 20, cy, cx + 20, cy + 66);
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.2, colorPpal);
        g.addColorStop(1, "#881337");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(cx - 20, cy, 40, 66, 11);
        ctx.fill();

        // Parabrisas y techo
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.roundRect(cx - 14, cy + 14, 28, 32, 7);
        ctx.fill();

        if (esJugador) {
          // Faros delanteros luminosos
          ctx.fillStyle = "rgba(254, 240, 138, 0.28)";
          ctx.beginPath();
          ctx.moveTo(cx - 14, cy);
          ctx.lineTo(cx - 28, cy - 55);
          ctx.lineTo(cx + 28, cy - 55);
          ctx.lineTo(cx + 14, cy);
          ctx.closePath();
          ctx.fill();

          if (turboFrames > 0) {
            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(cx - 9, cy + 66);
            ctx.lineTo(cx, cy + 88 + Math.random() * 12);
            ctx.lineTo(cx + 9, cy + 66);
            ctx.fill();
          }
          if (escudo) {
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy + 33, 42, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function gameLoop() {
        if (!gameActivo) return;

        if (teclas.Izq) {
          cambiarCarril(-1);
          teclas.Izq = false;
        }
        if (teclas.Der) {
          cambiarCarril(1);
          teclas.Der = false;
        }

        const velActual = velocidad + (turboFrames > 0 ? 4 : 0);
        if (turboFrames > 0) turboFrames--;

        score += turboFrames > 0 ? 2 : 1;
        document.getElementById("score").innerText = score;

        if (score % 400 === 0) {
          nivel += 1;
          velocidad = Math.min(13, velocidad + 1.1);
          document.getElementById("nivel").innerText = nivel;
        }

        offsetPista = (offsetPista + velActual) % 48;
        xVisual += (carriles[carrilActual] - xVisual) * 0.24;

        // 1. Césped lateral y bordes de pista (pianos rojo/blanco)
        ctx.fillStyle = "#14532d";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#334155";
        ctx.fillRect(20, 0, 320, canvas.height);

        for (let y = -48; y < canvas.height + 48; y += 48) {
          const py = y + offsetPista;
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(14, py, 8, 24);
          ctx.fillRect(338, py, 8, 24);
          ctx.fillStyle = "#f8fafc";
          ctx.fillRect(14, py + 24, 8, 24);
          ctx.fillRect(338, py + 24, 8, 24);

          // Líneas divisoras de carril
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.fillRect(124, py, 5, 26);
          ctx.fillRect(232, py, 5, 26);
        }

        // 2. Obstáculos y Power-ups
        for (let i = obstaculos.length - 1; i >= 0; i--) {
          let obs = obstaculos[i];
          obs.y += velActual;

          ctx.font = "34px Arial";
          ctx.textAlign = "center";
          ctx.fillText(obs.emoji, obs.x, obs.y + 30);

          const dx = Math.abs(obs.x - xVisual);
          const dy = Math.abs(obs.y + 16 - (jugadorY + 32));
          if (dx < 32 && dy < 38) {
            if (obs.tipo === "turbo") {
              score += 50;
              turboFrames = 90;
              obstaculos.splice(i, 1);
              continue;
            } else if (obs.tipo === "escudo") {
              escudo = true;
              document.getElementById("escudo-rally").innerText = "ACTIVO 🛡️";
              obstaculos.splice(i, 1);
              continue;
            } else if (escudo) {
              escudo = false;
              document.getElementById("escudo-rally").innerText = "OFF";
              obstaculos.splice(i, 1);
              continue;
            } else {
              terminarJuego();
              return;
            }
          }

          if (obs.y > canvas.height + 40) {
            obstaculos.splice(i, 1);
          }
        }

        // 3. Dibujar Auto del Jugador en 3D
        dibujarAuto3D(xVisual, jugadorY, "#f43f5e", true);

        frameId = requestAnimationFrame(gameLoop);
      }

      function terminarJuego() {
        gameActivo = false;
        clearTimeout(timerObstaculos);
        cancelAnimationFrame(frameId);
        document.getElementById("final-score").innerText = score;
        document.getElementById("final-nivel").innerText = nivel;
        document.getElementById("overlay").style.display = "block";
      }

      document.addEventListener("keydown", (e) => {
        if (!gameActivo) return;
        if (e.key === "ArrowLeft" || e.key === "a") {
          cambiarCarril(-1);
          e.preventDefault();
        }
        if (e.key === "ArrowRight" || e.key === "d") {
          cambiarCarril(1);
          e.preventDefault();
        }
      });

      function guardar() {
        let nombre =
          localStorage.getItem("nombreUsuario") ||
          prompt(`Llegaste al Nivel ${nivel}. Ingresa tu nombre de piloto:`);
        if (nombre) {
          localStorage.setItem("nombreUsuario", nombre);
          fetch("/guardar_rally", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: nombre, puntos: score }),
          }).then(() => (window.location.href = "/secreto"));
        }
      }

      function alGanarJuego(misPuntos) {
        enviarPuntaje("/guardar_tu_juego", { puntos: misPuntos });
      }
    </script>
  </body>
</html>

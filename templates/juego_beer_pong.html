<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#160f1c" />
    <title>Vaso Pong 3D · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cannon.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, azar, limitar, gauss, lin, material, sonar } = Arcade;

      const MESA = { largo: 2.44, ancho: 0.61, alto: 0.76 };
      const VASO = { arriba: 0.046, abajo: 0.032, alto: 0.12, liquido: 0.085 };
      const RADIO_PELOTA = 0.02;
      const COLORES = [0xff4f8b, 0x4fb3ff];
      const ALTURA_ARCO = 0.6; // tiro bombeado: entra casi de arriba y no pega en los vasos de enfrente

      // Vasos de cada jugador: el 0 tiene los suyos del lado +z, el 1 del lado -z
      function posicionesVasos(jugador) {
        const lado = jugador === 0 ? 1 : -1;
        const sep = 0.093,
          fila = sep * 0.866;
        const pos = [];
        [1, 2, 3].forEach((n, f) => {
          for (let k = 0; k < n; k++) pos.push([(k - (n - 1) / 2) * sep, lado * (MESA.largo / 2 - 0.26 + f * fila)]);
        });
        return pos;
      }

      // =========================================================
      //  ESCENA
      // =========================================================
      const M = Arcade.mundo({ fondo: 0x160f1c, niebla: [6, 16], fov: 55, exposicion: 1.1 });
      const { escena, camara } = M;

      const piso = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 14),
        material(0xffffff, { map: M.textura(1024, 1024, (g, w, h) => Arcade.dibujarMadera(g, w, h, { tono: 25, sat: 35, luz: 28, tablas: 10 })), roughness: 0.6 }),
      );
      piso.rotation.x = -Math.PI / 2;
      piso.receiveShadow = true;
      escena.add(piso);

      // Mesa con diseño
      const texturaMesa = M.textura(512, 2048, (g, w, h) => {
        const gr = g.createLinearGradient(0, 0, 0, h);
        gr.addColorStop(0, "#2b1d63");
        gr.addColorStop(0.5, "#5b2a86");
        gr.addColorStop(1, "#2b1d63");
        g.fillStyle = gr;
        g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(255,255,255,0.85)";
        g.lineWidth = 8;
        g.strokeRect(10, 10, w - 20, h - 20);
        g.beginPath();
        g.moveTo(0, h / 2);
        g.lineTo(w, h / 2);
        g.stroke();
        g.font = "900 120px Nunito, Arial Black, sans-serif";
        g.textAlign = "center";
        g.fillStyle = "rgba(255,255,255,0.18)";
        g.save();
        g.translate(w / 2, h / 2);
        g.rotate(-Math.PI / 2);
        g.fillText("VASO PONG", 0, 40);
        g.restore();
      });
      const mesa = new THREE.Mesh(
        new THREE.BoxGeometry(MESA.ancho, 0.04, MESA.largo),
        [
          material(0x1a1230),
          material(0x1a1230),
          material(0xffffff, { map: texturaMesa, roughness: 0.25 }),
          material(0x1a1230),
          material(0x1a1230),
          material(0x1a1230),
        ],
      );
      mesa.position.y = MESA.alto - 0.02;
      mesa.receiveShadow = true;
      mesa.castShadow = true;
      escena.add(mesa);
      [
        [-1, -1],
        [1, -1],
        [-1, 1],
        [1, 1],
      ].forEach(([x, z]) => {
        const pata = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, MESA.alto - 0.04, 10), material(0x888888, { metalness: 0.8, roughness: 0.3 }));
        pata.position.set(x * (MESA.ancho / 2 - 0.05), (MESA.alto - 0.04) / 2, z * (MESA.largo / 2 - 0.08));
        escena.add(pata);
      });

      // Ambiente: luces de fiesta
      escena.add(new THREE.HemisphereLight(0xffe8f4, 0x221430, 0.5));
      const foco = new THREE.SpotLight(0xffffff, 2.2, 0, 0.7, 0.5, 1);
      foco.position.set(0.4, 3.4, 0.3);
      foco.target.position.set(0, MESA.alto, 0);
      foco.castShadow = true;
      foco.shadow.mapSize.set(1024, 1024);
      foco.shadow.bias = -0.0004;
      escena.add(foco, foco.target);
      const luces = [0xff4f8b, 0x4fb3ff, 0xffd84f, 0x26de81].map((c, i) => {
        const l = new THREE.PointLight(c, 0.6, 5);
        l.position.set(Math.cos(i * 1.57) * 2.5, 2.2, Math.sin(i * 1.57) * 2.5);
        escena.add(l);
        const foquito = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: c }));
        foquito.position.copy(l.position);
        escena.add(foquito);
        return l;
      });

      // =========================================================
      //  FÍSICA
      // =========================================================
      const mundoFisico = new CANNON.World();
      mundoFisico.gravity.set(0, -9.82, 0);
      mundoFisico.solver.iterations = 10;
      const mPelota = new CANNON.Material("pelota"),
        mMesa = new CANNON.Material("mesa"),
        mVaso = new CANNON.Material("vaso");
      mundoFisico.addContactMaterial(new CANNON.ContactMaterial(mPelota, mMesa, { restitution: 0.78, friction: 0.2 }));
      mundoFisico.addContactMaterial(new CANNON.ContactMaterial(mPelota, mVaso, { restitution: 0.5, friction: 0.1 }));

      const cuerpoMesa = new CANNON.Body({ mass: 0, material: mMesa });
      cuerpoMesa.addShape(new CANNON.Box(new CANNON.Vec3(MESA.ancho / 2, 0.02, MESA.largo / 2)));
      cuerpoMesa.position.set(0, MESA.alto - 0.02, 0);
      mundoFisico.addBody(cuerpoMesa);
      const cuerpoPiso = new CANNON.Body({ mass: 0, material: mMesa });
      cuerpoPiso.addShape(new CANNON.Plane());
      cuerpoPiso.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      mundoFisico.addBody(cuerpoPiso);

      // Vasos
      const matVasoFuera = material(0xd81e2c, { roughness: 0.35 });
      const matVasoDentro = material(0xf5f5f5, { roughness: 0.5, side: THREE.BackSide });
      const matRefresco = material(0x3b1a0a, { roughness: 0.1, metalness: 0.2 });
      const geoVaso = new THREE.CylinderGeometry(VASO.arriba, VASO.abajo, VASO.alto, 28, 1, true);
      const geoBorde = new THREE.TorusGeometry(VASO.arriba, 0.003, 6, 28);
      const radioLiquido = VASO.abajo + (VASO.arriba - VASO.abajo) * (VASO.liquido / VASO.alto);
      const geoLiquido = new THREE.CircleGeometry(radioLiquido - 0.002, 24);

      const vasos = [[], []]; // { grupo, cuerpo, x, z, vivo }
      function crearVasos() {
        vasos.forEach((lista) => lista.forEach((v) => (escena.remove(v.grupo), mundoFisico.removeBody(v.cuerpo))));
        [0, 1].forEach((j) => {
          vasos[j] = posicionesVasos(j).map(([x, z]) => {
            const grupo = new THREE.Group();
            const fuera = new THREE.Mesh(geoVaso, matVasoFuera);
            fuera.castShadow = true;
            const dentro = new THREE.Mesh(geoVaso, matVasoDentro);
            const borde = new THREE.Mesh(geoBorde, material(0xffffff, { roughness: 0.4 }));
            borde.rotation.x = Math.PI / 2;
            borde.position.y = VASO.alto / 2;
            const liquido = new THREE.Mesh(geoLiquido, matRefresco);
            liquido.rotation.x = -Math.PI / 2;
            liquido.position.y = VASO.liquido - VASO.alto / 2;
            grupo.add(fuera, dentro, borde, liquido);
            grupo.position.set(x, MESA.alto + VASO.alto / 2, z);
            escena.add(grupo);
            // física: cuerpo sólido hasta el nivel del refresco + borde de bolitas
            const cuerpo = new CANNON.Body({ mass: 0, material: mVaso });
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            cuerpo.addShape(new CANNON.Cylinder(radioLiquido, VASO.abajo, VASO.liquido, 16), new CANNON.Vec3(0, VASO.liquido / 2 - VASO.alto / 2, 0), q);
            for (let i = 0; i < 14; i++) {
              const a = (i / 14) * Math.PI * 2;
              cuerpo.addShape(new CANNON.Sphere(0.004), new CANNON.Vec3(Math.cos(a) * VASO.arriba, VASO.alto / 2, Math.sin(a) * VASO.arriba));
            }
            cuerpo.position.set(x, MESA.alto + VASO.alto / 2, z);
            mundoFisico.addBody(cuerpo);
            return { grupo, cuerpo, x, z, vivo: true };
          });
        });
      }
      crearVasos();

      async function quitarVaso(v) {
        v.vivo = false;
        mundoFisico.removeBody(v.cuerpo);
        sonar("agua");
        const y0 = v.grupo.position.y;
        await M.animar(700, (t) => {
          v.grupo.position.y = y0 + Math.sin(t * Math.PI) * 0.15;
          v.grupo.rotation.z = t * 1.5;
          v.grupo.position.x = v.x + t * 0.6 * Math.sign(v.x || 1);
          v.grupo.scale.setScalar(1 - t);
        });
        escena.remove(v.grupo);
      }

      // Pelota
      const pelota = new THREE.Mesh(new THREE.SphereGeometry(RADIO_PELOTA, 20, 16), material(0xfffaf0, { roughness: 0.3 }));
      pelota.castShadow = true;
      escena.add(pelota);
      const cuerpoPelota = new CANNON.Body({ mass: 0.0027, material: mPelota, shape: new CANNON.Sphere(RADIO_PELOTA), linearDamping: 0 }) // sin freno: cae donde marca la guía;
      mundoFisico.addBody(cuerpoPelota);
      let ultimoRebote = 0;
      cuerpoPelota.addEventListener("collide", (e) => {
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        if (v > 0.4 && performance.now() - ultimoRebote > 50) {
          ultimoRebote = performance.now();
          sonar(e.body.material === mVaso ? "ping" : "rebote", Math.min(1, v / 4) * 0.5);
        }
      });

      function puntoDeTiro(jugador) {
        const lado = jugador === 0 ? 1 : -1;
        return new CANNON.Vec3(0, MESA.alto + 0.38, lado * (MESA.largo / 2 + 0.25));
      }
      function pelotaEnMano(jugador) {
        const p = puntoDeTiro(jugador);
        cuerpoPelota.type = CANNON.Body.KINEMATIC;
        cuerpoPelota.position.copy(p);
        cuerpoPelota.velocity.setZero();
        cuerpoPelota.angularVelocity.setZero();
        pelota.visible = true;
      }

      // Velocidad para que la pelota caiga en (tx, tz) con un arco bonito
      function velocidadHacia(desde, tx, tz) {
        const g = 9.82;
        const vy = Math.sqrt(2 * g * ALTURA_ARCO);
        const caida = desde.y + ALTURA_ARCO - (MESA.alto + VASO.alto + 0.01); // pasa por el centro de la boca del vaso
        const T = vy / g + Math.sqrt((2 * caida) / g);
        return new CANNON.Vec3((tx - desde.x) / T, vy, (tz - desde.z) / T);
      }

      // =========================================================
      //  SIMULAR TIRO → índice del vaso donde cayó (o -1)
      // =========================================================
      let simulando = false;
      M.alCuadro((dt, ahora) => {
        mundoFisico.step(1 / 120, dt, 10);
        pelota.position.copy(cuerpoPelota.position);
        if (cuerpoPelota.type === CANNON.Body.KINEMATIC) pelota.position.y += Math.sin(ahora / 300) * 0.01;
        luces.forEach((l, i) => (l.intensity = 0.45 + Math.sin(ahora / 400 + i * 1.6) * 0.25));
        moverCamara(ahora);
      });

      async function simular(jugador, objetivo) {
        const objetivoJugador = 1 - jugador;
        const desde = puntoDeTiro(jugador);
        cuerpoPelota.type = CANNON.Body.DYNAMIC;
        cuerpoPelota.position.copy(desde);
        cuerpoPelota.velocity.copy(velocidadHacia(desde, objetivo.x, objetivo.z));
        sonar("swoosh", 0.4);
        simulando = true;
        const inicio = performance.now();
        // se revisa en cada paso de la física (no por tiempo), así no se "salta" el vaso en celulares lentos
        let tiempoSim = 0;
        const resultado = await new Promise((r) => {
          const revisar = () => {
            tiempoSim += 1 / 120;
            const p = cuerpoPelota.position;
            for (const [k, v] of vasos[objetivoJugador].entries()) {
              if (!v.vivo) continue;
              if (Math.hypot(p.x - v.x, p.z - v.z) < VASO.arriba - RADIO_PELOTA * 0.4 && p.y < MESA.alto + VASO.alto && p.y > MESA.alto) {
                return terminar(k);
              }
            }
            if (p.y < MESA.alto - 0.1 || tiempoSim > 3.5 || performance.now() - inicio > 9000 || Math.abs(p.z) > MESA.largo / 2 + 0.8) terminar(-1);
          };
          const terminar = (k) => {
            mundoFisico.removeEventListener("postStep", revisar);
            if (k >= 0) {
              // se queda flotando en el refresco
              cuerpoPelota.velocity.setZero();
              cuerpoPelota.type = CANNON.Body.KINEMATIC;
            }
            r(k);
          };
          mundoFisico.addEventListener("postStep", revisar);
        });
        simulando = false;
        return resultado;
      }

      // =========================================================
      //  CÁMARA
      // =========================================================
      let lado = 1; // desde qué lado se ve (1 = jugador 0)
      let vistaMenu = true;
      function moverCamara(ahora) {
        const aspecto = window.innerWidth / window.innerHeight;
        camara.fov = aspecto < 1 ? 64 : 48;
        let pos, mira;
        if (vistaMenu) {
          const t = ahora / 1000;
          pos = new THREE.Vector3(Math.sin(t * 0.2) * 2.2, 1.7, Math.cos(t * 0.2) * 2.2);
          mira = new THREE.Vector3(0, MESA.alto, 0);
        } else {
          // desde arriba de mis vasos, mirando a los del rival (se ve todo el arco del tiro)
          pos = new THREE.Vector3(0, MESA.alto + (aspecto < 1 ? 0.95 : 0.75), lado * (aspecto < 1 ? 0.45 : 0.7));
          mira = new THREE.Vector3(0, MESA.alto + 0.05, -lado * (MESA.largo / 2 - 0.3));
        }
        camara.position.lerp(pos, 0.08);
        camara.lookAt(mira);
        camara.updateProjectionMatrix();
      }

      // =========================================================
      //  CONTROLES
      // =========================================================
      // Como resortera: jalas hacia abajo (más jalón = más lejos) y al lado contrario
      // de a donde quieres tirar. Mientras jalas se ve la trayectoria y dónde cae.
      let esperandoTiro = null;
      let jugadorApuntando = 0;
      const ZONA_VERDE = VASO.arriba * 0.65; // el aro se pone verde solo si apuntas bien adentro del vaso

      const guia = new THREE.Group();
      const PUNTOS_GUIA = 26;
      const bolitasGuia = [];
      for (let i = 0; i < PUNTOS_GUIA; i++) {
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
        guia.add(b);
        bolitasGuia.push(b);
      }
      const aroGuia = new THREE.Mesh(new THREE.RingGeometry(0.03, 0.055, 32), new THREE.MeshBasicMaterial({ color: 0xffd84f, side: THREE.DoubleSide }));
      aroGuia.rotation.x = -Math.PI / 2;
      guia.add(aroGuia);
      guia.visible = false;
      escena.add(guia);

      // jalón en pantalla → punto de la mesa (x en "derecha de la pantalla", z real)
      function objetivoDesdeJalon(dx, dy) {
        const H = window.innerHeight,
          W = window.innerWidth;
        const jalon = limitar(dy / (H * 0.32), 0, 1.25);
        const recorrido = 1.4 + jalon * 1.2; // metros desde mi orilla; los vasos rivales quedan a ~2.2 m
        return { x: limitar(-dx / (W * 0.5), -1, 1) * 0.32, z: J.lado * (MESA.largo / 2 - recorrido), jalon };
      }
      function mostrarGuia(obj) {
        const desde = puntoDeTiro(jugadorApuntando);
        const x = obj.x * J.lado;
        const v = velocidadHacia(desde, x, obj.z);
        const T = (obj.z - desde.z) / v.z;
        bolitasGuia.forEach((b, i) => {
          const t = (T * (i + 1)) / (PUNTOS_GUIA + 1);
          b.position.set(desde.x + v.x * t, desde.y + v.y * t - 4.91 * t * t, desde.z + v.z * t);
        });
        aroGuia.position.set(x, MESA.alto + 0.002, obj.z);
        // ¿cae dentro de un vaso? el aro se pone verde
        const dentro = vasos[1 - jugadorApuntando].some((c) => c.vivo && Math.hypot(c.x - x, c.z - obj.z) < ZONA_VERDE);
        aroGuia.material.color.setHex(dentro ? 0x26de81 : 0xffd84f);
        if (dentro) aroGuia.position.y = MESA.alto + VASO.alto + 0.003;
        guia.visible = obj.jalon > 0.08;
      }

      Arcade.deslizar(M.lienzo, {
        puede: () => !!esperandoTiro,
        mover: (p, puntos) => mostrarGuia(objetivoDesdeJalon(p.x - puntos[0].x, p.y - puntos[0].y)),
        cancelar: () => (guia.visible = false),
        soltar: (g) => {
          guia.visible = false;
          if (!esperandoTiro) return;
          const obj = objetivoDesdeJalon(g.dx, g.dy);
          if (obj.jalon < 0.08) return ui.avisar("👇 Jala hacia abajo y suelta", "#ffb84f");
          const r = esperandoTiro;
          esperandoTiro = null;
          // si el aro estaba verde, el tiro se jala hacia el centro de ese vaso (ayuda de puntería)
          let x = obj.x * J.lado,
            z = obj.z;
          const vaso = vasos[1 - jugadorApuntando].find((c) => c.vivo && Math.hypot(c.x - x, c.z - z) < ZONA_VERDE);
          if (vaso) {
            x = vaso.x + (x - vaso.x) * 0.3;
            z = vaso.z + (z - vaso.z) * 0.3;
          }
          // un poquito de pulso para que no sea perfecto siempre
          r({ x: +((x + gauss() * 0.006) * J.lado).toFixed(4), z: +(z + gauss() * 0.007).toFixed(4) });
        },
      });

      const ERROR_BOT = { facil: 0.075, normal: 0.045, pro: 0.026 };
      function tiroBot(jugador) {
        const vivos = vasos[1 - jugador].filter((v) => v.vivo);
        const v = vivos[(Math.random() * vivos.length) | 0];
        const e = ERROR_BOT[J.dificultad];
        return { x: v.x + gauss() * e, z: v.z + gauss() * e * 1.3 };
      }

      // =========================================================
      //  PARTIDA
      // =========================================================
      const J = { modo: null, nombres: [], turno: 0, activa: false, dificultad: "normal", recibido: {}, lado: 1, tiroN: 0 };

      const ui = Arcade.ui({
        juego: "beer_pong",
        titulo: "Vaso Pong 3D",
        emoji: "🥤",
        subtitulo: "Mete la pelotita en los vasos de refresco",
        modos: ["bot", "online", "local"],
        dificultad: true,
        records: true,
        unidadRecord: "vasos de sobra",
        reglas: [
          "Pon el dedo en la pantalla y jala hacia abajo, como resortera. Entre más jales, más lejos va.",
          "Jala hacia un lado para tirar hacia el otro. Verás la trayectoria: si el aro se pone 🟢 verde, va directo a un vaso.",
          "Tienes 2 tiros por turno. Si la metes, ese vaso se va.",
          "Gana quien elimine primero los 6 vasos del otro 🥤",
        ],
        alEmpezar: empezar,
        alSalir: () => {
          J.activa = false;
          vistaMenu = true;
          esperandoTiro = null;
        },
      });
      ui.alEvento = (tipo, datos) => {
        if (tipo !== "tiro" || !datos || datos.partida !== J.partida) return;
        J.recibido[datos.n] = datos;
        if (J.esperando && J.esperando.n === datos.n) {
          const r = J.esperando.r;
          J.esperando = null;
          r(datos);
        }
      };

      function soyYo(i) {
        if (J.modo === "online") return i === ui.yo;
        if (J.modo === "bot") return i === 0;
        return true;
      }
      function quedan(j) {
        return vasos[j].filter((v) => v.vivo).length;
      }
      function marcador(tiroEnTurno) {
        ui.marcador(
          [0, 1].map((i) => ({
            nombre: J.nombres[i],
            valor: `${quedan(i)} 🥤`,
            detalle: J.turno === i ? `Tiro ${tiroEnTurno + 1} de 2` : "",
            activo: J.turno === i,
          })),
        );
      }

      function empezar(modo, info) {
        J.modo = modo;
        J.nombres = info.nombres;
        J.dificultad = info.dificultad;
        J.partida = info.partida;
        J.recibido = {};
        J.tiroN = 0;
        J.activa = true;
        J.turno = modo === "bot" ? 0 : Arcade.rng(info.semilla)() < 0.5 ? 0 : 1;
        crearVasos();
        vistaMenu = false;
        jugar(info.partida);
      }

      async function jugar(partida) {
        while (J.activa && partida === J.partida) {
          const t = J.turno;
          // la cámara: desde mi lado (online/bot) o del que tira (local)
          J.lado = (J.modo === "local" ? t : J.modo === "online" ? ui.yo : 0) === 0 ? 1 : -1;
          lado = J.lado;
          if (J.modo === "local") ui.avisar(`Tira ${J.nombres[t]}`, t ? "#4fb3ff" : "#ff4f8b");
          else ui.avisar(soyYo(t) ? "¡Tu turno!" : `Turno de ${J.nombres[t]}`, t ? "#4fb3ff" : "#ff4f8b");
          let atinados = 0;
          for (let k = 0; k < 2; k++) {
            marcador(k);
            const r = await unTiro(t);
            if (!J.activa || partida !== J.partida) return;
            if (r >= 0) {
              atinados++;
              const v = vasos[1 - t][r];
              ui.avisar(quedan(1 - t) === 1 ? "🥤 ¡ÚLTIMO VASO!" : "🥤 ¡ADENTRO!", "#26de81");
              await quitarVaso(v);
              marcador(k);
              if (quedan(1 - t) === 0) return terminar(t);
            } else ui.avisar("💨 Fallaste", "#888");
            await esperar(900);
          }
          if (atinados === 2) {
            ui.avisar("🔥 ¡Dos de dos!<small>tiras otra vez</small>", "#ff7a59");
            await esperar(1200);
          } else J.turno = 1 - t;
        }
      }

      async function unTiro(jugador) {
        pelotaEnMano(jugador);
        const n = J.tiroN++;
        let objetivo, rival = null;
        if (soyYo(jugador)) {
          ui.ayuda("👇 Jala hacia abajo, apunta y suelta");
          jugadorApuntando = jugador;
          objetivo = await new Promise((r) => (esperandoTiro = r));
          ui.ayuda("");
          // viendo desde el otro lado de la mesa, la derecha de la pantalla es -x
          objetivo.x = +(objetivo.x * J.lado).toFixed(4);
        } else if (J.modo === "bot") {
          await esperar(1000);
          objetivo = tiroBot(jugador);
        } else {
          ui.ayuda(`${J.nombres[jugador]} está apuntando…`);
          rival = J.recibido[n] || (await new Promise((r) => (J.esperando = { n, r })));
          ui.ayuda("");
          objetivo = rival.objetivo;
        }
        let resultado = await simular(jugador, objetivo);
        if (rival) resultado = rival.resultado;
        else if (J.modo === "online") ui.enviar("tiro", { partida: J.partida, n, objetivo, resultado });
        if (resultado < 0) await esperar(400);
        pelota.visible = false;
        return resultado;
      }

      function terminar(g) {
        J.activa = false;
        vistaMenu = true;
        const gane = soyYo(g) && J.modo !== "local";
        sonar(gane || J.modo === "local" ? "ganar" : "perder");
        ui.terminar({
          emoji: gane || J.modo === "local" ? "🏆" : "😿",
          texto: J.modo === "local" ? `¡Ganó ${J.nombres[g]}!` : gane ? "¡Ganaste!" : `Ganó ${J.nombres[g]}`,
          nota: `Le quedaron ${quedan(g)} vasos al ganador`,
          record: J.modo === "bot" && gane ? quedan(g) : null,
        });
      }
    </script>
  </body>

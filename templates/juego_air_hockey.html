<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0716" />
    <title>Air Hockey · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='juegos3d.css') }}" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, limitar, gauss, lin, material, sonar } = Arcade;

      // Mesa: x de -0.5 a 0.5, z de -1 a 1. El jugador 0 defiende z = +1 (abajo), el 1 defiende z = -1.
      const ANCHO = 0.5,
        LARGO = 1,
        PORTERIA = 0.19,
        R_DISCO = 0.042,
        R_PALA = 0.068,
        VEL_MAX = 4.2,
        GOLES_PARA_GANAR = 7;
      const COLORES = [0xff4f8b, 0x4fb3ff];

      // =========================================================
      //  ESCENA
      // =========================================================
      const M = Arcade.mundo({ fondo: 0x0a0716, fov: 50, exposicion: 1.1, lamparas: [[0, 6, 0, 0xffffff, 3], [-5, 2, 3, 0xff4f8b, 1.5], [5, 2, -3, 0x4fb3ff, 1.5]] });
      const { escena, camara } = M;
      escena.add(new THREE.HemisphereLight(0xffffff, 0x221133, 0.55));
      const foco = new THREE.SpotLight(0xffffff, 1.6, 0, 0.7, 0.6, 1);
      foco.position.set(0, 3.5, 0);
      foco.castShadow = true;
      foco.shadow.mapSize.set(1024, 1024);
      escena.add(foco, foco.target);

      // superficie con líneas de neón
      const texturaMesa = M.textura(512, 1024, (g, w, h) => {
        const gr = g.createLinearGradient(0, 0, 0, h);
        gr.addColorStop(0, "#14204a");
        gr.addColorStop(0.5, "#1d1240");
        gr.addColorStop(1, "#3a1240");
        g.fillStyle = gr;
        g.fillRect(0, 0, w, h);
        g.fillStyle = "rgba(255,255,255,0.05)";
        for (let y = 8; y < h; y += 16) for (let x = 8; x < w; x += 16) g.fillRect(x, y, 2, 2); // hoyitos del aire
        const linea = (color, f) => {
          g.shadowColor = color;
          g.shadowBlur = 18;
          g.strokeStyle = color;
          g.lineWidth = 6;
          f();
          g.stroke();
        };
        linea("#ffffff", () => {
          g.beginPath();
          g.moveTo(0, h / 2);
          g.lineTo(w, h / 2);
        });
        linea("#ffffff", () => {
          g.beginPath();
          g.arc(w / 2, h / 2, w * 0.18, 0, Math.PI * 2);
        });
        linea("#4fb3ff", () => {
          g.beginPath();
          g.arc(w / 2, 0, w * 0.3, 0, Math.PI);
        });
        linea("#ff4f8b", () => {
          g.beginPath();
          g.arc(w / 2, h, w * 0.3, Math.PI, Math.PI * 2);
        });
      });
      const mesa = new THREE.Mesh(new THREE.BoxGeometry(ANCHO * 2, 0.06, LARGO * 2), [
        material(0x111122),
        material(0x111122),
        material(0xffffff, { map: texturaMesa, roughness: 0.15, metalness: 0.1 }),
        material(0x111122),
        material(0x111122),
        material(0x111122),
      ]);
      mesa.position.y = -0.03;
      mesa.receiveShadow = true;
      escena.add(mesa);
      const patas = new THREE.Mesh(new THREE.BoxGeometry(ANCHO * 2 - 0.1, 0.8, LARGO * 2 - 0.1), material(0x1a1030));
      patas.position.y = -0.46;
      escena.add(patas);

      // bordes con neón (dejando el hueco de las porterías)
      const matBorde = material(0x2a1d55, { roughness: 0.3, metalness: 0.4 });
      const borde = (w, d, x, z, color) => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, d), matBorde);
        b.position.set(x, 0.03, z);
        b.castShadow = true;
        escena.add(b);
        const neon = new THREE.Mesh(new THREE.BoxGeometry(w, 0.008, d), new THREE.MeshBasicMaterial({ color }));
        neon.position.set(x, 0.064, z);
        escena.add(neon);
      };
      borde(0.04, LARGO * 2 + 0.08, -ANCHO - 0.02, 0, 0xb84fff);
      borde(0.04, LARGO * 2 + 0.08, ANCHO + 0.02, 0, 0xb84fff);
      [-1, 1].forEach((lado) => {
        const tramo = ANCHO - PORTERIA;
        const color = lado > 0 ? 0xff4f8b : 0x4fb3ff;
        borde(tramo, 0.04, -ANCHO + tramo / 2, lado * (LARGO + 0.02), color);
        borde(tramo, 0.04, ANCHO - tramo / 2, lado * (LARGO + 0.02), color);
      });

      // disco y paletas
      const disco = new THREE.Mesh(new THREE.CylinderGeometry(R_DISCO, R_DISCO, 0.018, 32), material(0xffd84f, { emissive: lin(0xffb400), emissiveIntensity: 0.6, roughness: 0.3 }));
      disco.position.y = 0.009;
      disco.castShadow = true;
      escena.add(disco);
      const luzDisco = new THREE.PointLight(0xffd84f, 0.8, 0.6);
      escena.add(luzDisco);
      const palas = COLORES.map((c) => {
        const g = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(R_PALA, R_PALA, 0.025, 32), material(c, { roughness: 0.25, metalness: 0.2, emissive: lin(c), emissiveIntensity: 0.25 }));
        base.position.y = 0.0125;
        const mango = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.03, 0.05, 20), material(c, { roughness: 0.25 }));
        mango.position.y = 0.05;
        const bolita = new THREE.Mesh(new THREE.SphereGeometry(0.026, 16, 12), material(0xffffff, { roughness: 0.2 }));
        bolita.position.y = 0.08;
        [base, mango, bolita].forEach((m) => (m.castShadow = true));
        g.add(base, mango, bolita);
        escena.add(g);
        return g;
      });

      // =========================================================
      //  ESTADO DEL JUEGO
      // =========================================================
      const D = { x: 0, z: 0, vx: 0, vz: 0 }; // disco
      const P = [
        { x: 0, z: 0.8, vx: 0, vz: 0, objX: 0, objZ: 0.8 },
        { x: 0, z: -0.8, vx: 0, vz: 0, objX: 0, objZ: -0.8 },
      ];
      // dueno: quién manda la posición del disco (el último que le pegó); golpeN cuenta los golpes
      const J = { modo: null, nombres: [], goles: [0, 0], jugando: false, pausa: true, dificultad: "normal", partida: 0, dueno: 0, golpeN: 0, yo: 0, ultimoEnvio: 0 };

      function colocarSaque(quien) {
        // el que recibió el gol saca desde su lado
        D.x = 0;
        D.z = quien === 0 ? 0.3 : -0.3;
        D.vx = D.vz = 0;
        J.dueno = quien;
        J.golpeN = 0;
      }
      function reiniciarPalas() {
        Object.assign(P[0], { x: 0, z: 0.8, vx: 0, vz: 0, objX: 0, objZ: 0.8 });
        Object.assign(P[1], { x: 0, z: -0.8, vx: 0, vz: 0, objX: 0, objZ: -0.8 });
      }

      // ¿Qué palas controla este aparato?
      function controlo(i) {
        if (J.modo === "local") return true;
        if (J.modo === "online") return i === J.yo;
        return i === 0; // bot
      }

      // =========================================================
      //  CONTROLES (multitáctil: cada dedo mueve la pala de su mitad)
      // =========================================================
      const dedos = new Map(); // pointerId → índice de pala
      const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.02);
      function puntoMesa(e) {
        const p = new THREE.Vector3();
        return M.pantallaARayo(e.clientX, e.clientY).ray.intersectPlane(plano, p) ? p : null;
      }
      function moverPalaConDedo(e) {
        const p = puntoMesa(e);
        if (!p) return;
        let i = dedos.get(e.pointerId);
        if (i == null) {
          i = J.modo === "local" ? (p.z > 0 ? 0 : 1) : J.modo === "online" ? J.yo : 0;
          dedos.set(e.pointerId, i);
        }
        if (!controlo(i)) return;
        // en el cel la paleta queda un poquito arriba del dedo para que se vea
        const extra = e.pointerType === "touch" ? (J.modo === "local" ? (i === 0 ? -0.07 : 0.07) : i === 0 ? -0.07 : 0.07) : 0;
        P[i].objX = p.x;
        P[i].objZ = p.z + extra;
      }
      M.lienzo.addEventListener("pointerdown", (e) => {
        M.lienzo.setPointerCapture(e.pointerId);
        dedos.delete(e.pointerId);
        moverPalaConDedo(e);
      });
      M.lienzo.addEventListener("pointermove", (e) => {
        if (dedos.has(e.pointerId) || e.pointerType === "mouse") moverPalaConDedo(e);
      });
      const soltarDedo = (e) => dedos.delete(e.pointerId);
      M.lienzo.addEventListener("pointerup", soltarDedo);
      M.lienzo.addEventListener("pointercancel", soltarDedo);

      // =========================================================
      //  BOT
      // =========================================================
      const VEL_BOT = { facil: 1.5, normal: 2.5, pro: 3.6 };
      let pensarBot = 0;
      function moverBot(dt) {
        pensarBot -= dt;
        if (pensarBot > 0) return;
        pensarBot = J.dificultad === "pro" ? 0.02 : J.dificultad === "normal" ? 0.06 : 0.12;
        const b = P[1];
        if (D.z < 0.05 && (D.vz < 0.6 || D.z < -0.45)) {
          // ataca: se pone detrás del disco (entre el disco y su portería) y empuja hacia abajo
          const atras = D.z - 0.09;
          if (b.z > D.z - 0.02) {
            b.objX = D.x + (D.x > b.x ? -0.12 : 0.12);
            b.objZ = atras - 0.08;
          } else {
            b.objX = D.x + gauss() * (J.dificultad === "facil" ? 0.05 : 0.02);
            b.objZ = D.z + 0.05;
          }
        } else {
          // defiende: entre el disco y su portería
          b.objX = limitar(D.x * 0.55, -0.22, 0.22);
          b.objZ = -0.82;
        }
      }

      // =========================================================
      //  FÍSICA (propia, 2D, pasos pequeños)
      // =========================================================
      function moverPala(i, dt) {
        const p = P[i];
        const minZ = i === 0 ? R_PALA + 0.01 : -LARGO + R_PALA;
        const maxZ = i === 0 ? LARGO - R_PALA : -R_PALA - 0.01;
        const ox = limitar(p.objX, -ANCHO + R_PALA, ANCHO - R_PALA),
          oz = limitar(p.objZ, minZ, maxZ);
        const max = J.modo === "bot" && i === 1 ? VEL_BOT[J.dificultad] : 9;
        let dx = ox - p.x,
          dz = oz - p.z;
        const d = Math.hypot(dx, dz);
        const paso = Math.min(d, max * dt);
        const nx = d > 1e-6 ? p.x + (dx / d) * paso : p.x;
        const nz = d > 1e-6 ? p.z + (dz / d) * paso : p.z;
        p.vx = (nx - p.x) / dt;
        p.vz = (nz - p.z) / dt;
        p.x = nx;
        p.z = nz;
      }

      function choquePala(i) {
        const p = P[i];
        const dx = D.x - p.x,
          dz = D.z - p.z;
        const d = Math.hypot(dx, dz);
        if (d >= R_PALA + R_DISCO || d < 1e-6) return false;
        const nx = dx / d,
          nz = dz / d;
        // saca el disco de la pala
        D.x = p.x + nx * (R_PALA + R_DISCO + 0.001);
        D.z = p.z + nz * (R_PALA + R_DISCO + 0.001);
        const rv = (D.vx - p.vx) * nx + (D.vz - p.vz) * nz;
        if (rv < 0) {
          D.vx -= 1.9 * rv * nx;
          D.vz -= 1.9 * rv * nz;
        }
        const v = Math.hypot(D.vx, D.vz);
        if (v > VEL_MAX) {
          D.vx *= VEL_MAX / v;
          D.vz *= VEL_MAX / v;
        }
        return true;
      }

      let ultimoGolpe = 0;
      function pasoFisica(dt) {
        for (let i = 0; i < 2; i++) moverPala(i, dt);
        D.x += D.vx * dt;
        D.z += D.vz * dt;
        D.vx *= 1 - 0.18 * dt;
        D.vz *= 1 - 0.18 * dt;
        // paredes de los lados
        if (Math.abs(D.x) > ANCHO - R_DISCO) {
          D.x = Math.sign(D.x) * (ANCHO - R_DISCO);
          D.vx *= -0.9;
          sonar("rebote", Math.min(1, Math.abs(D.vx) / 3));
        }
        // fondos (con hueco de portería)
        if (Math.abs(D.z) > LARGO - R_DISCO) {
          if (Math.abs(D.x) < PORTERIA - R_DISCO * 0.3) {
            if (Math.abs(D.z) > LARGO + R_DISCO) return D.z > 0 ? 1 : 0; // gol de quien ataca
          } else {
            D.z = Math.sign(D.z) * (LARGO - R_DISCO);
            D.vz *= -0.9;
            sonar("rebote", Math.min(1, Math.abs(D.vz) / 3));
          }
        }
        // choques con las palas: en online solo calculo los de MI pala
        for (let i = 0; i < 2; i++) {
          if (J.modo === "online" && i !== J.yo) continue;
          if (choquePala(i)) {
            if (performance.now() - ultimoGolpe > 80) {
              sonar("golpe", Math.min(1, Math.hypot(D.vx, D.vz) / 3) * 0.7);
              ultimoGolpe = performance.now();
            }
            if (J.modo === "online" && (J.dueno !== J.yo || performance.now() - J.ultimoEnvio > 100)) {
              J.dueno = J.yo;
              J.golpeN++;
              enviarEstado(true);
            }
          }
        }
        return null;
      }

      // =========================================================
      //  ONLINE: cada quien manda su pala; el "dueño" del disco manda el disco
      // =========================================================
      function enviarEstado(urgente) {
        const ahora = performance.now();
        if (!urgente && ahora - J.ultimoEnvio < 120) return;
        J.ultimoEnvio = ahora;
        const p = P[J.yo];
        const datos = { partida: J.partida, pala: [+p.x.toFixed(3), +p.z.toFixed(3)] };
        if (J.dueno === J.yo) {
          datos.disco = [+D.x.toFixed(4), +D.z.toFixed(4), +D.vx.toFixed(3), +D.vz.toFixed(3)];
          datos.n = J.golpeN;
          datos.g = J.goles[0] + J.goles[1];
        }
        ui.enviar("estado", datos);
      }

      // =========================================================
      //  CICLO
      // =========================================================
      M.alCuadro((dt, ahora) => {
        if (J.jugando && !J.pausa) {
          if (J.modo === "bot") moverBot(dt);
          const pasos = 6;
          for (let k = 0; k < pasos; k++) {
            const gol = pasoFisica(dt / pasos);
            if (gol != null) {
              if (J.modo !== "online" || J.dueno === J.yo) anotar(gol, true);
              break;
            }
          }
          if (J.modo === "online") enviarEstado(false);
        } else {
          for (let i = 0; i < 2; i++) moverPala(i, dt);
        }
        disco.position.set(D.x, 0.009, D.z);
        luzDisco.position.set(D.x, 0.15, D.z);
        palas.forEach((g, i) => g.position.set(P[i].x, 0, P[i].z));

        // cámara: desde mi lado (o desde arriba en 2 jugadores)
        const aspecto = window.innerWidth / window.innerHeight;
        const lado = J.modo === "online" && J.yo === 1 ? -1 : 1;
        if (!J.modo) {
          const t = ahora / 1000;
          camara.position.set(Math.sin(t * 0.25) * 2, 1.6, Math.cos(t * 0.25) * 2);
          camara.lookAt(0, 0, 0);
        } else if (J.modo === "local") {
          camara.fov = aspecto < 1 ? 50 : 40;
          // que quepa toda la mesa (y un poco de espacio para el marcador)
          const tanMitad = Math.tan((camara.fov * Math.PI) / 360);
          const largoPantalla = aspecto < 1 ? 1.3 : 0.65,
            anchoPantalla = aspecto < 1 ? 0.62 : 1.25;
          const alto = Math.max(largoPantalla / tanMitad, anchoPantalla / (tanMitad * aspecto));
          camara.position.set(0, alto, 0.001);
          camara.up.set(aspecto < 1 ? 0 : 1, 0, aspecto < 1 ? -1 : 0);
          camara.lookAt(0, 0, 0);
        } else {
          camara.up.set(0, 1, 0);
          camara.fov = aspecto < 1 ? 58 : 45;
          camara.position.set(0, aspecto < 1 ? 2.35 : 1.7, lado * (aspecto < 1 ? 1.35 : 1.6));
          camara.lookAt(0, 0, -lado * 0.12);
        }
        camara.updateProjectionMatrix();
      });

      async function anotar(quien, avisarRival) {
        J.pausa = true;
        J.goles[quien]++;
        if (J.modo === "online" && avisarRival) ui.enviar("gol", { partida: J.partida, quien, goles: J.goles });
        sonar("publico");
        const yoAnote = J.modo === "online" ? quien === J.yo : J.modo === "bot" ? quien === 0 : true;
        ui.avisar(J.modo === "local" ? `⚡ ¡GOL de ${J.nombres[quien]}!` : yoAnote ? "⚡ ¡GOOOL!" : "😱 Gol del rival", quien ? "#4fb3ff" : "#ff4f8b");
        marcador();
        await esperar(1300);
        if (!J.jugando) return;
        if (J.goles[quien] >= GOLES_PARA_GANAR) return terminar(quien);
        colocarSaque(1 - quien);
        reiniciarPalas();
        J.pausa = false;
      }

      // =========================================================
      //  INTERFAZ
      // =========================================================
      const ui = Arcade.ui({
        juego: "air_hockey",
        titulo: "Air Hockey",
        emoji: "🏒",
        subtitulo: `El primero en meter ${GOLES_PARA_GANAR} goles gana`,
        modos: ["bot", "online", "local"],
        textosModo: { local: "👥 2 jugadores en este cel (uno de cada lado)" },
        dificultad: true,
        intervaloOnline: 110,
        reglas: [
          "Pon el dedo en la pantalla y arrastra: tu paleta lo sigue.",
          "Pégale al disco para meterlo en la portería del rival.",
          "Solo puedes moverte en tu mitad de la mesa.",
          "En 2 jugadores: pon el cel en la mesa, cada quien juega desde su lado ¡al mismo tiempo!",
        ],
        alEmpezar: empezar,
        alSalir: () => {
          J.jugando = false;
          J.modo = null;
        },
      });
      ui.alEvento = (tipo, datos) => {
        if (!datos || datos.partida !== J.partida || J.modo !== "online") return;
        const otro = 1 - J.yo;
        if (tipo === "estado") {
          P[otro].objX = datos.pala[0];
          P[otro].objZ = datos.pala[1];
          // el disco lo manda el último que le pegó; los mensajes viejos (o de antes del último gol) se ignoran
          if (datos.disco && datos.g === J.goles[0] + J.goles[1]) {
            const masNuevo = datos.n > J.golpeN || (datos.n === J.golpeN && (J.dueno === otro || otro === 0));
            if (masNuevo) {
              J.golpeN = datos.n;
              J.dueno = otro;
              [D.x, D.z, D.vx, D.vz] = datos.disco;
              // compensa un poquito el retraso de la red
              D.x += D.vx * 0.06;
              D.z += D.vz * 0.06;
            }
          }
        }
        if (tipo === "gol" && !J.pausa) {
          J.goles = datos.goles.slice();
          J.goles[datos.quien]--;
          anotar(datos.quien, false);
        }
      };

      function marcador() {
        const yo = J.modo === "online" ? J.yo : 0;
        ui.marcador([0, 1].map((i) => ({ nombre: J.nombres[i] + (J.modo === "online" && i === yo ? " (tú)" : ""), valor: J.goles[i], detalle: `a ${GOLES_PARA_GANAR}`, activo: false })));
      }

      function empezar(modo, info) {
        J.modo = modo;
        J.nombres = info.nombres;
        J.dificultad = info.dificultad;
        J.partida = info.partida;
        J.yo = modo === "online" ? ui.yo : 0;
        J.goles = [0, 0];
        J.jugando = true;
        dedos.clear();
        reiniciarPalas();
        colocarSaque(Arcade.rng(info.semilla)() < 0.5 ? 0 : 1);
        if (modo === "bot") colocarSaque(0);
        marcador();
        ui.ayuda("👆 Arrastra el dedo para mover tu paleta");
        setTimeout(() => ui.ayuda(""), 3500);
        J.pausa = true;
        ui.avisar("¡A jugar! 🏒", "#ffd84f");
        setTimeout(() => (J.pausa = false), 1200);
      }

      function terminar(g) {
        J.jugando = false;
        const yo = J.modo === "online" ? J.yo : 0;
        const gane = g === yo;
        sonar(gane || J.modo === "local" ? "ganar" : "perder");
        ui.terminar({
          emoji: J.modo === "local" || gane ? "🏆" : "😿",
          texto: J.modo === "local" ? `¡Ganó ${J.nombres[g]}!` : gane ? "¡Ganaste!" : `Ganó ${J.nombres[g]}`,
          nota: `${J.nombres[0]} ${J.goles[0]} - ${J.goles[1]} ${J.nombres[1]}`,
        });
      }

      colocarSaque(0);
    </script>
  </body>
</html>

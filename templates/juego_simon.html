<!doctype html>
<html lang="es">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <meta charset="UTF-8" />
    <title>Simon Kawaii 3D ✨</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at 50% 20%, #2a164d 0%, #110926 60%, #070312 100%);
        color: #fff;
        margin: 0;
        padding: 18px;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .kawaii-box {
        background: linear-gradient(155deg, rgba(40, 24, 78, 0.94), rgba(16, 10, 38, 0.96));
        border-radius: 36px;
        padding: 26px 22px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        max-width: 480px;
        width: 100%;
        border: 2px solid rgba(244, 114, 182, 0.45);
        backdrop-filter: blur(8px);
      }

      h1 {
        color: #f472b6;
        font-size: 2.1em;
        margin: 0 0 8px;
        text-shadow: 0 0 18px rgba(244, 114, 182, 0.5);
      }

      .hud {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        padding: 10px 14px;
        font-size: 1.25em;
        color: #fde047;
        font-weight: 900;
        margin-bottom: 14px;
      }

      #estado-simon {
        font-size: 0.95rem;
        color: #a5f3fc;
        font-weight: 800;
        min-height: 1.5em;
        margin-bottom: 14px;
      }

      .tablero {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 148px));
        gap: 18px;
        justify-content: center;
        margin-bottom: 22px;
        perspective: 700px;
      }

      .btn-color {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 34px;
        border: 3px solid rgba(255, 255, 255, 0.45);
        cursor: pointer;
        transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 2.1rem;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }
      .btn-color::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 14px;
        right: 14px;
        height: 26%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        pointer-events: none;
      }
      .btn-color small {
        font-size: 0.72rem;
        font-weight: 900;
        opacity: 0.75;
        margin-top: 4px;
      }

      .pink {
        background: radial-gradient(circle at 35% 30%, #ff99cc, #ec4899 65%, #9d174d 100%);
        box-shadow: 0 10px 0 #831843, 0 14px 25px rgba(236, 72, 153, 0.35);
      }
      .blue {
        background: radial-gradient(circle at 35% 30%, #93c5fd, #3b82f6 65%, #1d4ed8 100%);
        box-shadow: 0 10px 0 #1e3a8a, 0 14px 25px rgba(59, 130, 246, 0.35);
      }
      .yellow {
        background: radial-gradient(circle at 35% 30%, #fef08a, #f59e0b 65%, #b45309 100%);
        box-shadow: 0 10px 0 #78350f, 0 14px 25px rgba(245, 158, 11, 0.35);
      }
      .green {
        background: radial-gradient(circle at 35% 30%, #86efac, #10b981 65%, #047857 100%);
        box-shadow: 0 10px 0 #064e3b, 0 14px 25px rgba(16, 185, 129, 0.35);
      }

      .iluminar {
        transform: translateY(6px) scale(0.97);
        filter: brightness(1.45) saturate(1.2);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 38px #ffffff !important;
        border-color: #ffffff;
      }

      .acciones-simon {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-accion {
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white;
        border: none;
        padding: 12px 26px;
        border-radius: 50px;
        font-weight: 900;
        cursor: pointer;
        font-size: 1.05em;
        box-shadow: 0 6px 18px rgba(236, 72, 153, 0.4);
        text-decoration: none;
        transition: 0.18s;
      }
      .btn-accion:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>

  <body>
    <div class="kawaii-box">
      <h1>✨ Simon Musical 3D ✨</h1>
      <div class="hud">
        <div>Nivel: <span id="nivel">0</span></div>
        <div>Mejor: <span id="mejor-nivel">0</span> 🏆</div>
      </div>
      <div id="estado-simon">Pulsa Iniciar o presiona las teclas 1–4</div>

      <div class="tablero">
        <button class="btn-color pink" onclick="clickColor(0)">
          🌸<small>[1]</small>
        </button>
        <button class="btn-color blue" onclick="clickColor(1)">
          💎<small>[2]</small>
        </button>
        <button class="btn-color yellow" onclick="clickColor(2)">
          ⭐<small>[3]</small>
        </button>
        <button class="btn-color green" onclick="clickColor(3)">
          🍀<small>[4]</small>
        </button>
      </div>

      <div class="acciones-simon">
        <button class="btn-accion" onclick="iniciar()">▶️ Iniciar</button>
        <button
          class="btn-accion"
          id="btn-turbo"
          onclick="alternarTurbo()"
          style="background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25)"
        >
          ⚡ Modo: Normal
        </button>
        <a
          href="/secreto"
          class="btn-accion"
          style="background: rgba(255,255,255,0.1); border: 1px solid #f472b6"
          >🏠 Menú</a
        >
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script>
      let secuencia = [];
      let usuarioSecuencia = [];
      let nivel = 0;
      let mejorNivel = 0;
      let puedeJugar = false;
      let modoTurbo = false;
      let tokenPartida = 0;
      let audioCtx = null;
      const FRECUENCIAS = [261.63, 329.63, 392.0, 523.25]; // Do, Mi, Sol, Do5
      const botones = document.querySelectorAll(".btn-color");

      function tocarNota(i, dur = 0.26, tipo = "triangle") {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = tipo;
          osc.frequency.setValueAtTime(FRECUENCIAS[i] || 220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch (_) {}
      }

      function alternarTurbo() {
        modoTurbo = !modoTurbo;
        document.getElementById("btn-turbo").innerText = modoTurbo
          ? "🔥 Modo: Turbo"
          : "⚡ Modo: Normal";
      }

      function iniciar() {
        tokenPartida++;
        secuencia = [];
        nivel = 0;
        siguienteNivel();
      }

      function siguienteNivel() {
        puedeJugar = false;
        usuarioSecuencia = [];
        nivel++;
        document.getElementById("nivel").innerText = nivel;
        if (nivel > mejorNivel) {
          mejorNivel = nivel;
          document.getElementById("mejor-nivel").innerText = mejorNivel;
        }
        document.getElementById("estado-simon").innerText =
          "👀 Observa y escucha la secuencia...";
        secuencia.push(Math.floor(Math.random() * 4));
        mostrarSecuencia(tokenPartida);
      }

      async function mostrarSecuencia(miToken) {
        const pausaBase = modoTurbo
          ? Math.max(240, 460 - nivel * 18)
          : Math.max(340, 680 - nivel * 22);
        for (let color of secuencia) {
          await new Promise((r) => setTimeout(r, pausaBase));
          if (miToken !== tokenPartida) return;
          iluminar(color, Math.round(pausaBase * 0.6));
        }
        await new Promise((r) => setTimeout(r, Math.round(pausaBase * 0.6)));
        if (miToken !== tokenPartida) return;
        puedeJugar = true;
        document.getElementById("estado-simon").innerText =
          `🎵 ¡Tu turno! (${secuencia.length} nota${secuencia.length > 1 ? "s" : ""})`;
      }

      function iluminar(i, durMs = 340) {
        botones[i].classList.add("iluminar");
        tocarNota(i, durMs / 1000);
        setTimeout(() => botones[i].classList.remove("iluminar"), durMs);
      }

      function clickColor(i) {
        if (!puedeJugar) return;
        iluminar(i, 240);
        usuarioSecuencia.push(i);

        const pos = usuarioSecuencia.length - 1;
        if (usuarioSecuencia[pos] !== secuencia[pos]) {
          puedeJugar = false;
          document.getElementById("estado-simon").innerText =
            `💥 ¡Secuencia rota en el nivel ${nivel}! Pulsa Iniciar para reintentar`;
          guardar();
        } else if (usuarioSecuencia.length === secuencia.length) {
          puedeJugar = false;
          document.getElementById("estado-simon").innerText =
            "✨ ¡Perfecto! Preparando siguiente nivel...";
          setTimeout(siguienteNivel, 750);
        }
      }

      document.addEventListener("keydown", (e) => {
        if (!puedeJugar) return;
        if (e.key === "1") clickColor(0);
        else if (e.key === "2") clickColor(1);
        else if (e.key === "3") clickColor(2);
        else if (e.key === "4") clickColor(3);
      });

      function guardar() {
        if (nivel <= 0) return;
        let n = localStorage.getItem("nombreUsuario") || prompt("¡Buen intento! Ingresa tu nombre:");
        if (n) {
          localStorage.setItem("nombreUsuario", n);
          fetch("/guardar_simon", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: n, puntos: nivel }),
          }).catch(() => {});
        }
      }

      function alGanarJuego(misPuntos) {
        enviarPuntaje("/guardar_tu_juego", { puntos: misPuntos });
      }
    </script>
  </body>
</html>

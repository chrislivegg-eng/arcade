<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffb27a" />
    <title>Corredor Infinito · Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='juegos3d.css') }}"
    />
    <style>
      #monedas {
        position: fixed;
        top: calc(92px + env(safe-area-inset-top));
        right: 14px;
        font-weight: 900;
        font-size: 1.3rem;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="monedas" class="oculto">🪙 0</div>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/graficos3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, azar, limitar, lin, sonar } = Arcade;
      const CARRIL = 2.2;
      const GRAVEDAD = 38,
        SALTO = 13;

      // =========================================================
      //  ESCENA
      // =========================================================
      const M = Arcade.mundo({
        fondo: 0xffc49a,
        fov: 60,
        niebla: [30, 95],
        exposicion: 1.05,
        colorAmbiente: 0xffe0c8,
        lejos: 140,
      });
      const { escena, camara } = M;
      const acabado3D = Graficos3D.configurar(M, "cielo");
      const mat = (color, extra = {}) =>
        Arcade.materialPBR({
          color: lin(color),
          roughness: 0.75,
          ...extra,
        });
      escena.add(new THREE.HemisphereLight(0xfff4e6, 0x7a6a8a, 0.8));
      const sol = new THREE.DirectionalLight(0xffe6c8, 1.3);
      sol.castShadow = true;
      sol.shadow.mapSize.set(1024, 1024);
      Object.assign(sol.shadow.camera, {
        left: -10,
        right: 10,
        top: 12,
        bottom: -12,
        near: 1,
        far: 50,
      });
      escena.add(sol, sol.target);

      const caja = (w, h, d, material, x = 0, y = 0, z = 0) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        m.position.set(x, y, z);
        m.castShadow = m.receiveShadow = true;
        return m;
      };

      // vía: grava + rieles que se repiten
      const texGrava = M.textura(256, 256, (g, w, h) => {
        g.fillStyle = "#8d7f74";
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 2500; i++) {
          g.fillStyle = `hsl(25, ${azar(5, 15)}%, ${azar(35, 65)}%)`;
          g.fillRect(
            Math.random() * w,
            Math.random() * h,
            azar(2, 5),
            azar(2, 5),
          );
        }
      });
      texGrava.wrapS = texGrava.wrapT = THREE.RepeatWrapping;
      texGrava.repeat.set(4, 60);
      const suelo = new THREE.Mesh(
        new THREE.PlaneGeometry(9, 240),
        Arcade.materialPBR({ map: texGrava, roughness: 1 }),
      );
      suelo.rotation.x = -Math.PI / 2;
      suelo.receiveShadow = true;
      escena.add(suelo);
      acabado3D.superficie(suelo, "asfalto", { repetir: 20 });
      const pasto = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 240),
        mat(0x8fcf6a),
      );
      pasto.rotation.x = -Math.PI / 2;
      pasto.position.y = -0.02;
      escena.add(pasto);
      acabado3D.superficie(pasto, "cesped", { repetir: 40 });
      const rieles = new THREE.Group();
      const matRiel = mat(0xb0b4bc, { metalness: 0.8, roughness: 0.3 });
      const matDurmiente = mat(0x6b4a33);
      const durmientes = new THREE.InstancedMesh(
        new THREE.BoxGeometry(1.6, 0.06, 0.25),
        matDurmiente,
        600,
      );
      durmientes.castShadow = durmientes.receiveShadow = true;
      const matrizDurmiente = new THREE.Matrix4();
      let nDurmiente = 0;
      [-1, 0, 1].forEach((l) => {
        [-0.55, 0.55].forEach((o) =>
          rieles.add(caja(0.1, 0.12, 240, matRiel, l * CARRIL + o, 0.08, 0)),
        );
        for (let z = -120; z < 120; z += 1.2)
          durmientes.setMatrixAt(
            nDurmiente++,
            matrizDurmiente.makeTranslation(l * CARRIL, 0.03, z),
          );
      });
      durmientes.instanceMatrix.needsUpdate = true;
      rieles.add(durmientes);
      escena.add(rieles);

      // edificios a los lados (se reciclan)
      const edificios = [];
      const tonosEdificio = [
        0xff8fa3, 0x7ec8e3, 0xffd166, 0xa29bfe, 0x95e1d3, 0xf38181,
      ];
      for (let i = 0; i < 24; i++) {
        const lado = i % 2 ? 1 : -1;
        const h = azar(5, 14);
        const e = caja(
          azar(4, 6),
          h,
          azar(5, 8),
          mat(tonosEdificio[i % tonosEdificio.length]),
          lado * azar(8.5, 10),
          h / 2,
          -i * 7,
        );
        // ventanas
        const v = M.textura(64, 128, (g) => {
          g.fillStyle = "rgba(0,0,0,0)";
          for (let y = 8; y < 120; y += 18)
            for (let x = 6; x < 60; x += 16)
              ((g.fillStyle = Math.random() < 0.3 ? "#fff6c8" : "#3d4a63"),
                g.fillRect(x, y, 9, 11));
        });
        e.material = [
          e.material,
          e.material,
          e.material,
          e.material,
          Arcade.materialPBR({
            map: v,
            color: lin(tonosEdificio[i % 6]),
          }),
          Arcade.materialPBR({
            map: v,
            color: lin(tonosEdificio[i % 6]),
          }),
        ];
        edificios.push(e);
        escena.add(e);
      }

      // --- corredor ---
      function crearCorredor() {
        const g = new THREE.Group();
        const cuerpo = new THREE.Group();
        g.add(cuerpo);
        const piel = mat(0xffcc99),
          playera = mat(0xff4f8b),
          pantalon = mat(0x3a4a8a),
          gorra = mat(0x26de81),
          tenis = mat(0xffffff);
        cuerpo.add(caja(0.62, 0.7, 0.36, playera, 0, 1.15, 0));
        const cabeza = caja(0.46, 0.46, 0.42, piel, 0, 1.75, 0);
        cuerpo.add(cabeza);
        cuerpo.add(caja(0.5, 0.14, 0.48, gorra, 0, 2.02, 0.02));
        cuerpo.add(caja(0.48, 0.05, 0.3, gorra, 0, 1.96, -0.3));
        cuerpo.add(caja(0.5, 0.42, 0.3, mat(0x6c5ce7), 0, 1.2, 0.3)); // mochila
        const piernas = [],
          brazos = [];
        [-1, 1].forEach((l) => {
          const pierna = new THREE.Group();
          pierna.position.set(l * 0.17, 0.8, 0);
          pierna.add(caja(0.22, 0.62, 0.24, pantalon, 0, -0.31, 0));
          pierna.add(caja(0.24, 0.14, 0.36, tenis, 0, -0.66, -0.05));
          cuerpo.add(pierna);
          piernas.push(pierna);
          const brazo = new THREE.Group();
          brazo.position.set(l * 0.42, 1.45, 0);
          brazo.add(caja(0.17, 0.56, 0.18, playera, 0, -0.26, 0));
          brazo.add(caja(0.16, 0.14, 0.16, piel, 0, -0.58, 0));
          cuerpo.add(brazo);
          brazos.push(brazo);
        });
        g.userData = { cuerpo, piernas, brazos };
        return g;
      }
      const corredor = crearCorredor();
      escena.add(corredor);

      // --- obstáculos ---
      const matValla = [mat(0xff3b3b), mat(0xffffff)];
      const matTren = [
        mat(0x3a86ff),
        mat(0xffcc00),
        mat(0x26b86b),
        mat(0xff6b4f),
      ];
      const matMoneda = mat(0xffd700, {
        metalness: 0.9,
        roughness: 0.25,
        emissive: lin(0x7a5a00),
      });
      const geoMoneda = new THREE.CylinderGeometry(0.32, 0.32, 0.08, 20);
      function valla(x, z) {
        // baja: se brinca
        const g = new THREE.Group();
        g.add(caja(1.8, 0.2, 0.14, matValla[0], 0, 0.62, 0));
        for (let i = 0; i < 4; i++)
          g.add(
            caja(0.22, 0.21, 0.15, matValla[1], -0.68 + i * 0.45, 0.62, 0.01),
          );
        [-0.8, 0.8].forEach((o) =>
          g.add(caja(0.1, 0.62, 0.1, matValla[1], o, 0.31, 0)),
        );
        g.position.set(x, 0, z);
        return { malla: g, tipo: "valla", x, z, largo: 0.4 };
      }
      function barra(x, z) {
        // alta: hay que agacharse
        const g = new THREE.Group();
        g.add(caja(1.9, 0.5, 0.2, matValla[0], 0, 1.75, 0));
        g.add(caja(1.9, 0.12, 0.21, matValla[1], 0, 1.75, 0));
        [-0.9, 0.9].forEach((o) =>
          g.add(caja(0.12, 2.0, 0.12, mat(0x555555), o, 1.0, 0)),
        );
        g.position.set(x, 0, z);
        return { malla: g, tipo: "barra", x, z, largo: 0.4 };
      }
      function tren(x, z, largo, r) {
        const g = new THREE.Group();
        const m = matTren[Math.floor(r() * matTren.length)];
        g.add(caja(1.9, 2.6, largo, m, 0, 1.45, -largo / 2));
        g.add(caja(1.92, 0.5, largo - 0.4, mat(0xdde6f0), 0, 2.05, -largo / 2));
        g.add(
          caja(
            1.6,
            0.9,
            0.1,
            mat(0x223344, { metalness: 0.4, roughness: 0.2 }),
            0,
            2.0,
            0.02,
          ),
        );
        [-0.6, 0.6].forEach((o) =>
          g.add(
            caja(
              0.25,
              0.25,
              0.06,
              mat(0xfff6c8, { emissive: lin(0xfff6c8) }),
              o,
              0.7,
              0.03,
            ),
          ),
        );
        g.position.set(x, 0, z);
        return { malla: g, tipo: "tren", x, z, largo };
      }

      // =========================================================
      //  MUNDO QUE SE VA GENERANDO
      // =========================================================
      const R = { obst: [], monedas: [], hasta: 0, r: Math.random };
      function limpiarMundo() {
        R.obst.forEach((o) => escena.remove(o.malla));
        R.monedas.forEach((m) => escena.remove(m));
        R.obst = [];
        R.monedas = [];
      }
      function generarHasta(z) {
        while (R.hasta > z) {
          const r = R.r;
          const fila = R.hasta;
          const dificil = Math.min(1, -fila / 900);
          // carriles bloqueados por tren (nunca los 3)
          const libres = [-1, 0, 1];
          const nTrenes =
            r() < 0.35 + dificil * 0.3
              ? r() < 0.35 + dificil * 0.3
                ? 2
                : 1
              : 0;
          const trenes = [];
          for (let i = 0; i < nTrenes; i++)
            trenes.push(libres.splice(Math.floor(r() * libres.length), 1)[0]);
          let largoMax = 0;
          trenes.forEach((l) => {
            const largo = 8 + Math.floor(r() * 3) * 4;
            largoMax = Math.max(largoMax, largo);
            agregar(tren(l * CARRIL, fila, largo, r));
          });
          // los carriles libres pueden tener valla o barra (al menos uno queda limpio o saltable)
          libres.forEach((l) => {
            const t = r();
            if (t < 0.28 + dificil * 0.2) agregar(valla(l * CARRIL, fila));
            else if (t < 0.48 + dificil * 0.25)
              agregar(barra(l * CARRIL, fila));
            else if (r() < 0.6) {
              // hilera de monedas
              for (let k = 0; k < 6; k++) {
                const m = new THREE.Mesh(geoMoneda, matMoneda);
                m.rotation.x = Math.PI / 2;
                m.position.set(l * CARRIL, 0.9, fila - 2 - k * 1.6);
                m.castShadow = true;
                escena.add(m);
                R.monedas.push(m);
              }
            }
          });
          R.hasta -= Math.max(largoMax + 6, azar(13, 20) - dificil * 3);
        }
      }
      function agregar(o) {
        escena.add(o.malla);
        R.obst.push(o);
      }

      // =========================================================
      //  JUGADOR
      // =========================================================
      const P = {
        carril: 0,
        x: 0,
        y: 0,
        vy: 0,
        z: 0,
        v: 14,
        agachado: 0,
        vivo: false,
        monedas: 0,
        t: 0,
      };
      function reiniciar(semilla) {
        limpiarMundo();
        R.r = Arcade.rng(semilla);
        R.hasta = -25;
        Object.assign(P, {
          carril: 0,
          x: 0,
          y: 0,
          vy: 0,
          z: 0,
          v: 14,
          agachado: 0,
          vivo: false,
          monedas: 0,
          t: 0,
        });
        corredor.position.set(0, 0, 0);
        corredor.rotation.set(0, Math.PI, 0);
        corredor.userData.cuerpo.scale.set(1, 1, 1);
        corredor.userData.cuerpo.rotation.set(0, 0, 0);
        generarHasta(-110);
        colocarCamara(1);
      }
      function colocarCamara(suave) {
        const objetivo = new THREE.Vector3(
          P.x * 0.55,
          4.3 + P.y * 0.4,
          P.z + 7.2,
        );
        camara.position.lerp(objetivo, suave);
        camara.lookAt(P.x * 0.45, 1.3 + P.y * 0.3, P.z - 8);
        sol.position.set(P.x + 6, 14, P.z + 4);
        sol.target.position.set(P.x, 0, P.z - 4);
        suelo.position.z = rieles.position.z = Math.round(P.z / 1.2) * 1.2;
        pasto.position.z = P.z;
      }

      function mover(dir) {
        if (!P.vivo) return;
        if (dir === "izq" || dir === "der") {
          const nuevo = limitar(P.carril + (dir === "izq" ? -1 : 1), -1, 1);
          if (nuevo !== P.carril) {
            P.carril = nuevo;
            sonar("swoosh", 0.5);
          }
        } else if (dir === "arriba" && P.y <= 0.01) {
          P.vy = SALTO;
          P.agachado = 0;
          sonar("salto");
        } else if (dir === "abajo") {
          P.agachado = 0.75;
          if (P.y > 0) P.vy = -SALTO * 1.4; // si va en el aire, baja rapidísimo
          sonar("swoosh", 0.3);
        }
      }

      // controles: deslizar (se detecta mientras mueves el dedo) o flechas
      let toque = null;
      M.lienzo.addEventListener(
        "pointerdown",
        (e) => (toque = { x: e.clientX, y: e.clientY, usado: false }),
      );
      M.lienzo.addEventListener("pointermove", (e) => {
        if (!toque || toque.usado) return;
        const dx = e.clientX - toque.x,
          dy = e.clientY - toque.y;
        if (Math.hypot(dx, dy) < 26) return;
        toque.usado = true;
        mover(
          Math.abs(dx) > Math.abs(dy)
            ? dx > 0
              ? "der"
              : "izq"
            : dy < 0
              ? "arriba"
              : "abajo",
        );
      });
      M.lienzo.addEventListener("pointerup", () => {
        // un toque sin deslizar = brincar
        if (toque && !toque.usado) mover("arriba");
        toque = null;
      });
      document.addEventListener("keydown", (e) => {
        const d = {
          ArrowLeft: "izq",
          ArrowRight: "der",
          ArrowUp: "arriba",
          ArrowDown: "abajo",
          a: "izq",
          d: "der",
          w: "arriba",
          s: "abajo",
          " ": "arriba",
        }[e.key];
        if (d && P.vivo) {
          e.preventDefault();
          mover(d);
        }
      });

      function choca() {
        const ancho = 0.55;
        for (const o of R.obst) {
          if (Math.abs(o.x - P.x) > 0.95 + ancho - 0.3) continue;
          const frente = o.z,
            atras = o.z - o.largo;
          if (P.z - 0.25 > frente || P.z + 0.25 < atras) continue;
          if (o.tipo === "valla" && P.y > 0.75) continue;
          if (o.tipo === "barra" && P.agachado > 0) continue;
          if (o.tipo === "tren" && P.y > 2.6) continue;
          return o;
        }
        return null;
      }

      M.alCuadro((dt, ahora) => {
        if (!P.vivo) {
          // en el menú la cámara se mece
          if (!J.modo) {
            camara.position.set(Math.sin(ahora / 3000) * 2, 4.5, 8);
            camara.lookAt(0, 1.2, -6);
          }
          return;
        }
        P.t += dt;
        P.v = Math.min(32, 14 + P.t * 0.22);
        P.z -= P.v * dt;
        // carril
        const xMeta = P.carril * CARRIL;
        P.x += (xMeta - P.x) * Math.min(1, dt * 14);
        // salto
        P.vy -= GRAVEDAD * dt;
        P.y += P.vy * dt;
        // ¿va arriba de un tren?
        const encima = R.obst.find(
          (o) =>
            o.tipo === "tren" &&
            Math.abs(o.x - P.x) < 1 &&
            P.z <= o.z &&
            P.z >= o.z - o.largo,
        );
        const piso = encima && P.y >= 2.55 ? 2.9 : 0;
        if (P.y < piso) {
          P.y = piso;
          P.vy = 0;
        }
        P.agachado = Math.max(0, P.agachado - dt);
        // animación
        const u = corredor.userData;
        const zancada = Math.sin(P.t * 16);
        u.piernas[0].rotation.x = P.y > 0.05 ? -0.6 : zancada * 0.9;
        u.piernas[1].rotation.x = P.y > 0.05 ? 0.4 : -zancada * 0.9;
        u.brazos[0].rotation.x = -zancada * 0.8;
        u.brazos[1].rotation.x = zancada * 0.8;
        u.cuerpo.scale.y +=
          ((P.agachado > 0 ? 0.5 : 1) - u.cuerpo.scale.y) *
          Math.min(1, dt * 18);
        u.cuerpo.rotation.x = P.agachado > 0 ? 0.5 : 0;
        corredor.position.set(P.x, P.y, P.z);
        corredor.rotation.z = (xMeta - P.x) * -0.12;

        // monedas
        for (let i = R.monedas.length - 1; i >= 0; i--) {
          const m = R.monedas[i];
          m.rotation.z += dt * 4;
          if (m.position.z > P.z + 8) {
            escena.remove(m);
            R.monedas.splice(i, 1);
            continue;
          }
          if (
            Math.abs(m.position.z - P.z) < 0.7 &&
            Math.abs(m.position.x - P.x) < 0.9 &&
            Math.abs(m.position.y - (P.y + 0.9)) < 1.2
          ) {
            escena.remove(m);
            R.monedas.splice(i, 1);
            P.monedas++;
            $("monedas").textContent = "🪙 " + P.monedas;
            sonar("ping", 0.5);
          }
        }
        // limpiar obstáculos pasados y generar más
        for (let i = R.obst.length - 1; i >= 0; i--) {
          const o = R.obst[i];
          if (o.z - o.largo > P.z + 10) {
            escena.remove(o.malla);
            R.obst.splice(i, 1);
          }
        }
        generarHasta(P.z - 110);
        edificios.forEach((e) => {
          if (e.position.z > P.z + 15) e.position.z -= 24 * 7;
        });

        const golpe = choca();
        if (golpe) return chocar(golpe);
        colocarCamara(Math.min(1, dt * 8));
        J.distancia = Math.floor(-P.z);
        if (J.distancia !== J.ultimaDist) {
          J.ultimaDist = J.distancia;
          marcador();
          if (J.modo === "online" && ahora - J.ultimoEnvio > 1000) {
            J.ultimoEnvio = ahora;
            ui.enviar("puntos", { partida: J.partida, puntos: puntaje() });
          }
        }
      });

      async function chocar(o) {
        const sesionTarea = J.sesion || 0;
        P.vivo = false;
        sonar("choque");
        if (navigator.vibrate) navigator.vibrate(150);
        ui.avisar(
          o.tipo === "tren"
            ? "💥 ¡Contra el tren!"
            : o.tipo === "barra"
              ? "💥 ¡Agáchate la próxima!"
              : "💥 ¡Tropezaste!",
          "#ff3b3b",
        );
        await ciclo.animar(500, (t) => {
          corredor.userData.cuerpo.rotation.x = -t * 1.4;
          corredor.position.z = P.z + t * 0.8;
        });
        if (sesionTarea !== (J.sesion || 0)) return;
        await esperar(700);
        if (sesionTarea !== (J.sesion || 0)) return;
        terminarCorrida();
      }

      // =========================================================
      //  PARTIDA
      // =========================================================
      const puntaje = () => (J.distancia || 0) + P.monedas * 5;
      const J = {
        modo: null,
        nombres: [],
        resultados: [null, null],
        turno: 0,
        rival: 0,
        ultimoEnvio: 0,
      };
      const ciclo = Arcade.ciclo(J, { animar: (...args) => M.animar(...args) });
      const ui = Arcade.ui({
        juego: "corredor",
        titulo: "Corredor Infinito",
        emoji: "🛹",
        subtitulo: "Corre, brinca, agáchate… ¡que no te alcance el tren!",
        modos: ["solo", "online", "local"],
        textosModo: {
          online: "🌐 Carrera online con un amigo",
          local: "👥 2 jugadores (por turnos)",
        },
        records: true,
        unidadRecord: "pts",
        reglas: [
          "⬅️➡️ Desliza a los lados para cambiar de carril.",
          "⬆️ Desliza hacia arriba (o toca) para brincar las vallas.",
          "⬇️ Desliza hacia abajo para agacharte debajo de las barras.",
          "🚂 Los trenes no se brincan: ¡cámbiate de carril!",
          "🪙 Cada moneda vale 5 puntos. Cada metro, 1 punto.",
        ],
        alEmpezar: empezar,
        alSalir: () => {
          ciclo.cancelar();
          P.vivo = false;
          J.modo = null;
          $("monedas").classList.add("oculto");
        },
      });
      ui.alEvento = (tipo, d) => {
        if (!d || d.partida !== J.partida) return;
        if (tipo === "puntos") J.rival = d.puntos;
        if (tipo === "fin") {
          J.rival = d.puntos;
          J.rivalTermino = true;
          J.alTerminarRival && J.alTerminarRival();
        }
        marcador();
      };

      function marcador() {
        const mio = puntaje();
        if (J.modo === "solo")
          return ui.marcador([
            {
              nombre: J.nombres[0],
              valor: mio,
              detalle: `${J.distancia || 0} m · ⚡ ${Math.round(P.v * 3.6)} km/h`,
              activo: true,
            },
            null,
          ]);
        if (J.modo === "online") {
          const yo = ui.yo;
          const v = yo === 0 ? [mio, J.rival] : [J.rival, mio];
          return ui.marcador(
            [0, 1].map((i) => ({
              nombre: J.nombres[i] + (i === yo ? " (tú)" : ""),
              valor: v[i],
              detalle:
                i === yo
                  ? `${J.distancia || 0} m`
                  : J.rivalTermino
                    ? "chocó"
                    : "🌐 corriendo",
              activo: i === yo,
            })),
          );
        }
        ui.marcador(
          [0, 1].map((i) => ({
            nombre: J.nombres[i],
            valor:
              i === J.turno
                ? mio
                : J.resultados[i] == null
                  ? "—"
                  : J.resultados[i],
            detalle:
              i === J.turno
                ? "corriendo"
                : J.resultados[i] == null
                  ? "espera su turno"
                  : "terminó",
            activo: i === J.turno,
          })),
        );
      }

      function empezar(modo, info) {
        ciclo.cancelar();
        Object.assign(J, {
          modo,
          nombres: info.nombres,
          partida: info.partida,
          semilla: info.semilla,
          resultados: [null, null],
          turno: 0,
          rival: 0,
          rivalTermino: false,
          alTerminarRival: null,
        });
        nuevaCorrida();
      }

      async function nuevaCorrida() {
        const sesionTarea = J.sesion || 0;
        reiniciar(J.semilla);
        J.distancia = 0;
        $("monedas").textContent = "🪙 0";
        $("monedas").classList.remove("oculto");
        marcador();
        if (J.modo === "local")
          ui.avisar(
            `Turno de ${J.nombres[J.turno]}`,
            J.turno ? "#4fb3ff" : "#ff4f8b",
          );
        ui.ayuda("Desliza ⬅️➡️ ⬆️ ⬇️");
        for (const n of ["3", "2", "1"]) {
          ui.avisar(n, "#ffd84f");
          sonar("click");
          await esperar(600);
          if (sesionTarea !== (J.sesion || 0)) return;
          if (!J.modo) return;
        }
        ui.avisar("¡CORRE!", "#26de81");
        P.vivo = true;
        ciclo.despues(() => ui.ayuda(""), 3000);
      }

      async function terminarCorrida() {
        const sesionTarea = J.sesion || 0;
        if (!J.modo) return;
        const pts = puntaje();
        const nota = `${J.distancia} m · 🪙 ${P.monedas}`;
        if (J.modo === "solo") {
          if (
            await ui.ofrecerRevivir({
              texto: "Mira una novedad y continúa desde donde chocaste.",
            })
          ) {
            if (sesionTarea !== (J.sesion || 0) || J.modo !== "solo") return;
            P.z -= 4;
            P.y = 0;
            P.vy = 0;
            P.agachado = 0;
            corredor.userData.cuerpo.rotation.set(0, 0, 0);
            corredor.userData.cuerpo.scale.set(1, 1, 1);
            corredor.rotation.set(0, Math.PI, 0);
            corredor.position.set(P.x, 0, P.z);
            P.vivo = true;
            ui.avisar("❤️ ¡Sigue corriendo!", "#26de81");
            return;
          }
          sonar("ganar");
          return ui.terminar({
            emoji: "🛹",
            texto: `¡${pts} puntos!`,
            nota,
            record: pts,
          });
        }
        if (J.modo === "local") {
          J.resultados[J.turno] = pts;
          if (J.turno === 0) {
            J.turno = 1;
            return nuevaCorrida();
          }
          const [a, b] = J.resultados;
          sonar("ganar");
          return ui.terminar({
            emoji: a === b ? "🤝" : "🏆",
            texto: a === b ? "¡Empate!" : `¡Ganó ${J.nombres[a > b ? 0 : 1]}!`,
            nota: `${J.nombres[0]} ${a} - ${b} ${J.nombres[1]}`,
          });
        }
        ui.enviar("fin", { partida: J.partida, puntos: pts });
        if (!J.rivalTermino) {
          ui.avisar(
            "Esperando a tu rival…<small>sigue corriendo</small>",
            "#4fb3ff",
          );
          await Promise.race([
            new Promise((r) => (J.alTerminarRival = r)),
            esperar(120000),
          ]);
          if (sesionTarea !== (J.sesion || 0)) return;
        }
        const yo = ui.yo;
        const gane = pts > J.rival,
          empate = pts === J.rival;
        sonar(gane ? "ganar" : "perder");
        ui.terminar({
          emoji: empate ? "🤝" : gane ? "🏆" : "😿",
          texto: empate
            ? "¡Empate!"
            : gane
              ? "¡Llegaste más lejos!"
              : `Ganó ${J.nombres[1 - yo]}`,
          nota: `Tú: ${pts} · ${J.nombres[1 - yo]}: ${J.rival}`,
          record: pts,
        });
      }

      reiniciar(777);
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140c1c" />
    <title>Alfileres: Lava y Oro 3D · Chris Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='juegos3d.css') }}"
    />
    <style>
      #hud-alfileres {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        font-family: "Nunito", sans-serif;
        overflow: hidden;
      }
      #hud-alfileres.oculto {
        display: none;
      }

      #panel-camara {
        position: fixed;
        top: calc(84px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 94vw);
        background: linear-gradient(
          135deg,
          rgba(18, 12, 30, 0.94),
          rgba(38, 18, 26, 0.92)
        );
        backdrop-filter: blur(10px);
        border: 2px solid rgba(250, 204, 21, 0.55);
        border-radius: 20px;
        padding: 10px 16px;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .camara-textos {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      #titulo-camara {
        color: #fef08a;
        font-weight: 900;
        font-size: 0.94rem;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #objetivo-camara {
        color: #fed7aa;
        font-weight: 800;
        font-size: 0.76rem;
        line-height: 1.25;
      }
      .camara-acciones {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .caja-progreso-oro {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }
      #progreso-oro {
        font-weight: 900;
        color: #4ade80;
        font-size: 0.9rem;
        white-space: nowrap;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }
      .barra-oro-fondo {
        width: 68px;
        height: 6px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(250, 204, 21, 0.35);
      }
      #barra-oro-relleno {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #facc15, #4ade80);
        border-radius: 999px;
        transition: width 0.2s ease-out;
      }
      .btn-hud-alfiler {
        pointer-events: auto;
        color: #fff;
        border-radius: 999px;
        padding: 6px 12px;
        font-family: inherit;
        font-weight: 900;
        font-size: 0.78rem;
        cursor: pointer;
        transition:
          transform 0.14s ease,
          filter 0.14s ease;
        white-space: nowrap;
      }
      .btn-hud-alfiler:hover {
        transform: scale(1.06);
        filter: brightness(1.1);
      }
      #btn-pista-nivel {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        border: 2px solid #bae6fd;
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
      }
      #btn-reintentar-nivel {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        border: 2px solid #fef08a;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      }

      /* Botones circulares que flotan sobre la argolla de cada alfiler 3D */
      #capa-alfileres-dom {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .tirador-alfiler {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 30%,
          rgba(254, 249, 195, 0.95),
          rgba(245, 158, 11, 0.88) 62%,
          rgba(120, 53, 15, 0.95)
        );
        border: 2.5px solid #fef08a;
        color: #1e1b4b;
        font-weight: 900;
        font-size: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
        pointer-events: auto;
        cursor: pointer;
        box-shadow:
          0 0 18px rgba(250, 204, 21, 0.75),
          0 6px 14px rgba(0, 0, 0, 0.65),
          inset 0 2px 4px rgba(255, 255, 255, 0.65);
        transition:
          transform 0.14s cubic-bezier(0.2, 1.6, 0.4, 1),
          box-shadow 0.2s ease;
        animation: latidoAlfiler 1.6s infinite ease-in-out;
        user-select: none;
      }
      .tirador-alfiler .flecha-alfiler {
        font-size: 1.15rem;
        font-weight: 900;
        color: #451a03;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      .tirador-alfiler .num-alfiler {
        font-size: 0.64rem;
        font-weight: 900;
        color: #78350f;
        margin-top: -1px;
      }
      .tirador-alfiler:hover {
        transform: translate(-50%, -50%) scale(1.2);
      }
      .tirador-alfiler.pista-activa {
        border-color: #4ade80;
        background: radial-gradient(
          circle at 32% 30%,
          #dcfce7,
          #22c55e 65%,
          #14532d
        );
        box-shadow:
          0 0 32px rgba(74, 222, 128, 1),
          0 0 60px rgba(34, 197, 94, 0.85);
        animation: latidoPista 0.75s infinite ease-in-out;
      }
      @keyframes latidoAlfiler {
        0%,
        100% {
          box-shadow:
            0 0 14px rgba(250, 204, 21, 0.6),
            0 5px 12px rgba(0, 0, 0, 0.55);
        }
        50% {
          box-shadow:
            0 0 26px rgba(254, 240, 138, 0.95),
            0 6px 16px rgba(0, 0, 0, 0.65);
        }
      }
      @keyframes latidoPista {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.24);
        }
      }

      .flotante-alfiler {
        position: absolute;
        font-weight: 900;
        font-size: 1.25rem;
        pointer-events: none;
        transform: translate(-50%, -50%);
        text-shadow:
          0 3px 0 rgba(0, 0, 0, 0.85),
          0 0 14px rgba(0, 0, 0, 0.7);
        animation: subirAlfilerFx 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        white-space: nowrap;
      }
      @keyframes subirAlfilerFx {
        0% {
          opacity: 0;
          transform: translate(-50%, -10%) scale(0.5);
        }
        22% {
          opacity: 1;
          transform: translate(-50%, -65%) scale(1.18);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -175%) scale(0.95);
        }
      }

      #guia-alfileres {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 10, 24, 0.9);
        backdrop-filter: blur(6px);
        border: 1.5px solid rgba(250, 204, 21, 0.45);
        color: #fef9c3;
        padding: 7px 18px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 0.8rem;
        text-align: center;
        max-width: 94vw;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      @media (max-width: 600px) {
        #panel-camara {
          padding: 8px 12px;
          gap: 8px;
        }
        #titulo-camara {
          font-size: 0.82rem;
        }
        #objetivo-camara {
          font-size: 0.7rem;
        }
        .tirador-alfiler {
          width: 44px;
          height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div id="hud-alfileres" class="oculto">
      <div id="panel-camara">
        <div class="camara-textos">
          <span id="titulo-camara">📍 BÓVEDA 1 · EL BAUTIZO DE FUEGO</span>
          <span id="objetivo-camara"
            >💧 Enfría la lava con agua antes de soltar el tesoro</span
          >
        </div>
        <div class="camara-acciones">
          <div class="caja-progreso-oro">
            <span id="progreso-oro">💎 0%</span>
            <div class="barra-oro-fondo">
              <div id="barra-oro-relleno"></div>
            </div>
          </div>
          <button
            id="btn-pista-nivel"
            class="btn-hud-alfiler"
            type="button"
            title="Ver qué alfiler sacar"
          >
            💡 Pista
          </button>
          <button
            id="btn-reintentar-nivel"
            class="btn-hud-alfiler"
            type="button"
          >
            🔄 Reiniciar
          </button>
        </div>
      </div>

      <div id="capa-alfileres-dom"></div>
      <div id="capa-fx-alfileres"></div>
      <div id="guia-alfileres">
        👆 Toca un alfiler dorado o su argolla para retirarlo · 💧 Agua + 🔥
        Lava = 🪨 Obsidiana · 💣 Barril destruye Orcos
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/three.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/graficos3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/arcade3d.js') }}"></script>
    <script>
      const { $, esperar, azar, limitar, lin, sonar } = Arcade;

      // =========================================================
      //  ESCENA 3D (BÓVEDA DE TESOROS SUBTERRÁNEA)
      // =========================================================
      const M = Arcade.mundo({
        fondo: 0x0d0816,
        fov: 44,
        niebla: [22, 65],
        exposicion: 1.16,
        colorAmbiente: 0xffdfb8,
        lejos: 90,
      });
      const { escena, camara, lienzo } = M;
      Graficos3D.configurar(M, "interior");

      const mat = (color, extra = {}) =>
        Arcade.materialPBR({
          color: lin(color),
          roughness: 0.42,
          metalness: 0.18,
          ...extra,
        });

      escena.add(new THREE.HemisphereLight(0xffe8c2, 0x1a0d2a, 0.88));

      const sol = new THREE.DirectionalLight(0xfff1d6, 1.38);
      sol.position.set(7, 15, 14);
      sol.castShadow = true;
      sol.shadow.mapSize.set(2048, 2048);
      Object.assign(sol.shadow.camera, {
        left: -10,
        right: 10,
        top: 12,
        bottom: -10,
        near: 2,
        far: 42,
      });
      escena.add(sol, sol.target);

      const luzAntorchaIzq = new THREE.PointLight(0xff7b1a, 1.55, 20, 1.8);
      luzAntorchaIzq.position.set(-5.1, 3.6, 2.2);
      const luzAntorchaDer = new THREE.PointLight(0xff7b1a, 1.55, 20, 1.8);
      luzAntorchaDer.position.set(5.1, 3.6, 2.2);
      const luzLavaDinamica = new THREE.PointLight(0xff4500, 0, 9, 2);
      luzLavaDinamica.position.set(0, 1, 1.4);
      escena.add(luzAntorchaIzq, luzAntorchaDer, luzLavaDinamica);

      // =========================================================
      //  TEXTURAS PROCEDURALES HD SIN COSTURAS (SEAMLESS)
      // =========================================================
      function crearTexturasBoveda() {
        // 1. Mampostería de piedra de mazmorra (Color + Bump) 512x512
        const cColor = document.createElement("canvas");
        const cBump = document.createElement("canvas");
        cColor.width = cColor.height = 512;
        cBump.width = cBump.height = 512;
        const gc = cColor.getContext("2d");
        const gb = cBump.getContext("2d");

        // Fondo de mortero oscuro
        gc.fillStyle = "#120e1c";
        gc.fillRect(0, 0, 512, 512);
        gb.fillStyle = "#181818";
        gb.fillRect(0, 0, 512, 512);

        const filas = 8;
        const cols = 4;
        const altoFila = 512 / filas;
        const anchoCol = 512 / cols;

        let sem = 4219;
        const rnd = () =>
          ((sem = (Math.imul(sem, 1664525) + 1013904223) >>> 0) / 4294967296);

        const paletaPiedra = [
          [42, 37, 60],
          [48, 42, 68],
          [36, 32, 52],
          [55, 47, 72],
          [45, 39, 58],
        ];

        for (let f = 0; f < filas; f++) {
          const desfase = (f % 2) * (anchoCol * 0.5);
          const y = f * altoFila;
          for (let c = -1; c <= cols; c++) {
            const x = c * anchoCol + desfase;
            const pad = 4;
            const bx = x + pad;
            const by = y + pad;
            const bw = anchoCol - pad * 2;
            const bh = altoFila - pad * 2;

            const base =
              paletaPiedra[
                Math.abs((f * 7 + ((c + cols) % cols) * 13) % paletaPiedra.length)
              ];
            const varLuz = (rnd() - 0.5) * 14;
            const r = Math.round(limitar(base[0] + varLuz, 20, 90));
            const g = Math.round(limitar(base[1] + varLuz, 20, 90));
            const b = Math.round(limitar(base[2] + varLuz, 25, 105));

            // Bloque con gradiente sutil de volumen
            const grad = gc.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, `rgb(${r + 12}, ${g + 11}, ${b + 14})`);
            grad.addColorStop(0.5, `rgb(${r}, ${g}, ${b})`);
            grad.addColorStop(1, `rgb(${r - 10}, ${g - 10}, ${b - 12})`);
            gc.fillStyle = grad;
            gc.beginPath();
            gc.roundRect(bx, by, bw, bh, 6);
            gc.fill();

            // Bisel superior iluminado
            gc.strokeStyle = "rgba(255, 235, 200, 0.12)";
            gc.lineWidth = 2;
            gc.beginPath();
            gc.moveTo(bx + 4, by + 2);
            gc.lineTo(bx + bw - 4, by + 2);
            gc.stroke();

            // Mapa de altura (Bump) del bloque
            const gradB = gb.createLinearGradient(bx, by, bx, by + bh);
            gradB.addColorStop(0, "#e5e5e5");
            gradB.addColorStop(0.15, "#cccccc");
            gradB.addColorStop(0.85, "#b5b5b5");
            gradB.addColorStop(1, "#707070");
            gb.fillStyle = gradB;
            gb.beginPath();
            gb.roundRect(bx, by, bw, bh, 6);
            gb.fill();

            // Grietas y poros dentro del bloque
            gc.strokeStyle = "rgba(10, 8, 16, 0.35)";
            gb.strokeStyle = "#404040";
            gc.lineWidth = 1.2;
            gb.lineWidth = 1.5;
            if (rnd() > 0.45) {
              const gx = bx + 15 + rnd() * (bw - 30);
              const gy = by + 8 + rnd() * (bh - 16);
              gc.beginPath();
              gc.moveTo(gx, gy);
              gc.lineTo(gx + (rnd() - 0.5) * 26, gy + (rnd() - 0.5) * 18);
              gc.stroke();
              gb.beginPath();
              gb.moveTo(gx, gy);
              gb.lineTo(gx + (rnd() - 0.5) * 26, gy + (rnd() - 0.5) * 18);
              gb.stroke();
            }
          }
        }

        // Grano fino periódico sin costuras
        const K = (2 * Math.PI) / 512;
        const imgC = gc.getImageData(0, 0, 512, 512);
        const imgB = gb.getImageData(0, 0, 512, 512);
        for (let y = 0; y < 512; y++) {
          for (let x = 0; x < 512; x++) {
            const onda =
              Math.sin(x * K * 6 + Math.cos(y * K * 4)) *
                Math.cos(y * K * 6 - Math.sin(x * K * 4)) *
                7 +
              (rnd() - 0.5) * 8;
            const i = (y * 512 + x) * 4;
            imgC.data[i] = limitar(imgC.data[i] + onda, 0, 255);
            imgC.data[i + 1] = limitar(imgC.data[i + 1] + onda, 0, 255);
            imgC.data[i + 2] = limitar(imgC.data[i + 2] + onda, 0, 255);
            imgB.data[i] =
              imgB.data[i + 1] =
              imgB.data[i + 2] =
                limitar(imgB.data[i] + onda * 1.8, 0, 255);
          }
        }
        gc.putImageData(imgC, 0, 0);
        gb.putImageData(imgB, 0, 0);

        const texParedColor = new THREE.CanvasTexture(cColor);
        texParedColor.wrapS = texParedColor.wrapT = THREE.RepeatWrapping;
        texParedColor.repeat.set(4, 3.5);
        texParedColor.encoding = THREE.sRGBEncoding;

        const texParedBump = new THREE.CanvasTexture(cBump);
        texParedBump.wrapS = texParedBump.wrapT = THREE.RepeatWrapping;
        texParedBump.repeat.set(4, 3.5);

        // 2. Textura de Muro de Bóveda (Piedra Basáltica con Vetas Metálicas)
        const texMuro = M.textura(256, 256, (g, w, h) => {
          const K2 = (2 * Math.PI) / w;
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const n =
                Math.sin(x * K2 * 3 + Math.sin(y * K2 * 2)) * 14 +
                Math.cos(y * K2 * 4 - Math.cos(x * K2 * 3)) * 12 +
                (rnd() - 0.5) * 14;
              const i = (y * w + x) * 4;
              img.data[i] = limitar(74 + n, 35, 130);
              img.data[i + 1] = limitar(85 + n, 40, 145);
              img.data[i + 2] = limitar(108 + n * 1.1, 55, 170);
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
          // Líneas de sillería fina
          g.strokeStyle = "rgba(15, 23, 42, 0.45)";
          g.lineWidth = 3;
          for (let y = 32; y < h; y += 64) {
            g.beginPath();
            g.moveTo(0, y);
            g.lineTo(w, y);
            g.stroke();
          }
        });
        texMuro.wrapS = texMuro.wrapT = THREE.RepeatWrapping;
        texMuro.repeat.set(1, 1);

        // 3. Textura de Magma / Lava Volcánica Incandescente
        const texLava = M.textura(256, 256, (g, w, h) => {
          const K2 = (2 * Math.PI) / w;
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const v1 = Math.sin(
                x * K2 * 2 + 1.8 * Math.sin(y * K2 * 2 + x * K2),
              );
              const v2 = Math.cos(
                y * K2 * 3 - 1.6 * Math.cos(x * K2 * 2 - y * K2),
              );
              const calor = (v1 * v2 + 1) * 0.5; // 0..1
              const grieta = Math.pow(
                1 - Math.abs(Math.sin(x * K2 * 3 + y * K2 * 2 + v1 * 1.5)),
                3,
              );
              const t = limitar(calor * 0.65 + grieta * 0.75, 0, 1);
              const i = (y * w + x) * 4;
              // De corteza rojo-oscura a naranja intenso y venas amarillo-blancas
              img.data[i] = limitar(130 + t * 180, 90, 255);
              img.data[i + 1] = limitar(15 + Math.pow(t, 1.5) * 235, 10, 250);
              img.data[i + 2] = limitar(Math.pow(t, 3.2) * 190, 0, 200);
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
        });
        texLava.wrapS = texLava.wrapT = THREE.RepeatWrapping;

        // 4. Textura de Agua Cristalina con Cáusticas
        const texAgua = M.textura(256, 256, (g, w, h) => {
          const K2 = (2 * Math.PI) / w;
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const c1 = Math.sin(x * K2 * 3 + Math.cos(y * K2 * 2));
              const c2 = Math.cos(y * K2 * 3 - Math.sin(x * K2 * 3));
              const luz = Math.pow(Math.abs(c1 + c2) * 0.5, 1.6);
              const i = (y * w + x) * 4;
              img.data[i] = limitar(10 + luz * 195, 0, 240);
              img.data[i + 1] = limitar(175 + luz * 80, 140, 255);
              img.data[i + 2] = limitar(235 + luz * 20, 210, 255);
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
        });
        texAgua.wrapS = texAgua.wrapT = THREE.RepeatWrapping;

        // 5. Textura de Obsidiana Cristalina
        const texObsidiana = M.textura(256, 256, (g, w, h) => {
          const K2 = (2 * Math.PI) / w;
          const img = g.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const veta = Math.pow(
                Math.abs(Math.sin(x * K2 * 4 - y * K2 * 3)),
                5,
              );
              const base = 36 + Math.sin(x * K2 * 2) * 10 + (rnd() - 0.5) * 12;
              const i = (y * w + x) * 4;
              img.data[i] = limitar(base + veta * 85, 20, 160);
              img.data[i + 1] = limitar(base + 4 + veta * 55, 22, 140);
              img.data[i + 2] = limitar(base + 24 + veta * 130, 38, 210);
              img.data[i + 3] = 255;
            }
          }
          g.putImageData(img, 0, 0);
        });

        // 6. Textura de Moneda / Oro Real Grabado
        const texOro = M.textura(256, 256, (g, w, h) => {
          const grad = g.createRadialGradient(128, 128, 12, 128, 128, 128);
          grad.addColorStop(0, "#fef9c3");
          grad.addColorStop(0.55, "#facc15");
          grad.addColorStop(0.85, "#eab308");
          grad.addColorStop(1, "#b45309");
          g.fillStyle = grad;
          g.fillRect(0, 0, w, h);
          g.strokeStyle = "rgba(120, 53, 15, 0.45)";
          g.lineWidth = 8;
          g.beginPath();
          g.arc(128, 128, 104, 0, Math.PI * 2);
          g.stroke();
          g.strokeStyle = "rgba(254, 249, 195, 0.7)";
          g.lineWidth = 4;
          g.beginPath();
          g.arc(128, 128, 92, 0, Math.PI * 2);
          g.stroke();
        });

      function crearAlfiler3D(def) {
        const dx = def.x2 - def.x1;
        const dy = def.y2 - def.y1;
        const largo = Math.hypot(dx, dy);
        const angulo = Math.atan2(dy, dx);
        const cx = (def.x1 + def.x2) / 2;
        const cy = (def.y1 + def.y2) / 2;

        const grupo = new THREE.Group();
        grupo.position.set(cx, cy, 0.16);
        grupo.rotation.z = angulo;

        // Barra dorada grabada del alfiler
        const barra = new THREE.Mesh(
          new THREE.CylinderGeometry(0.115, 0.115, largo, 20),
          matOroPin,
        );
        barra.rotation.z = Math.PI / 2;
        barra.castShadow = true;
        grupo.add(barra);

        // Punta cónica en el extremo interno (x2, y2)
        const punta = new THREE.Mesh(
          new THREE.ConeGeometry(0.115, 0.24, 16),
          matOroPin,
        );
        punta.rotation.z = -Math.PI / 2;
        punta.position.x = largo / 2 + 0.1;
        grupo.add(punta);

        // Collarín engastado junto a la argolla
        const collar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.17, 0.17, 0.14, 16),
          matBronceBoveda,
        );
        collar.rotation.z = Math.PI / 2;
        collar.position.x = -largo / 2;
        grupo.add(collar);

        // Argolla real y joya central en el extremo de tiro (x1, y1)
        const argolla = new THREE.Mesh(
          new THREE.TorusGeometry(0.36, 0.095, 14, 28),
          matOroPin,
        );
        argolla.position.x = -largo / 2 - 0.36;
        argolla.castShadow = true;

        const matJoya =
          def.colorJoya === "agua"
            ? matZafiroPin
            : def.colorJoya === "oro"
              ? matEsmeraldaPin
              : matRubiPin;
        const joya = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.21, 0),
          matJoya,
        );
        joya.position.x = -largo / 2 - 0.36;
        grupo.add(argolla, joya);

        // Dirección hacia la que sale el alfiler al jalarlo (hacia x1, y1)
        const dirX = -dx / largo;
        const dirY = -dy / largo;

        const pinObj = {
          ...def,
          grupo,
          joya,
          argolla,
          largo,
          dirX,
          dirY,
          sacado: false,
          animando: false,
          desplazamiento: 0,
        };
        grupo.traverse((m) => {
          if (m.isMesh) m.userData.pinRef = pinObj;
        });
        return pinObj;
      }

      function textoFlotanteAlfiler(texto, color, x, y) {
        const capa = $("capa-fx-alfileres");
        if (!capa) return;
        const v = new THREE.Vector3(x, y, 0.4).project(camara);
        const px = (v.x * 0.5 + 0.5) * window.innerWidth;
        const py = (-v.y * 0.5 + 0.5) * window.innerHeight;
        const div = document.createElement("div");
        div.className = "flotante-alfiler";
        div.style.left = `${limitar(px, 60, window.innerWidth - 60)}px`;
        div.style.top = `${limitar(py, 80, window.innerHeight - 80)}px`;
        div.style.color = color;
        div.textContent = texto;
        capa.appendChild(div);
        setTimeout(() => div.remove(), 980);
      }

      function vapor3D(x, y, colorHex = 0xe2e8f0, n = 6, escala = 1) {
        const m = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.88,
        });
        for (let i = 0; i < n; i++) {
          const s = new THREE.Mesh(
            new THREE.SphereGeometry(azar(0.09, 0.21) * escala, 8, 8),
            m,
          );
          s.position.set(x + azar(-0.18, 0.18), y + azar(-0.12, 0.12), 0.36);
          s.userData = {
            vx: azar(-1.5, 1.5) * escala,
            vy: azar(1.4, 3.8) * escala,
            vida: azar(0.35, 0.7),
            vidaMax: 0.65,
          };
          grupoNivel.add(s);
          A.efectos.push(s);
        }
      }

          grupoNivel.add(mesh);

          const franja = new THREE.Mesh(
            Graficos3D.cajaSuave(largo + 0.16, 0.08, 0.08, 0.02),

          );
          franja.position.set((m.x1 + m.x2) / 2, (m.y1 + m.y2) / 2, 0.64);
          franja.rotation.z = angulo;
          grupoNivel.add(franja);

          for (const [vx, vy] of [
            [m.x1, m.y1],
            [m.x2, m.y2],
          ]) {
            const k = `${vx.toFixed(1)}:${vy.toFixed(1)}`;
            if (!verticesRemache.has(k)) {
              verticesRemache.add(k);
              const remache = new THREE.Mesh(geoRemache, matBronceBoveda);
              remache.position.set(vx, vy, 0);
              grupoNivel.add(remache);
            }
          }

          A.segmentosMuro.push({
            x1: m.x1,
            y1: m.y1,
            x2: m.x2,
            y2: m.y2,
            grosor: 0.17,
          });
        }

        // 2. Construir alfileres dorados interactivos
        const capaDom = $("capa-alfileres-dom");
        capaDom.innerHTML = "";
        for (const pDef of def.alfileres) {
          const pin = crearAlfiler3D(pDef);
          grupoNivel.add(pin.grupo);

          const flecha =
            Math.abs(pin.dirX) >= Math.abs(pin.dirY)
              ? pin.dirX < 0
                ? "⬅"
                : "➡"
              : pin.dirY > 0
                ? "⬆"
                : "⬇";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tirador-alfiler";
          btn.innerHTML = `<span class="flecha-alfiler">${flecha}</span><span class="num-alfiler">#${pDef.id}</span>`;
          btn.setAttribute("aria-label", `Sacar alfiler ${pDef.id}`);
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            sacarAlfiler(pin);
          });
          capaDom.appendChild(btn);
          pin.botonDOM = btn;
          A.alfileres.push(pin);
        }

        // 3. Crear fluidos (Agua, Lava) y Joyas de Tesoro
        let indiceColor = 0;
        for (const g of def.gruposParticulas) {
          const paso = 0.41;
          for (let f = 0; f < g.filas; f++) {
            for (let c = 0; c < g.cols; c++) {
              const px =
                g.cx +
                (c - (g.cols - 1) / 2) * paso +
                (f % 2 === 0 ? 0.03 : -0.03) +
                azar(-0.02, 0.02);
              const py = g.cy + (f - (g.filas - 1) / 2) * (paso * 0.94);

              let mesh;
              if (g.tipo === "agua") {
                mesh = new THREE.Mesh(geoEsferaFluido, matAgua);
              } else if (g.tipo === "lava") {
                mesh = new THREE.Mesh(geoEsferaFluido, matLava);
              } else {
                indiceColor++;
                const mod = indiceColor % 4;
                if (mod === 0) {
                  mesh = new THREE.Mesh(geoGemaOcta, matGemaDiamante);
                } else if (mod === 1) {
                  mesh = new THREE.Mesh(geoMoneda, matMonedaOro);
                } else if (mod === 2) {
                  mesh = new THREE.Mesh(geoGemaDode, matGemaEsmeralda);
                } else {
                  mesh = new THREE.Mesh(geoGemaOcta, matGemaRubi);
                }
                A.oroTotal++;
              }
              mesh.position.set(px, py, 0.14);
              mesh.castShadow = true;
              grupoNivel.add(mesh);

              A.particulas.push({
                tipo: g.tipo, // "agua", "lava", "oro", "piedra"
                x: px,
                y: py,
                vx: azar(-0.08, 0.08),
                vy: 0,
                r: 0.175,
                cargasAgua: 3, // Cada gota de agua enfría en cadena y luego se evapora/drena
                vidaPiedra: 0,
                mesh,
                recogida: false,
                semillaFase: azar(0, 6.28),
              });
            }
          }
        }

        // 4. Barriles explosivos (si la bóveda los incluye)
        for (const b of def.barriles || []) {
          const mBarril = crearBarril3D();
          mBarril.position.set(b.x, b.y, 0.16);
          grupoNivel.add(mBarril);
          A.barriles.push({
            x: b.x,
            y: b.y,
            vx: 0,
            vy: 0,
            r: 0.31,
            mesh: mBarril,
            explotado: false,
          });
        }

        // 5. Héroe y Orcos
        const heroe3D = crearHeroeBoveda3D();
        heroe3D.position.set(def.heroe.x, def.heroe.y, 0.14);
        grupoNivel.add(heroe3D);
        A.heroe = { x: def.heroe.x, y: def.heroe.y, mesh: heroe3D };

        for (const o of def.orcos) {
          const mOrco = crearOrcoBoveda3D();
          mOrco.position.set(o.x, o.y, 0.14);
          grupoNivel.add(mOrco);
          A.orcos.push({ x: o.x, y: o.y, mesh: mOrco, vivo: true });
        }
      }

      function sacarAlfiler(pin) {
        if (!A.activo || A.resuelto || pin.sacado || pin.animando) return;
        pin.animando = true;
        if (pin.botonDOM) {
          pin.botonDOM.classList.remove("pista-activa");
          pin.botonDOM.style.display = "none";
        }
        sonar("click");
        vapor3D(pin.x1, pin.y1, 0xfef08a, 9);
      }

      // Permitir también tocar o hacer clic directamente sobre la barra 3D del alfiler en el canvas
      lienzo.addEventListener("pointerdown", (e) => {
        if (!A.activo || A.resuelto) return;
        const rayo = M.pantallaARayo(e.clientX, e.clientY);
        const mallas = [];
        for (const pin of A.alfileres) {
          if (!pin.sacado && !pin.animando) {
            pin.grupo.traverse((c) => {
              if (c.isMesh) mallas.push(c);
            });
          }
        }
        const hits = rayo.intersectObjects(mallas, false);
        if (hits.length > 0 && hits[0].object.userData.pinRef) {
          sacarAlfiler(hits[0].object.userData.pinRef);
        }
      });

      $("btn-reintentar-nivel").addEventListener("click", () => {
        if (!A.activo) return;
        sonar("click");
        cargarBoveda(A.boveda);
      });

      $("btn-pista-nivel").addEventListener("click", () => {
        if (!A.activo || A.resuelto) return;
        sonar("click");
        for (const pin of A.alfileres) {
          if (pin.botonDOM) pin.botonDOM.classList.remove("pista-activa");
        }
        const sigId = A.ordenSugerido.find((id) => {
          const p = A.alfileres.find((al) => al.id === id);
          return p && !p.sacado && !p.animando;
        });
        const objetivo =
          A.alfileres.find((al) => al.id === sigId) ||
          A.alfileres.find((al) => !al.sacado && !al.animando);
        if (objetivo && objetivo.botonDOM) {
          objetivo.botonDOM.classList.add("pista-activa");
          textoFlotanteAlfiler(
            `💡 ¡Tira del alfiler #${objetivo.id}!`,
            "#4ade80",
            (objetivo.x1 + objetivo.x2) / 2,
            (objetivo.y1 + objetivo.y2) / 2 + 0.65,
          );
        }
      });

      // Colisión de círculo (partícula o barril) contra segmento (muro o alfiler activo)
      function rebotarContraSegmento(p, x1, y1, x2, y2, grosor, restitucion = 0.14) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len2 = dx * dx + dy * dy;
        if (len2 === 0) return false;
        const t = limitar(((p.x - x1) * dx + (p.y - y1) * dy) / len2, 0, 1);
        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        const distX = p.x - cx;
        const distY = p.y - cy;
        const dist = Math.hypot(distX, distY);
        const minDist = p.r + grosor;
        if (dist < minDist && dist > 0.0001) {
          const nx = distX / dist;
          const ny = distY / dist;
          const solape = minDist - dist;
          p.x += nx * solape;
          p.y += ny * solape;
          const vn = p.vx * nx + p.vy * ny;
          if (vn < 0) {
            p.vx -= (1 + restitucion) * vn * nx;
            p.vy -= (1 + restitucion) * vn * ny;
            // Deslizamiento fluido en rampas y embudos (sin atascos)
            if (Math.abs(dy) > 0.02 && Math.abs(dx) > 0.02) {
              const len = Math.sqrt(len2);
              // Vector tangente apuntando cuesta abajo
              const tx = dy < 0 ? dx / len : -dx / len;
              const ty = dy < 0 ? dy / len : -dy / len;
              p.vx += tx * 0.22;
              p.vy += ty * 0.12;
            } else {
              p.vx *= p.tipo === "agua" ? 0.99 : 0.96;
            }
          }
          return true;
        }
        return false;
      }

      function convertirEnPiedra(particula) {
        if (particula.tipo === "piedra" || particula.recogida) return;
        particula.tipo = "piedra";
        particula.r = 0.165;
        particula.vidaPiedra = azar(0.45, 0.78);
        particula.mesh.geometry = geoRoca;
        particula.mesh.material = matPiedra;
        particula.mesh.scale.set(1, 1, 1);
      }

      // Enfriamiento en cadena para que ningún resto de lava quede atrapado
      function enfriarClusterLava(cx, cy, radio = 1.08) {
        const cola = [{ x: cx, y: cy }];
        while (cola.length > 0) {
          const act = cola.pop();
          for (const p of A.particulas) {
            if (!p.recogida && p.tipo === "lava") {
              if (Math.hypot(p.x - act.x, p.y - act.y) < radio) {
                convertirEnPiedra(p);
                cola.push({ x: p.x, y: p.y });
              }
            }
          }
        }
      }

      function explotarBarril(barril) {
        if (barril.explotado) return;
        barril.explotado = true;
        barril.mesh.visible = false;
        A.sacudida = 0.55;
        sonar("golpe");
        vapor3D(barril.x, barril.y, 0xff6b00, 18, 1.35);
        vapor3D(barril.x, barril.y, 0xfef08a, 10, 1.1);
        textoFlotanteAlfiler(
          "💥 ¡BOOM!",
          "#facc15",
          barril.x,
          barril.y + 0.8,
        );

        // Eliminar Orcos en el radio de la explosión
        for (const orco of A.orcos) {
          if (
            orco.vivo &&
            Math.hypot(orco.x - barril.x, orco.y + 0.5 - barril.y) < 2.2
          ) {
            orco.vivo = false;
            orco.mesh.visible = false;
            sonar("moneda");
            vapor3D(orco.x, orco.y + 0.6, 0x4ade80, 14);
            textoFlotanteAlfiler(
              "💥 ¡ORCO ELIMINADO!",
              "#4ade80",
              orco.x,
              orco.y + 1.3,
            );
            A.puntos += 75;
          }
        }

        // Empujar partículas cercanas y enfriar/dispersar lava adyacente
        for (const p of A.particulas) {
          if (p.recogida) continue;
          const dx = p.x - barril.x;
          const dy = p.y - barril.y;
          const d = Math.hypot(dx, dy);
          if (d < 2.0 && d > 0.01) {
            if (p.tipo === "lava" && d < 1.35) {
              convertirEnPiedra(p);
            }
            const f = (2.0 - d) * 4.5;
            p.vx += (dx / d) * f;
            p.vy += (dy / d) * f + 2.0;
          }
        }
      }

      function verificarDerrotaPorOroPerdido() {
        if (!A.activo || A.resuelto || A.oroTotal === 0) return;
        const maxPosible = A.oroTotal - A.oroPerdido;
        const pctMax = Math.round((maxPosible / A.oroTotal) * 100);
        if (pctMax < 65) {
          A.resuelto = true;
          sonar("perder");
          textoFlotanteAlfiler(
            "💔 ¡SE PERDIÓ DEMASIADO TESORO!",
            "#ff4d6d",
            0,
            0.5,
          );
          setTimeout(
            () =>
              falloBoveda(
                "La lava destruyó demasiadas joyas. ¡Enfría la lava primero!",
              ),
            950,
          );
        }
      }

      // =========================================================
      //  BUCLE DE SIMULACIÓN DE FLUIDOS Y COLISIONES (60 FPS)
      // =========================================================
      M.alCuadro((dt) => {
        A.tiempo += dt;
        const subPasos = 3;
        const subDt = Math.min(0.026, dt) / subPasos;

        // Animar texturas vivas (flujo de magma y agua + antorchas)
        TEX.texLava.offset.x = (A.tiempo * 0.08) % 1;
        TEX.texLava.offset.y = (A.tiempo * 0.05) % 1;
        TEX.texAgua.offset.x = (A.tiempo * 0.12) % 1;
        TEX.texAgua.offset.y = (Math.sin(A.tiempo * 1.5) * 0.06) % 1;
        matLava.emissiveIntensity = 1.25 + Math.sin(A.tiempo * 5.5) * 0.25;

        for (let i = 0; i < llamasAntorcha.length; i++) {
          const ll = llamasAntorcha[i];
          const s = 1 + Math.sin(A.tiempo * 14 + i * 2) * 0.12;
          ll.scale.set(s, 1 + Math.cos(A.tiempo * 18 + i) * 0.16, s);
          ll.rotation.z = Math.sin(A.tiempo * 9 + i) * 0.1;
        }
        luzAntorchaIzq.intensity = 1.45 + Math.sin(A.tiempo * 13) * 0.2;
        luzAntorchaDer.intensity = 1.45 + Math.cos(A.tiempo * 11) * 0.2;

        // Animar extracción de alfileres y rotación de sus joyas
        for (const pin of A.alfileres) {
          if (pin.joya) pin.joya.rotation.y += dt * 2.4;
          if (pin.animando && !pin.sacado) {
            pin.desplazamiento += dt * 16;
            pin.grupo.position.x += pin.dirX * dt * 16;
            pin.grupo.position.y += pin.dirY * dt * 16;
            if (pin.desplazamiento >= pin.largo + 0.65) {
              pin.sacado = true;
              pin.grupo.visible = false;
            }
          }
          // Proyectar botón de la argolla en pantalla
          if (!pin.sacado && !pin.animando && pin.botonDOM) {
            const hx = pin.x1 + ((pin.x1 - pin.x2) / pin.largo) * 0.36;
            const hy = pin.y1 + ((pin.y1 - pin.y2) / pin.largo) * 0.36;
            const v = new THREE.Vector3(hx, hy, 0.25).project(camara);
            pin.botonDOM.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
            pin.botonDOM.style.top = `${(-v.y * 0.5 + 0.5) * window.innerHeight}px`;
          }
        }

        // Subpasos físicos para estabilidad total de fluidos y barriles
        for (let paso = 0; paso < subPasos; paso++) {
          // Actualizar barriles explosivos
          for (const b of A.barriles) {
            if (b.explotado) continue;
            const vyAntes = b.vy;
            b.vy -= 14.5 * subDt;
            b.x += b.vx * subDt;
            b.y += b.vy * subDt;

            for (const m of A.segmentosMuro) {
              if (
                rebotarContraSegmento(b, m.x1, m.y1, m.x2, m.y2, m.grosor, 0.1) &&
                vyAntes < -5.2
              ) {
                explotarBarril(b);
                break;
              }
            }
            if (b.explotado) continue;
            for (const pin of A.alfileres) {
              if (!pin.sacado && !pin.animando) {
                rebotarContraSegmento(
                  b,
                  pin.x1,
                  pin.y1,
                  pin.x2,
                  pin.y2,
                  0.13,
                  0.05,
                );
              }
            }
            // ¿Toca un Orco al caer con velocidad?
            for (const orco of A.orcos) {
              if (
                orco.vivo &&
                Math.abs(vyAntes) > 2.2 &&
                Math.hypot(b.x - orco.x, b.y - (orco.y + 0.55)) < 0.78
              ) {
                explotarBarril(b);
                break;
              }
            }
          }

          // Actualizar partículas (Agua, Lava, Oro, Piedra)
          for (let i = 0; i < A.particulas.length; i++) {
            const p = A.particulas[i];
            if (p.recogida) continue;
            p.vy -= 14.8 * subDt;
            p.x += p.vx * subDt;
            p.y += p.vy * subDt;

            // Colisión contra muros fijos
            for (const m of A.segmentosMuro) {
              rebotarContraSegmento(p, m.x1, m.y1, m.x2, m.y2, m.grosor);
            }
            // Colisión contra alfileres aún puestos
            for (const pin of A.alfileres) {
              if (!pin.sacado && !pin.animando) {
                rebotarContraSegmento(p, pin.x1, pin.y1, pin.x2, pin.y2, 0.13);
              }
            }
          }

          // Colisión entre partículas + Reacciones Químicas
          for (let i = 0; i < A.particulas.length; i++) {
            const a = A.particulas[i];
            if (a.recogida) continue;
            for (let j = i + 1; j < A.particulas.length; j++) {
              const b = A.particulas[j];
              if (b.recogida) continue;
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const dist = Math.hypot(dx, dy);
              const minDist = a.r + b.r;
              if (dist < minDist && dist > 0.0001) {
                // El tesoro (oro) es pesado y nunca se atasca sobre agua o piedra obsidiana
                const oroConFluidoOPiedra =
                  (a.tipo === "oro" && (b.tipo === "agua" || b.tipo === "piedra")) ||
                  (b.tipo === "oro" && (a.tipo === "agua" || a.tipo === "piedra"));

                const nx = dx / dist;
                const ny = dy / dist;
                const solape = (minDist - dist) * 0.5;
                if (oroConFluidoOPiedra) {
                  // El oro desplaza al agua/piedra sin frenarse
                  const liviana = a.tipo === "oro" ? b : a;
                  const signo = a.tipo === "oro" ? 1 : -1;
                  liviana.x += signo * nx * solape * 1.6;
                  liviana.y += signo * ny * solape * 1.6;
                } else {
                  a.x -= nx * solape;
                  a.y -= ny * solape;
                  b.x += nx * solape;
                  b.y += ny * solape;

                  const dvx = b.vx - a.vx;
                  const dvy = b.vy - a.vy;
                  const vn = dvx * nx + dvy * ny;
                  if (vn < 0) {
                    const imp = vn * 0.46;
                    a.vx += imp * nx;
                    a.vy += imp * ny;
                    b.vx -= imp * nx;
                    b.vy -= imp * ny;
                  }
                }

                // Empuje lateral hidrostático para que el agua, lava y joyas fluyan sin formar arcos
                if (a.tipo === b.tipo && Math.abs(ny) > 0.5) {
                  const empuje = (nx >= 0 ? 1 : -1) * 0.22;
                  a.vx -= empuje;
                  b.vx += empuje;
                }

                // ¡Reacción 1: Agua + Lava = Piedra Obsidiana en cadena + Evaporación limpia!
                if (
                  (a.tipo === "agua" && b.tipo === "lava") ||
                  (a.tipo === "lava" && b.tipo === "agua")
                ) {
                  const gotaAgua = a.tipo === "agua" ? a : b;
                  const gotaLava = a.tipo === "lava" ? a : b;
                  convertirEnPiedra(gotaLava);
                  enfriarClusterLava(gotaLava.x, gotaLava.y, 1.08);

                  gotaAgua.cargasAgua--;
                  if (gotaAgua.cargasAgua <= 0) {
                    gotaAgua.recogida = true;
                    gotaAgua.mesh.visible = false;
                  }
                  if (Math.random() < 0.45) {
                    sonar("golpe");
                    vapor3D(
                      (a.x + b.x) / 2,
                      (a.y + b.y) / 2,
                      0xe2e8f0,
                      5,
                    );
                  }
                }

                // ¡Reacción 2: Piedra recién enfriada transmite el enfriamiento a Lava pegada!
                if (
                  (a.tipo === "piedra" && b.tipo === "lava") ||
                  (a.tipo === "lava" && b.tipo === "piedra")
                ) {
                  const gotaLava = a.tipo === "lava" ? a : b;
                  convertirEnPiedra(gotaLava);
                  enfriarClusterLava(gotaLava.x, gotaLava.y, 0.95);
                }

                // ¡Reacción 3: Lava quema el Tesoro (Oro) si se tocan!
                if (
                  (a.tipo === "lava" && b.tipo === "oro") ||
                  (a.tipo === "oro" && b.tipo === "lava")
                ) {
                  const joya = a.tipo === "oro" ? a : b;
                  if (!joya.recogida) {
                    joya.recogida = true;
                    joya.mesh.visible = false;
                    A.oroPerdido++;
                    vapor3D(joya.x, joya.y, 0x475569, 4);
                    verificarDerrotaPorOroPerdido();
                  }
                }
              }
            }
          }
        }

        // Sincronizar mallas de barriles
        for (const b of A.barriles) {
          if (b.explotado) continue;
          b.mesh.position.set(b.x, b.y, 0.16);
          b.mesh.rotation.z -= b.vx * dt * 1.5;
          if (b.mesh.userData.mecha) {
            const s = 0.85 + Math.sin(A.tiempo * 24) * 0.3;
            b.mesh.userData.mecha.scale.set(s, s, s);
          }
        }

        // Sincronizar mallas 3D de partículas, luz de lava y contacto con Héroe y Orcos
        let lavaX = 0,
          lavaY = 0,
          cuentaLava = 0;

        for (const p of A.particulas) {
          if (p.recogida) continue;

          if (p.tipo === "lava") {
            lavaX += p.x;
            lavaY += p.y;
            cuentaLava++;
            // Pulsación orgánica del magma
            const pulso = 1 + Math.sin(A.tiempo * 6 + p.semillaFase) * 0.08;
            p.mesh.scale.set(pulso, 1 / pulso, pulso);
            p.mesh.rotation.z += dt * 0.8;
          } else if (p.tipo === "agua") {
            // Deformación elástica suave según velocidad
            const vel = Math.min(1.25, 1 + Math.hypot(p.vx, p.vy) * 0.04);
            p.mesh.scale.set(1 / Math.sqrt(vel), vel, 1);
            // El agua que llega al drenaje del fondo se absorbe limpiamente para no tapar el foso
            if (p.y < -3.65) {
              p.recogida = true;
              p.mesh.visible = false;
              if (Math.random() < 0.35) vapor3D(p.x, p.y, 0x38bdf8, 2, 0.55);
              continue;
            }
          } else if (p.tipo === "oro") {
            p.mesh.rotation.z -= p.vx * dt * 2.2;
            p.mesh.rotation.y += dt * 2.8;
          } else if (p.tipo === "piedra") {
            p.mesh.rotation.z -= p.vx * dt * 2.0;
            // La obsidiana enfriada se fractura y se disipa en polvo para nunca bloquear el camino
            p.vidaPiedra = (p.vidaPiedra || 0.6) - dt;
            const esc = Math.max(0.1, Math.min(1, p.vidaPiedra / 0.45));
            p.mesh.scale.setScalar(esc);
            if (p.vidaPiedra <= 0) {
              p.recogida = true;
              p.mesh.visible = false;
              if (Math.random() < 0.4) vapor3D(p.x, p.y, 0x64748b, 3, 0.65);
              continue;
            }
          }

          // Atracción magnética del tesoro cuando está cerca del Caballero
          if (p.tipo === "oro" && A.activo && !A.resuelto && A.heroe) {
            const dxH = A.heroe.x - p.x;
            const dyH = A.heroe.y + 0.55 - p.y;
            const distH = Math.hypot(dxH, dyH);
            if (distH < 2.2 && distH > 0.01) {
              p.vx += (dxH / distH) * dt * 22;
              p.vy += (dyH / distH) * dt * 22;
            }
          }

          p.mesh.position.set(p.x, p.y, 0.14);

          // ¿Toca un Barril la Lava? -> ¡Lo hace explotar!
          if (p.tipo === "lava") {
            for (const b of A.barriles) {
              if (!b.explotado && Math.hypot(p.x - b.x, p.y - b.y) < 0.55) {
                explotarBarril(b);
              }
            }
          }

          // ¿Toca a un Orco? La lava o las rocas que caen eliminan al Orco
          for (const orco of A.orcos) {
            if (!orco.vivo) continue;
            if (Math.hypot(p.x - orco.x, p.y - (orco.y + 0.55)) < 0.85) {
              if (p.tipo === "lava" || p.tipo === "piedra") {
                orco.vivo = false;
                orco.mesh.visible = false;
                if (p.tipo === "lava") {
                  convertirEnPiedra(p);
                }
                sonar("moneda");
                vapor3D(orco.x, orco.y + 0.6, 0x4ade80, 14);
                textoFlotanteAlfiler(
                  "💥 ¡ORCO ELIMINADO!",
                  "#4ade80",
                  orco.x,
                  orco.y + 1.2,
                );
                A.puntos += 60;
              }
            }
          }

          // ¿Toca al Héroe?
          if (
            A.activo &&
            !A.resuelto &&
            A.heroe &&
            Math.hypot(p.x - A.heroe.x, p.y - (A.heroe.y + 0.58)) < 1.08
          ) {
            if (p.tipo === "agua") {
              p.recogida = true;
              p.mesh.visible = false;
              continue;
            } else if (p.tipo === "lava") {
              // ¡La lava quemó al héroe!
              A.resuelto = true;
              A.sacudida = 0.5;
              sonar("perder");
              vapor3D(A.heroe.x, A.heroe.y + 0.7, 0xff2a55, 22);
              textoFlotanteAlfiler(
                "🔥 ¡LA LAVA QUEMÓ AL HÉROE!",
                "#ff4d6d",
                A.heroe.x,
                A.heroe.y + 1.5,
              );
              setTimeout(
                () =>
                  falloBoveda(
                    "La lava alcanzó al héroe. ¡Enfríala con agua primero!",
                  ),
                950,
              );
              break;
            } else if (p.tipo === "oro") {
              p.recogida = true;
              p.mesh.visible = false;
              A.oroRecogido++;
              A.puntos += 15;
              if (A.oroRecogido % 3 === 1) sonar("moneda");
              vapor3D(A.heroe.x, A.heroe.y + 0.9, 0xfef08a, 3, 0.7);
              const pct = actualizarHUDProgreso();

              // Con recoger al menos el 65% del tesoro sin quemarse, supera la bóveda
              if (pct >= 65 && !A.resuelto) {
                A.resuelto = true;
                sonar("ganar");
                const bono = 120 * A.boveda;
                A.puntos += bono;
                vapor3D(A.heroe.x, A.heroe.y + 1.1, 0xfef08a, 24);
                textoFlotanteAlfiler(
                  `🏆 ¡BÓVEDA SUPERADA! +${bono} PTS`,
                  "#fde047",
                  A.heroe.x,
                  A.heroe.y + 1.6,
                );
                marcador();
                setTimeout(() => {
                  if (!A.activo) return;
                  cargarBoveda(A.boveda + 1);
                  marcador();
                }, 1350);
              }
            }
          }
        }

        // Actualizar luz puntual dinámica del magma
        if (cuentaLava > 0) {
          luzLavaDinamica.position.set(
            lavaX / cuentaLava,
            lavaY / cuentaLava,
            1.4,
          );
          luzLavaDinamica.intensity =
            0.95 + Math.sin(A.tiempo * 7) * 0.2;
        } else {
          luzLavaDinamica.intensity = 0;
        }

        // Animación y patrulla de Orcos vivos + Avance del Héroe hacia el tesoro cuando la vía está despejada
        if (A.activo && !A.resuelto && A.heroe) {
          let algunOrcoVivo = false;
          for (const orco of A.orcos) {
            if (!orco.vivo) continue;
            algunOrcoVivo = true;
            if (orco.mesh.userData.brazoMaza) {
              orco.mesh.userData.brazoMaza.rotation.x =
                Math.sin(A.tiempo * 6) * 0.35;
            }
            if (Math.abs(orco.y - A.heroe.y) < 0.5) {
              const bloqueadoPin = A.alfileres.some(
                (pin) =>
                  !pin.sacado && Math.min(pin.y1, pin.y2) < A.heroe.y + 1.2,
              );
              const minX = Math.min(orco.x, A.heroe.x);
              const maxX = Math.max(orco.x, A.heroe.x);
              const bloqueadoMuro = A.segmentosMuro.some(
                (m) =>
                  Math.abs(m.x1 - m.x2) < 0.2 &&
                  m.x1 > minX &&
                  m.x1 < maxX &&
                  Math.min(m.y1, m.y2) <= A.heroe.y + 0.5,
              );
              if (!bloqueadoPin && !bloqueadoMuro) {
                orco.x += Math.sign(A.heroe.x - orco.x) * dt * 2.9;
                orco.mesh.position.x = orco.x;
                if (Math.abs(orco.x - A.heroe.x) < 0.72) {
                  A.resuelto = true;
                  sonar("perder");
                  A.sacudida = 0.45;
                  textoFlotanteAlfiler(
                    "💀 ¡EL ORCO TE ATACÓ!",
                    "#ff4d6d",
                    A.heroe.x,
                    A.heroe.y + 1.5,
                  );
                  setTimeout(
                    () =>
                      falloBoveda(
                        "Elimina primero al Orco con lava, rocas o barriles.",
                      ),
                    950,
                  );
                }
              }
            }
          }

          // Si no quedan Orcos vivos ni alfileres bajos ni lava peligrosa en el piso, el Héroe corre hacia las joyas caídas
          if (!algunOrcoVivo && cuentaLava === 0) {
            const bloqueadoPinBajo = A.alfileres.some(
              (pin) =>
                !pin.sacado && Math.min(pin.y1, pin.y2) < A.heroe.y + 1.3,
            );
            if (!bloqueadoPinBajo) {
              const joyaPiso = A.particulas.find(
                (p) =>
                  !p.recogida && p.tipo === "oro" && p.y < A.heroe.y + 1.4,
              );
              if (joyaPiso) {
                const minX = Math.min(joyaPiso.x, A.heroe.x);
                const maxX = Math.max(joyaPiso.x, A.heroe.x);
                const bloqueadoMuro = A.segmentosMuro.some(
                  (m) =>
                    Math.abs(m.x1 - m.x2) < 0.2 &&
                    m.x1 > minX &&
                    m.x1 < maxX &&
                    Math.min(m.y1, m.y2) <= A.heroe.y + 0.5,
                );
                if (!bloqueadoMuro && Math.abs(joyaPiso.x - A.heroe.x) > 0.25) {
                  A.heroe.x += Math.sign(joyaPiso.x - A.heroe.x) * dt * 3.8;
                  A.heroe.mesh.position.x = A.heroe.x;
                }
              }
            }
          }
        }

        // Actualizar partículas de vapor/chispas
        for (let i = A.efectos.length - 1; i >= 0; i--) {
          const ef = A.efectos[i];
          ef.position.x += ef.userData.vx * dt;
          ef.position.y += ef.userData.vy * dt;
          ef.userData.vida -= dt;
          const s = Math.max(0.1, ef.userData.vida / (ef.userData.vidaMax || 0.6));
          ef.scale.setScalar(s);
          if (ef.userData.vida <= 0) {
            grupoNivel.remove(ef);
            A.efectos.splice(i, 1);
          }
        }

        // Animación del caballero y cámara
        if (A.heroe) {
          const celebrando = A.resuelto && A.oroRecogido > 0;
          A.heroe.mesh.position.x = A.heroe.x;
          A.heroe.mesh.position.y =
            A.heroe.y +
            (celebrando
              ? Math.abs(Math.sin(A.tiempo * 10)) * 0.36
              : Math.sin(A.tiempo * 3.2) * 0.035);
          if (A.heroe.mesh.userData.brazoDer) {
            A.heroe.mesh.userData.brazoDer.rotation.z = celebrando
              ? Math.sin(A.tiempo * 14) * 0.45 + 0.35
              : Math.sin(A.tiempo * 2.5) * 0.06;
          }
        }

        A.sacudida = Math.max(0, A.sacudida - dt * 2.2);
        const sx = (Math.random() - 0.5) * A.sacudida;
        const sy = (Math.random() - 0.5) * A.sacudida;
        const esMovil = window.innerWidth < 650;
        camara.position.set(sx, 0.4 + sy, esMovil ? 15.6 : 13.4);
        camara.lookAt(0, 0.35, 0);
      });

      // =========================================================
      //  INTEGRACIÓN CON ARCADE.UI, DUELOS Y RÉCORDS
      // =========================================================
      const J = {
        modo: null,
        nombres: [],
        resultados: [null, null],
        turno: 0,
        rival: 0,
      };

      const ui = Arcade.ui({
        juego: "alfileres",
        titulo: "Alfileres: Lava y Oro 3D",
        emoji: "📍",
        subtitulo:
          "Saca los pasadores de oro en el orden exacto: enfría la lava, detona barriles, derrota al orco y rescata el tesoro",
        modos: ["solo", "online", "local"],
        textosModo: {
          solo: "🏆 Exploración de Bóvedas (Récord)",
          online: "🌐 Duelo online con un amigo",
          local: "👥 2 jugadores (por turnos)",
        },
        records: true,
        unidadRecord: "pts",
        reglas: [
          "📍 Toca la argolla dorada o la barra de un alfiler para retirarlo.",
          "💧 Cuando el Agua toca la Lava, la petrifica en Piedra Obsidiana y el vapor disipa el calor.",
          "💣 Usa la lava, rocas o barriles explosivos para derrotar a los Orcos guardianes.",
          "💎 Haz que al menos el 65% de las joyas lleguen al caballero (¡no dejes que la lava las funda!).",
        ],
        alEmpezar: empezar,
        alSalir: () => {
          A.activo = false;
          J.modo = null;
          $("hud-alfileres").classList.add("oculto");
        },
      });

      ui.alEvento = (tipo, d) => {
        if (!d || d.partida !== J.partida) return;
        if (tipo === "puntos") J.rival = d.puntos;
        if (tipo === "fin") {
          J.rival = d.puntos;
          J.rivalTermino = true;
          J.alTerminarRival && J.alTerminarRival();
        }
        marcador();
      };

      function marcador() {
        const mio = A.puntos;
        if (J.modo === "online") {
          ui.enviar("puntos", { partida: J.partida, puntos: mio });
        }
        if (J.modo === "solo") {
          return ui.marcador([
            {
              nombre: J.nombres[0] || "Explorador",
              valor: mio,
              detalle: `Bóveda ${A.boveda}`,
              activo: true,
            },
            null,
          ]);
        }
        if (J.modo === "online") {
          const yo = ui.yo;
          const v = yo === 0 ? [mio, J.rival] : [J.rival, mio];
          return ui.marcador(
            [0, 1].map((i) => ({
              nombre: J.nombres[i] + (i === yo ? " (tú)" : ""),
              valor: v[i],
              detalle:
                i === yo
                  ? `Bóveda ${A.boveda}`
                  : J.rivalTermino
                    ? "terminó"
                    : "🌐 resolviendo",
              activo: i === yo,
            })),
          );
        }
        ui.marcador(
          [0, 1].map((i) => ({
            nombre: J.nombres[i],
            valor:
              i === J.turno
                ? mio
                : J.resultados[i] == null
                  ? "—"
                  : J.resultados[i],
            detalle:
              i === J.turno
                ? `Bóveda ${A.boveda}`
                : J.resultados[i] == null
                  ? "espera su turno"
                  : "terminó",
            activo: i === J.turno,
          })),
        );
      }

      function empezar(modo, info) {
        Object.assign(J, {
          modo,
          nombres: info.nombres,
          partida: info.partida,
          semilla: info.semilla || 777,
          resultados: [null, null],
          turno: 0,
          rival: 0,
          rivalTermino: false,
          alTerminarRival: null,
        });
        iniciarExpedicion();
      }

      function iniciarExpedicion() {
        A.activo = true;
        A.puntos = 0;
        cargarBoveda(1);
        $("hud-alfileres").classList.remove("oculto");
        marcador();
        ui.avisar("📍 ¡SACA EL ALFILER CORRECTO!", "#facc15");
      }

      async function falloBoveda(motivo) {
        if (!A.activo) return;
        A.activo = false;
        const pts = A.puntos;

        if (J.modo === "solo") {
          if (
            await ui.ofrecerRevivir({
              texto: `${motivo} ¿Reintentar esta bóveda sin perder tus puntos?`,
            })
          ) {
            A.activo = true;
            cargarBoveda(A.boveda);
            ui.avisar("🔄 ¡INTÉNTALO DE NUEVO!", "#22c55e");
            return;
          }
          $("hud-alfileres").classList.add("oculto");
          return ui.terminar({
            emoji: "💎",
            texto: `¡${pts} puntos!`,
            nota: `Llegaste a la Bóveda ${A.boveda}`,
            record: pts,
            gano: A.boveda > 1 || pts >= 120,
          });
        }

        if (J.modo === "local") {
          J.resultados[J.turno] = pts;
          if (J.turno === 0) {
            J.turno = 1;
            ui.avisar(`Turno de ${J.nombres[1]}`, "#4fb3ff");
            await esperar(1200);
            return iniciarExpedicion();
          }
          $("hud-alfileres").classList.add("oculto");
          const [a, b] = J.resultados;
          return ui.terminar({
            emoji: a === b ? "🤝" : "🏆",
            texto: a === b ? "¡Empate!" : `¡Ganó ${J.nombres[a > b ? 0 : 1]}!`,
            nota: `${J.nombres[0]}: ${a} pts · ${J.nombres[1]}: ${b} pts`,
          });
        }

        ui.enviar("fin", { partida: J.partida, puntos: pts });
        if (!J.rivalTermino) {
          ui.avisar("Esperando a tu rival…", "#4fb3ff");
          await Promise.race([
            new Promise((r) => (J.alTerminarRival = r)),
            esperar(90000),
          ]);
        }
        $("hud-alfileres").classList.add("oculto");
        const yo = ui.yo;
        const gane = pts > J.rival,
          empate = pts === J.rival;
        ui.terminar({
          emoji: empate ? "🤝" : gane ? "🏆" : "🔥",
          texto: empate
            ? "¡Empate!"
            : gane
              ? "¡Rescataste más tesoros!"
              : `Ganó ${J.nombres[1 - yo]}`,
          nota: `Tú: ${pts} pts · ${J.nombres[1 - yo]}: ${J.rival} pts`,
          record: pts,
          gano: gane,
        });
      }

      // Escena inicial de fondo para el menú
      cargarBoveda(1);
    </script>
  </body>
</html>
